"PT-141":{t:"pep",aka:"Bremelanotide, Vyleesi",cls:"melanocortin 4 receptor agonist",status:"approved",half:"About 2.7 hours",route:"Subcutaneous as needed",
 what:"FDA approved in 2019 as Vyleesi for low sexual desire in premenopausal women, at 1.75 mg on demand. Use in men is off-label but studied in early trials. It acts on desire through the brain, not on blood flow like PDE5 drugs.",
 how:"Activates melanocortin receptors in the hypothalamus. Effect on desire is modest in trials; the side effect profile is the bigger story.",
 expect:[["30 to 60 min","Nausea is the headline: about 40 percent in trials, sometimes severe. Flushing and headache."],["Within hours","Blood pressure rises transiently, around 6 mmHg systolic, for up to 12 hours."],["Repeated use","Skin, gums, and breast darkening can appear, more common in darker skin, and may not fully reverse."]],
 effects:["Nausea","Flushing","Headache","Injection site reaction","Transient blood pressure rise","Skin darkening with repeated use"],
 watch:[{t:"Contraindicated with uncontrolled hypertension or known cardiovascular disease because of the pressure rise.",flags:["bp"]},{t:"Label caps use at once per 24 hours and 8 doses a month for a reason. Nausea and pigmentation are dose-related."},{t:"Slows gastric emptying briefly, which can affect oral medications taken near it."}],
 store:"Approved autoinjectors are room temperature. Research vials: refrigerate reconstituted."},

"Melanotan II":{t:"pep",aka:"MT-II, MT2",cls:"nonselective melanocortin agonist",status:"research",half:"About 1 hour",route:"Subcutaneous",
 what:"An unapproved analog of alpha-MSH originally developed as a sunless tanning agent. Never approved anywhere; the selective descendant became PT-141. Sold on the research market and by tanning-focused sellers, both unregulated.",
 how:"Hits melanocortin receptors broadly: skin pigmentation, appetite suppression, and sexual arousal all at once. The nonselectivity is what makes the side effect list long.",
 expect:[["First hour","Nausea, flushing, spontaneous erections, appetite drop."],["Days","Skin darkens with UV exposure, moles darken and new ones can appear."],["Beyond","Pigment changes are slow to fade and can be permanent."]],
 effects:["Nausea","Flushing","Darkening or new moles","Freckling","Appetite suppression","Spontaneous erections","Fatigue"],
 watch:[{t:"Melanoma has been reported in people using it. Causation isn't established, but new or changing moles need to be checked, and darkened moles are harder to monitor."},{t:"Blood pressure and heart rate effects similar to PT-141.",flags:["bp"]},{t:"Kidney injury has been reported in case series. Unregulated product adds contamination risk on top."}],
 store:"Refrigerate reconstituted vials."},

"MOTS-c":{t:"pep",aka:"Mitochondrial open reading frame of the 12S rRNA-c",cls:"mitochondrial-derived peptide",status:"trial",half:"Short",route:"Subcutaneous",
 what:"A 16 amino acid peptide encoded in mitochondrial DNA. Mouse studies showed effects on metabolism and exercise capacity. An analog reached a phase 1 human trial for fatty liver disease before the program was discontinued. What is sold on the research market is the native peptide.",
 how:"Proposed to act through the AMPK pathway, the same energy-sensing pathway exercise and metformin engage, and to translocate to the nucleus under stress to alter gene expression.",
 expect:[["Any timeframe","Nothing subjective in most reports. Claims about endurance are mouse data."]],
 effects:["Injection site reaction","Occasional fatigue"],
 watch:[{t:"Acts on glucose handling in animals; with diabetes medication, watch for lows.",flags:["diabetes"]},{t:"Human safety data is a single small trial of a related compound."}],
 store:"Refrigerate reconstituted vials."},

"5-Amino-1MQ":{t:"pep",aka:"5-amino-1-methylquinolinium",cls:"NNMT inhibitor (small molecule, not a peptide)",status:"research",half:"Not established in humans",route:"Oral",
 what:"Not a peptide at all: a small molecule that blocks the enzyme NNMT, which is elevated in fat tissue. Mouse studies showed reduced fat mass. No human trials. Sold as a research chemical, usually in capsules.",
 how:"NNMT inhibition raises NAD+ and SAM levels in fat cells, shifting them toward energy use. Whether this happens in a person at an oral dose is unknown.",
 expect:[["Any timeframe","No human data to build expectations from."]],
 effects:["Reported anecdotally: none consistent"],
 watch:[{t:"NNMT and its substrates sit in the same pathway as niacin metabolism and methylation. High-dose niacin or methyl donors alongside it are uncharted."}],
 store:"Room temperature, dry, sealed."},

"Tesofensine":{t:"pep",aka:"NS2330",cls:"triple monoamine reuptake inhibitor (small molecule, not a peptide)",status:"approved",half:"About 9 days",route:"Oral daily",
 what:"A small molecule, not a peptide, that blocks reuptake of serotonin, norepinephrine, and dopamine. Originally trialed for Parkinson's and Alzheimer's, it caused weight loss and was redeveloped for obesity. Approved in Mexico in 2023; not approved in the US or Europe. Very long half-life.",
 how:"Raises synaptic monoamines, which suppresses appetite and modestly increases energy expenditure. Same family of action as older stimulant anorectics, which is where the cautions come from.",
 expect:[["First days","Dry mouth, insomnia, restlessness. Appetite drops quickly."],["Week 1 to 4","Heart rate and blood pressure rise measurably in trials. Mood changes reported by some."],["Beyond","With a 9-day half-life it accumulates for weeks; effects and side effects both build."]],
 effects:["Dry mouth","Insomnia","Raised heart rate","Raised blood pressure","Nausea","Constipation","Agitation or mood change","Dizziness"],
 watch:[{t:"Raises blood pressure and heart rate. Contraindicated with uncontrolled hypertension.",flags:["bp"]},{t:"A serotonergic drug. With antidepressants, MAOIs especially, this is a serotonin syndrome and hypertensive risk. Not a combination to run without a prescriber.",flags:["ssri"]},{t:"Stacks with caffeine and other stimulants on heart rate and sleep."}],
 store:"Room temperature, dry."},

"SS-31":{t:"pep",aka:"Elamipretide, MTP-131, Bendavia, Forzinity",cls:"mitochondria-targeted tetrapeptide",status:"approved",half:"About 3 to 5 hours",route:"Subcutaneous daily",
 what:"A four amino acid peptide that concentrates in mitochondria. After years of trials in heart failure, mitochondrial myopathy, and eye disease with mixed results, it received FDA approval in 2025 for Barth syndrome, a rare mitochondrial disorder. That approval is narrow. Anything sold as SS-31 outside a pharmacy is a research chemical, not the approved product.",
 how:"Binds cardiolipin on the inner mitochondrial membrane, stabilizing the electron transport chain and reducing oxidative leak. Effect sizes on function in trials outside Barth syndrome were small.",
 expect:[["First weeks","Injection site reactions are very common in trials. Nothing subjective for most."],["Week 4 to 12","Where trials measured any functional change. Not a quick-effect compound by any account."]],
 effects:["Injection site reaction (very common)","Dizziness","Headache","Nausea","Temporary creatinine rise"],
 watch:[{t:"Transient creatinine elevation was seen in trials, which muddies kidney labs the same way creatine does. Mention it if a panel is drawn.",flags:["kidney"]},{t:"Gray-market product has no manufacturing standard behind it; the approved drug is only dispensed for its indication."}],
 store:"Refrigerate. Approved product has its own labeling; research vials, refrigerate reconstituted and protect from light."},

/* ---------- SUPPLEMENTS, keyed by nutrient ---------- */
"vitaminD":{t:"supp",name:"Vitamin D",forms:"D3 (cholecalciferol) is better absorbed and raises blood levels more than D2. Any brand is fine; the form and taking it with fat matter more.",
 what:"A fat-soluble hormone precursor. Deficiency is common in anyone indoors, dark-skinned, or north of the sunbelt in winter. It's one of the few supplements where a blood test tells you exactly what the dose is doing.",
 how:"Converted in liver and kidney to the active form, which regulates calcium absorption, bone turnover, and immune signaling. Blood levels rise slowly, over about 8 to 12 weeks at a steady dose.",
 lack:"Bone and muscle aches, fatigue, frequent illness, low mood in winter. Serum 25-OH D under 20 ng/mL is deficient; 30 to 50 is where most guidance lands.",
 expect:[["Week 8 to 12","Serum level reaches steady state. This is when a retest actually tells you something."],["Beyond","Mood, immune, and bone effects are long game and mostly invisible day to day."]],
 effects:["Well tolerated at usual doses","Very high intake: high blood calcium, nausea, kidney stones"],
 watch:[{t:"Needs dietary fat to absorb well. Taking it with your largest meal often does more than raising the dose."},{t:"Pair with K2 is common and reasonable; the calcium D3 helps you absorb needs somewhere to go."},{t:"Toxicity is real above roughly 150 ng/mL, and levels over 100 warrant stopping and rechecking calcium.",flags:[]},{t:"With calcium supplements and any kidney issue, the total calcium picture matters.",flags:["kidney"]}],
 markers:["vitD","calciumS"]},

"magnesium":{t:"supp",name:"Magnesium",forms:"Glycinate is gentle and well absorbed. Citrate absorbs well but loosens stools at higher doses. Oxide is cheap and poorly absorbed, mostly a laxative. Threonate is marketed for brain uptake on limited data.",
 what:"A cofactor in hundreds of enzyme reactions including muscle contraction, nerve signaling, and blood sugar handling. Dietary intake is often below recommendation, and heavy sweat loss makes it worse.",
 how:"Absorbed in the small intestine; excess is cleared by the kidneys. Blood levels are a poor guide because the body keeps serum stable by drawing from bone.",
 lack:"Muscle cramps and twitching, poor sleep, headaches, constipation. Serum magnesium under 1.7 mg/dL is low, but normal serum doesn't rule out low tissue stores.",
 expect:[["First nights","Glycinate at bedtime often helps sleep quality within days."],["Week 2 to 4","Cramps and twitches, if magnesium was the cause, usually resolve."]],
 effects:["Loose stools (citrate and oxide especially)","Nausea at high doses","Drowsiness"],
 watch:[{t:"The 350 mg supplemental upper limit is about GI tolerance, not toxicity, in healthy kidneys."},{t:"With reduced kidney function, magnesium accumulates. Needs clearance.",flags:["kidney"]},{t:"Binds thyroid medication and several antibiotics. Four hours of separation.",flags:["thyroid","antibiotic"]}],
 markers:["magS"]},

"zinc":{t:"supp",name:"Zinc",forms:"Picolinate, citrate, and bisglycinate are well absorbed. Oxide is poorly absorbed. Lozenges for colds are a separate, short-term use.",
 what:"Essential for immune function, testosterone synthesis, wound healing, and taste. Deficiency is uncommon on a mixed diet but shows up with heavy sweating, restrictive eating, or high-fiber vegetarian diets.",
 how:"Absorbed in the small intestine through transporters shared with copper and iron, which is why they compete. Excess zinc drives copper deficiency over months.",
 lack:"Slow wound healing, frequent colds, hair thinning, reduced taste or smell, low testosterone in men. Serum zinc under 60 mcg/dL is low.",
 expect:[["First weeks","Nothing subjective unless correcting a real deficiency."],["Beyond","If taking more than about 25 mg a day for months, copper is the number to watch."]],
 effects:["Nausea on an empty stomach","Metallic taste","Copper depletion with sustained high dose"],
 watch:[{t:"The 40 mg upper limit exists because of copper. Sustained higher intake causes anemia and neurological symptoms from copper deficiency."},{t:"Compete with iron and calcium for absorption. Different slots."},{t:"Reduces absorption of some antibiotics.",flags:["antibiotic"]}],
 markers:["zincS","copperS"]},

"omega3":{t:"supp",name:"Omega-3 (EPA and DHA)",forms:"Triglyceride and re-esterified triglyceride forms absorb better than ethyl ester, especially away from food. Read the EPA plus DHA content, not the total fish oil number.",
 what:"Long-chain fatty acids from fish or algae. Solid evidence for lowering triglycerides at 2 to 4 g EPA plus DHA. Cardiovascular outcome evidence is mixed at lower doses. Anti-inflammatory and mood effects have moderate support.",
 how:"Incorporated into cell membranes and converted to signaling molecules that resolve inflammation. Reduces liver triglyceride output.",
 lack:"No clean deficiency syndrome. Low omega-3 index is associated with worse cardiovascular outcomes.",
 expect:[["Week 4 to 12","Triglyceride change is measurable on labs. Joint comfort, if it comes, is on the same timeline."],["Beyond","Membrane composition shifts over months."]],
 effects:["Fishy burps","Loose stools at high doses","Bruising at very high doses"],
 watch:[{t:"Mild blood-thinning effect that adds to anticoagulants and to vitamin E. Relevant before surgery.",flags:["anticoag"]},{t:"Fat-soluble; take with a meal containing fat or absorption drops."},{t:"Oxidized fish oil is worse than none. Buy fresh, keep it cool, and don't stockpile."}],
 markers:["trig","crp"]},

"vitaminC":{t:"supp",name:"Vitamin C",forms:"Ascorbic acid is ascorbic acid. Buffered and liposomal forms are gentler on the stomach; absorption differences are small. Absorption falls sharply above about 200 mg per dose, so split doses beat one large one.",
 what:"Water-soluble antioxidant needed for collagen synthesis and iron absorption. Deficiency is rare but not unheard of on restrictive diets. High doses have modest evidence for shortening colds and none for preventing them in most people.",
 how:"Absorbed by saturable transporters; excess is excreted in urine within hours. Doubles or triples iron absorption from plant sources when taken together.",
 lack:"Bruising, bleeding gums, slow healing, fatigue.",
 expect:[["Any timeframe","Nothing subjective for most. The iron-absorption pairing is the practical use."]],
 effects:["GI upset and diarrhea above about 2 g","Kidney stones in susceptible people at high doses"],
 watch:[{t:"Increases iron absorption. Deliberate if you're low; a reason to reconsider if ferritin or hematocrit already run high.",flags:["trt","hctHigh"]},{t:"High doses can interfere with some glucose meters and lab tests."}],
 markers:[]},

"vitaminK":{t:"supp",name:"Vitamin K",forms:"K2 as MK-7 has a long half-life and once-daily dosing; MK-4 is short-acting. K1 is the plant form and mostly goes to the liver for clotting.",
 what:"Fat-soluble; K1 handles clotting factors, K2 activates proteins that direct calcium into bone and away from arteries. K2 is usually paired with vitamin D. Evidence for K2 and arterial calcification is suggestive, not settled.",
 how:"Activates vitamin K-dependent proteins including osteocalcin and matrix Gla protein.",
 lack:"Easy bruising and bleeding. Frank deficiency is rare in adults not on antibiotics or with fat malabsorption.",
 expect:[["Any timeframe","Nothing subjective. It's a background nutrient."]],
 effects:["No known toxicity from food or supplements"],
 watch:[{t:"Directly opposes warfarin. Any change in intake changes your INR. Do not start, stop, or change without the person managing your dosing knowing.",flags:["anticoag"]},{t:"Fat-soluble; take with food."}],
 markers:[]},

"b12":{t:"supp",name:"Vitamin B12",forms:"Cyanocobalamin is stable and cheap. Methylcobalamin is marketed as active but the difference is small for most. Sublingual and oral both work; absorption of large oral doses is by passive diffusion, so a big dose still delivers.",
 what:"Needed for red blood cell formation and nerve function. Deficiency is common in vegans, older adults, people on metformin or acid blockers, and after gut surgery. It is one of the few supplements where the deficiency does lasting harm and correction is cheap.",
 how:"Absorbed via intrinsic factor in the gut; roughly 1 percent absorbs passively regardless. Stored in the liver for years.",
 lack:"Fatigue, numbness or tingling, memory problems, large red cells on a blood count. Serum B12 under 200 pg/mL is low; borderline needs methylmalonic acid or homocysteine to clarify.",
 expect:[["Week 2 to 8","If correcting a real deficiency, energy and nerve symptoms improve over weeks to months."],["Otherwise","Nothing. There's no established upper limit and no benefit past sufficiency."]],
 effects:["Acne-like breakouts in some","Very well tolerated otherwise"],
 watch:[{t:"Metformin lowers B12 over time. Worth checking yearly.",flags:["diabetes"]},{t:"High-dose folate can mask B12 deficiency on a blood count while nerve damage continues. Check B12 if taking folate."}],
 markers:["b12","homocys"]},

"b6":{t:"supp",name:"Vitamin B6",forms:"Pyridoxine is standard. P5P is the active form and possibly gentler at high doses, though the toxicity concern applies to both.",
 what:"Cofactor in amino acid and neurotransmitter metabolism. Deficiency is uncommon. The important fact about B6 is that it's the water-soluble vitamin that does cause harm in excess.",
 how:"Converted to pyridoxal 5-phosphate, used in over a hundred enzyme reactions.",
 lack:"Rare: rash, cracks at the mouth corners, mood change, anemia.",
 expect:[["Any timeframe","Nothing subjective at usual doses."]],
 effects:["Nerve damage (peripheral neuropathy) with sustained high doses, sometimes below the 100 mg limit"],
 watch:[{t:"Sensory neuropathy from B6 is well documented, occasionally at 50 mg a day over years, and often in people taking several products that each contain some. Add up every source."},{t:"With levodopa or certain seizure medications, B6 interacts. Prescriber territory."}],
 markers:["homocys"]},

"folate":{t:"supp",name:"Folate",forms:"Folic acid is the synthetic form. Methylfolate is the active form and bypasses the MTHFR step, which matters for people with the common variant. Both raise levels.",
 what:"B vitamin for DNA synthesis and cell division. Critical before and during early pregnancy. Also lowers homocysteine with B12 and B6.",
 how:"Converted to methyltetrahydrofolate, the form used in methylation and homocysteine recycling.",
 lack:"Anemia with large red cells, fatigue, mouth sores. Serum folate under 3 ng/mL is low.",
 expect:[["Week 4 to 12","Homocysteine, if elevated, responds on this timeline."]],
 effects:["Well tolerated","Very high doses: sleep disturbance, irritability"],
 watch:[{t:"The 1,000 mcg limit for folic acid exists because high intake masks B12 deficiency on a blood count while B12-related nerve damage continues."},{t:"Interacts with methotrexate and some seizure medications."},{t:"Essential in pregnancy; the recommendation is 400 to 800 mcg daily starting before conception.",flags:["pregnant"]}],
 markers:["folateS","homocys"]},

"iron":{t:"supp",name:"Iron",forms:"Bisglycinate is gentle and well absorbed. Ferrous sulfate is cheap and effective but harsh on the gut. Every-other-day dosing absorbs about as well as daily with fewer side effects, because a dose raises hepcidin for a day.",
 what:"The one supplement where more is not better and where the body has no way to excrete an excess. Deficiency is common in menstruating women, endurance athletes, and vegetarians. Overload is a real risk in men and postmenopausal women who supplement without a measured need.",
 how:"Absorbed in the upper small intestine, regulated by hepcidin. Vitamin C increases absorption; calcium, tea, coffee, and fiber decrease it.",
 lack:"Fatigue, breathlessness on exertion, hair loss, restless legs, poor training tolerance. Ferritin under 30 ng/mL is low for anyone active; under 15 is deficient.",
 expect:[["Week 4 to 8","Ferritin and hemoglobin start to move. Energy often improves before the numbers fully recover."],["Month 3 to 6","Repletion. Retest and reassess whether to continue."]],
 effects:["Constipation","Nausea","Dark stools","Stomach pain (sulfate especially)"],
 watch:[{t:"Testosterone therapy raises red cell production and iron absorption. Standard guidance is no iron unless bloodwork shows genuine deficiency.",flags:["trt","hctHigh"]},{t:"Blocks absorption of thyroid medication and several antibiotics. Four hours apart.",flags:["thyroid","antibiotic"]},{t:"Take on an empty stomach with vitamin C, away from calcium, coffee, and fiber."},{t:"Ferritin above 300 while supplementing is a stop-and-recheck. Iron accumulates in the liver."}],
 markers:["ferritin","hgb","hct","tsat","serumIron"]},

"calcium":{t:"supp",name:"Calcium",forms:"Citrate absorbs without stomach acid and can be taken any time. Carbonate is cheaper, needs food, and is more likely to cause gas and constipation. Neither absorbs well above about 500 mg at once.",
 what:"Structural mineral for bone and teeth, and a signaling ion for muscle and nerve. Most people can hit the target through food; supplementation is for those who can't. Excess from supplements, unlike food, has been linked in some studies to kidney stones and arterial calcification.",
 how:"Absorbed in the small intestine, dependent on vitamin D. Regulated tightly by parathyroid hormone; blood calcium is kept in a narrow band regardless of intake.",
 lack:"Long term: bone loss. Acute symptoms are from low blood calcium, which is a medical condition, not a diet issue.",
 expect:[["Any timeframe","Nothing subjective. It's a bone density and long-horizon nutrient."]],
 effects:["Constipation","Bloating","Kidney stones with excess"],
 watch:[{t:"Blocks absorption of iron, zinc, thyroid medication, and tetracycline and fluoroquinolone antibiotics. Give it its own slot.",flags:["thyroid","antibiotic"]},{t:"With vitamin D pushing absorption, the ceiling matters more; check serum calcium if taking both at high doses."},{t:"Reduced kidney function changes the calcium picture entirely.",flags:["kidney"]}],
 markers:["calciumS"]},

"creatine":{t:"supp",name:"Creatine",forms:"Monohydrate. Every other form is more expensive without being better. Micronized just dissolves easier.",
 what:"The most studied sports supplement there is: strength, power, and lean mass gains are consistent across decades of trials, and there's growing evidence for cognitive effects, especially under sleep deprivation. Safe in healthy kidneys at 3 to 5 g a day for years.",
 how:"Increases phosphocreatine stores in muscle, which regenerates ATP for short intense efforts. Draws water into muscle cells, which is the initial weight bump.",
 lack:"Not a deficiency nutrient. Vegetarians and vegans start with lower stores and respond more.",
 expect:[["Week 1","One to two kg of water weight inside the muscle. Not fat, not bloat."],["Week 2 to 4","Stores saturate at 3 to 5 g daily. Strength and rep capacity effects show up in training."],["Beyond","Effect holds as long as intake continues; stores fall over about a month after stopping."]],
 effects:["Water weight","Occasional stomach upset with large single doses","Cramping reports not supported by trials"],
 watch:[{t:"Raises serum creatinine without harming the kidney, so a routine panel can read high and worry someone. Cystatin C sees past it. Mention it before any panel.",flags:["kidney"]},{t:"With existing kidney disease, worth a conversation, not because of proven harm but because the data is in healthy people.",flags:["kidney"]},{t:"Hair loss concern comes from one small study on DHT and hasn't been replicated."}],
 markers:["creat","egfr"]},

"ashwagandha":{t:"supp",name:"Ashwagandha",forms:"KSM-66 (root extract) and Sensoril (root and leaf) are the studied extracts. Raw powder is variable. Withanolide content is what standardization refers to.",
 what:"An adaptogenic herb with moderate trial evidence for stress and cortisol reduction, sleep, and small effects on strength and testosterone in men. Effects are real but modest, and it is not inert.",
 how:"Appears to blunt HPA axis reactivity and modulate GABA signaling. Also raises thyroid hormone in some studies.",
 lack:"Not a nutrient; no deficiency.",
 expect:[["Week 1 to 2","Calmer baseline, better sleep onset for many. Some notice nothing."],["Week 4 to 8","Where trial effects on cortisol and stress scores were measured."],["Beyond","Some report emotional flatness with long continuous use. Breaks are common."]],
 effects:["Drowsiness","GI upset","Emotional blunting reported by some","Vivid dreams"],
 watch:[{t:"Published case reports of liver injury. Rare, but with enzymes already up, pause and retest.",flags:["liver"]},{t:"Can raise thyroid hormone levels; relevant on thyroid medication or with hyperthyroidism.",flags:["thyroid"]},{t:"Sedating with melatonin, other sedatives, or alcohol."},{t:"Generally advised against in pregnancy.",flags:["pregnant"]}],
 markers:["tsh","alt","ast"]},

"melatonin":{t:"supp",name:"Melatonin",forms:"Immediate release for falling asleep; extended release for staying asleep. Doses under 1 mg often work as well as 5 to 10 mg with less grogginess. Product labeling accuracy is notoriously poor.",
 what:"The hormone your pineal gland releases at dark to signal night. As a supplement it's a timing signal more than a sedative: excellent for jet lag and shift work, modest for ordinary insomnia. Less is often more.",
 how:"Acts on melatonin receptors in the brain's clock to advance sleep timing. Half-life is short, under an hour for immediate release.",
 lack:"Not a deficiency nutrient in the usual sense; production declines with age.",
 expect:[["30 to 60 min","Sleepiness onset for most at a small dose."],["Next morning","Grogginess if the dose was too high or taken too late."],["Beyond","Effect doesn't fade with use in most people; it also doesn't build."]],
 effects:["Morning grogginess","Vivid dreams","Headache","Mild nausea"],
 watch:[{t:"Caffeine anywhere near it is fighting uphill; caffeine's half-life is about five hours."},{t:"Additive with ashwagandha and other sedatives; start low if combining."},{t:"Blood thinner interaction is theoretical but often flagged.",flags:["anticoag"]}],
 markers:[]},

"berberine":{t:"supp",name:"Berberine",forms:"Berberine HCl is standard. Absorption is poor; dihydroberberine and phytosome forms are marketed as better absorbed on limited data. Usually dosed with meals because of the glucose effect.",
 what:"A plant alkaloid with surprisingly solid trial evidence for lowering blood glucose and HbA1c, comparable to metformin in some small studies, plus modest effects on lipids. It is a pharmacologically active compound, not a gentle herbal.",
 how:"Activates AMPK, the same energy-sensing pathway metformin engages, and alters gut bacteria. Also inhibits several liver enzymes that metabolize drugs.",
 lack:"Not a nutrient.",
 expect:[["Week 1 to 2","GI effects settle. Post-meal glucose, if you measure it, moves early."],["Week 8 to 12","HbA1c change measurable on labs."]],
 effects:["Constipation","Diarrhea","Cramping","Nausea"],
 watch:[{t:"With diabetes medication, additive glucose lowering can drive you too low. Prescriber may need to adjust doses.",flags:["diabetes"]},{t:"Inhibits liver enzymes that clear many drugs (CYP3A4, CYP2D6, and others). Statins, blood thinners, and antidepressants are all in that pool.",flags:["statin","anticoag","ssri"]},{t:"With inositol or other glucose-lowering supplements the effect stacks."}],
 markers:["a1c","glucose","ldl","trig"]},

"coq10":{t:"supp",name:"CoQ10",forms:"Ubiquinol is the reduced form and absorbs somewhat better, especially in older adults. Ubiquinone is fine with a fat-containing meal. Both are fat-soluble.",
 what:"A mitochondrial electron carrier and antioxidant. Best evidence is for statin-associated muscle aches, since statins lower CoQ10, and for heart failure as an adjunct. General energy claims are weaker.",
 how:"Shuttles electrons in the mitochondrial respiratory chain and protects membranes from oxidation.",
 lack:"Levels fall with age and with statin use.",
 expect:[["Week 4 to 12","Statin muscle symptoms, if they respond, respond on this timeline."]],
 effects:["Well tolerated","Mild GI upset","Insomnia if taken late in some"],
 watch:[{t:"A reasonable pairing with a statin.",flags:["statin"]},{t:"Structurally similar to vitamin K and may reduce warfarin's effect. Tell whoever manages your INR.",flags:["anticoag"]},{t:"Fat-soluble; take with food."}],
 markers:["ck"]},

"curcumin":{t:"supp",name:"Curcumin",forms:"Plain curcumin barely absorbs. Piperine (black pepper), phospholipid complexes, and micellar forms increase absorption many-fold, which is also where the liver case reports cluster.",
 what:"The active compound in turmeric, with moderate evidence for joint pain and inflammatory markers. Most positive trials used enhanced-absorption forms at 500 to 1,000 mg.",
 how:"Inhibits NF-kB and other inflammatory signaling; also mild antiplatelet activity.",
 lack:"Not a nutrient.",
 expect:[["Week 4 to 8","Joint comfort in trials was measured over this window."]],
 effects:["GI upset","Yellow stool","Reflux"],
 watch:[{t:"Case reports of liver injury, mostly with high-absorption formulations. Pause and retest if enzymes are up.",flags:["liver"]},{t:"Mild antiplatelet effect adds to blood thinners.",flags:["anticoag"]},{t:"Piperine inhibits drug-metabolizing enzymes and raises levels of many medications."},{t:"Fat-soluble; take with food."}],
 markers:["crp","alt","ast"]},

"nac":{t:"supp",name:"NAC",forms:"N-acetylcysteine capsules or effervescent. Sustained-release versions exist. Smells of sulfur; that's normal.",
 what:"A precursor to glutathione, the body's main antioxidant. It is a hospital drug for acetaminophen overdose at high IV doses. Oral supplement evidence is moderate for chronic bronchitis mucus, and suggestive for some psychiatric uses like compulsive behaviors.",
 how:"Provides cysteine, the rate-limiting amino acid for glutathione synthesis. Also thins mucus directly.",
 lack:"Not a nutrient.",
 expect:[["Week 4 to 12","Where trials for the psychiatric and respiratory uses measured effect."]],
 effects:["Nausea","Sulfur smell","GI upset","Rare rash"],
 watch:[{t:"Reduces the antiplatelet effect of nitroglycerin, or intensifies its headache; and adds mild antiplatelet activity of its own.",flags:["anticoag"]},{t:"With active liver enzyme elevation, NAC is not the problem, but it's on the list of things to mention.",flags:["liver"]}],
 markers:["alt","ast"]},

"caffeine":{t:"supp",name:"Caffeine",forms:"Anhydrous capsules, pre-workouts, coffee, tea, energy drinks. Pre-workouts vary from 150 to 400 mg a scoop; read the label. Coffee is 80 to 150 mg a cup depending on size and roast.",
 what:"The most used performance and alertness drug in the world. Reliable evidence for endurance and strength performance at 3 to 6 mg per kg. The 400 mg daily figure is a commonly cited ceiling for healthy adults; sensitivity varies enormously by genetics.",
 how:"Blocks adenosine receptors, which suppresses the sleepiness signal and raises catecholamines. Half-life about 5 hours, longer with oral contraceptives and some liver conditions.",
 lack:"Not a nutrient. Withdrawal headache and fatigue for a few days when stopping.",
 expect:[["30 to 60 min","Peak effect."],["5 hours later","Half of it is still there. A 3 pm dose is 25 percent present at bedtime."],["Weeks","Tolerance to the alertness effect builds; performance effect persists better."]],
 effects:["Anxiety","Jitters","Palpitations","Poor sleep","Reflux","Increased urination"],
 watch:[{t:"Raises blood pressure acutely. On BP medication, pre-workout stimulants belong in the conversation.",flags:["bp"]},{t:"Anywhere near melatonin, it wins."},{t:"Additive with tesofensine, semax, and other stimulants on heart rate and sleep."},{t:"L-theanine takes the edge off without blunting focus, one of the better-supported stacks."}],
 markers:[]},

"glycine":{t:"supp",name:"Glycine",forms:"Powder is cheap and mildly sweet; capsules need several to reach the studied dose. Collagen provides a lot of it incidentally.",
 what:"The simplest amino acid, with a handful of small trials showing 3 g before bed improves subjective sleep quality and next-day alertness. Also the rate-limiting amino acid for glutathione alongside cysteine.",
 how:"Acts as an inhibitory neurotransmitter and appears to lower core body temperature slightly, which favors sleep onset.",
 lack:"Not deficient in the usual sense; the body makes it, though possibly less than optimal.",
 expect:[["First nights","Some notice deeper sleep quickly. Effect is subtle."]],
 effects:["Well tolerated","Mild GI upset at large doses"],
 watch:[{t:"Additive sedation with other sleep aids is mild but real."},{t:"Clozapine interaction is documented; otherwise very few concerns."}],
 markers:[]},

"theanine":{t:"supp",name:"L-theanine",forms:"Suntheanine is the branded, studied form. Generic is fine. Green tea provides 20 to 50 mg a cup.",
 what:"An amino acid from tea with decent evidence for reducing subjective stress and, paired with caffeine, smoothing out jitters without dulling focus. It's mild.",
 how:"Crosses into the brain and increases alpha-wave activity; modulates glutamate and GABA signaling.",
 lack:"Not a nutrient.",
 expect:[["30 to 60 min","Calm focus for a few hours. Some notice nothing at all."]],
 effects:["Very well tolerated","Occasional headache or drowsiness"],
 watch:[{t:"May lower blood pressure slightly; relevant only if already low or medicated.",flags:["bp"]}],
 markers:[]},

"probiotic":{t:"supp",name:"Probiotic",forms:"Strain matters more than CFU count. Lactobacillus rhamnosus GG, Saccharomyces boulardii, and a few Bifidobacterium strains have the most evidence for specific uses. A generic multi-strain blend is a shot in the dark.",
 what:"Live bacteria or yeast. Real evidence for antibiotic-associated diarrhea, some IBS symptoms, and a few other narrow uses. General gut health claims are mostly marketing. Effects are strain-specific and mostly disappear when you stop.",
 how:"Transient colonization; interacts with the immune system and existing flora rather than replacing them.",
 lack:"Not a nutrient.",
 expect:[["Week 1 to 2","Gas or bloating as things shift, then usually settles."],["Week 4 and beyond","Where any symptom change would be judged."]],
 effects:["Gas","Bloating","Rare infection in immunocompromised people"],
 watch:[{t:"With antibiotics, take a few hours apart or the antibiotic kills the probiotic.",flags:["antibiotic"]},{t:"S. boulardii and severe immune suppression or central lines have case reports of bloodstream infection."}],
 markers:[]},
/* ---- hormones and anabolics --------------------------------------------
   Same treatment as everything else on this page: what it is, how it works,
   where the law actually sits, what people report, and then the part this
   app can do something with, which is the bloodwork. No doses, no protocols,
   no cycle lengths. Those are not the app's business and never were. ---- */

"Somatropin (HGH)":{t:"drug",aka:"Genotropin, Norditropin, Omnitrope, Humatrope, Saizen, recombinant hGH",cls:"recombinant human growth hormone",status:"approved",half:"About 3 to 4 hours in blood; the IGF-1 rise it causes lasts far longer",route:"Subcutaneous",
 what:"The same 191 amino acid protein the pituitary makes, grown in bacteria or cell culture. Approved since the mid 1980s for growth hormone deficiency in children and adults, Turner syndrome, Prader-Willi, small for gestational age, short bowel syndrome and HIV-associated wasting. Every use aimed at body composition, recovery or aging sits outside those indications, and in the US that particular off-label territory has a statute written for it specifically.",
 how:"Binds the growth hormone receptor and signals through JAK2 and STAT5. Most of the growth effect is indirect: the liver answers by producing IGF-1, and IGF-1 does the building. The fat effect is more direct, since growth hormone acts on fat cells to release stored fat while blunting insulin at the same time. That last part is why the metabolic markers move first and most reliably.",
 legal:"Growth hormone is the one drug in this list with its own criminal statute. Under 21 USC 333(e), distributing it or holding it with intent to distribute for anything other than an approved indication is a federal felony carrying up to five years. It is not a scheduled substance, so it sits outside the controlled substance framework entirely and is treated more harshly than most of what is in it. A prescription for an approved indication is ordinary medicine. A clinic marketing it for aging is the situation the statute was written about. Banned in all tested sport.",
 expect:[["First week","Fluid arrives early. Rings tighter, ankles puffy, hands stiff or numb overnight. Carpal tunnel symptoms are the classic first complaint and track dose closely."],["Week 2 to 6","The fluid effects either settle or become the reason people reduce. Sleep changes get reported in both directions."],["Month 2 to 6","Trial-measured changes in body composition happen over months and are modest: a few pounds of fat down, lean mass up, some of that lean figure being water. Fasting glucose drifting upward is common across this stretch."],["Long running","Sustained high dose use is where tissue growth stops being cosmetic. Gut distension, jaw and brow changes and enlarged organs are reported in bodybuilding populations, and those changes do not reverse."]],
 effects:["Water retention","Carpal tunnel symptoms","Joint pain","Numb or tingling hands","Raised blood glucose","Headache","Injection site reaction","Gynecomastia in some"],
 watch:[{t:"Growth hormone and IGF-1 both tell cells to divide. Active cancer is a contraindication in the labeling, not a caution."},{t:"Insulin resistance is the reliable effect here, not the rare one. Medication doses set before this started may not fit after it.",flags:["diabetes"]},{t:"Fluid retention adds to what testosterone already does, and blood pressure is where the two meet.",flags:["trt","bp"]},{t:"It can unmask a thyroid that was quietly compensating, so TSH and free T4 are worth having on both sides of starting.",flags:["thyroid"]},{t:"This is a counterfeit-heavy market. A generic vial labeled in iu tells you nothing about what is in it, and the price gap between real and fake is the whole business model."}],
 labs:[{m:"igf1",d:"up",t:"The marker that actually tracks the dose. Growth hormone itself is pulsatile and a single serum draw says close to nothing, so clinics titrate against IGF-1 instead. Reference ranges are age banded, which means a result that reads normal for a 25 year old is high for a 55 year old."},{m:"glucose",d:"up",t:"Rises through direct insulin antagonism, often within the first weeks."},{m:"insulin",d:"up",t:"Fasting insulin climbs before fasting glucose does. Same process, earlier signal."},{m:"a1c",d:"up",t:"A three month average, so it confirms a trend rather than catching one."},{m:"ft4",d:"down",t:"Conversion of T4 to T3 increases, which can expose an underactive thyroid that was compensating on its own."},{m:"trig",d:"down",t:"Lipids generally improve modestly, triglycerides most consistently."}],
 store:"Refrigerate. Pharmaceutical pens and cartridges carry a brand-specific in-use window, and that window governs over any general rule."},

"Testosterone cypionate":{t:"drug",aka:"Depo-Testosterone, test cyp; testosterone enanthate behaves the same way",cls:"esterified testosterone, androgen receptor agonist",status:"approved",ctrl:"Schedule III",half:"About 8 days for the cypionate ester",route:"Intramuscular or subcutaneous",
 what:"Testosterone with an eight carbon ester attached so it releases slowly out of an oil depot. FDA approved for male hypogonadism and the most prescribed androgen in the US by a wide margin. Enanthate is the same drug with a slightly shorter ester and behaves interchangeably. It is also the base of nearly every non-medical androgen protocol, which is why an identical vial can be entirely legitimate or entirely not depending on nothing but a prescription.",
 how:"The ester is cleaved in circulation and the freed testosterone binds the androgen receptor. Two conversions matter as much as the parent compound. Aromatase turns some of it into estradiol, which handles bone, mood, libido and joint comfort and is not a side effect to be eliminated. 5-alpha-reductase turns some into DHT, which drives the scalp, skin and prostate effects. Meanwhile the pituitary reads the level and stops sending LH and FSH, which shuts down your own production and, with it, sperm production.",
 legal:"Schedule III in the US under the Anabolic Steroid Control Act. With a prescription it is ordinary medicine. Without one, possession is a misdemeanor and distribution a felony, and the same applies to every anabolic on this page. A telehealth prescription is still a prescription, though prescribing standards vary enormously between clinics. Banned in tested sport.",
 expect:[["Week 1 to 3","Levels are still climbing toward steady state. Early reports are mood and libido, often unstable in the first weeks rather than uniformly improved."],["Week 4 to 6","Roughly where a fixed schedule reaches steady state. This is the earliest a trough draw means anything."],["Week 6 to 12","Strength and lean mass changes become measurable. Acne, oily skin and water retention show up here if they are going to. Testicular volume drops."],["Month 3 onward","Hematocrit is the number still climbing after everything else has settled, which is why it gets rechecked for as long as this runs."]],
 effects:["Acne","Oily skin","Water retention","Testicular shrinkage","Reduced fertility","Raised hematocrit","Scalp hair loss if predisposed","Gynecomastia","Mood changes","Worsened sleep apnea","Injection site soreness"],
 watch:[{t:"Rising hematocrit is the most common lab abnormality on testosterone and the one with a hard action threshold. The checker in this app already runs those rules: 52 percent is where clinicians stop ignoring it, 54 is where guidelines call for action.",flags:["hctHigh","trt"]},{t:"Supplemental iron works directly against a hematocrit that testosterone is already pushing up.",flags:["hctHigh","trt"]},{t:"Fertility suppression is the mechanism working, not a rare event. It is usually reversible, but recovery takes months and is not guaranteed. If children are on the plan, that conversation belongs before the first injection."},{t:"Untreated sleep apnea gets worse on androgens. Snoring that arrives with the therapy is worth investigating rather than absorbing.",flags:["bp"]},{t:"Gray market oil is the volume end of the counterfeit trade. Underdosed, mislabeled and non-sterile product all exist, and an abscess is a hospital visit."}],
 labs:[{m:"testT",d:"up",t:"Draw at trough, right before the next injection, or the number describes the peak instead of the floor. Where it should land is between you and whoever prescribes it."},{m:"hct",d:"up",t:"The one to watch. Androgens raise red cell mass through erythropoietin and suppressed hepcidin, and it keeps drifting for months after everything else has settled."},{m:"hgb",d:"up",t:"Moves with hematocrit and comes on the same panel."},{m:"ferritin",d:"down",t:"Falls as iron is pulled into new red cells. A low ferritin here is not the same finding as a low ferritin without androgens on board."},{m:"e2",d:"up",t:"Rises with dose through aromatization. In men, ask for the sensitive or LC-MS assay, since standard immunoassays are unreliable at male concentrations."},{m:"lh",d:"down",t:"Suppressed to near zero within weeks. This is what confirms the shutdown instead of assuming it."},{m:"fsh",d:"down",t:"Same suppression, and the one that tracks the fertility side."},{m:"shbg",d:"down",t:"Falls, which raises the free fraction. It is why total and free testosterone can tell different stories off the same draw."},{m:"hdl",d:"down",t:"Drops modestly on injectable testosterone. Orals do far worse."},{m:"apob",d:"up",t:"The lipid marker carrying the most information about cardiovascular risk, and the one most often missing from a standard panel."},{m:"psa",d:"up",t:"Usually a small rise as the prostate responds. A sharp jump is a urology question rather than a dose question."}],
 store:"Oil vials sit at room temperature and stay stable for years, unlike the peptides in this app. Enter one as its total mg in its total mL and the syringe math on the Stock page comes out right: a 10 mL vial at 200 mg/mL is 2000 mg in 10 mL."},

"Nandrolone decanoate":{t:"drug",aka:"Deca-Durabolin, deca; NPP is the same hormone on a short ester",cls:"19-nortestosterone, injectable androgen",status:"approved",ctrl:"Schedule III",half:"About 6 to 12 days for the decanoate ester, with metabolites detectable for many months",route:"Intramuscular",
 what:"Nandrolone on a long ester. FDA approved for the anemia of chronic kidney disease, an indication that tells you something on its own: it raises red cell production reliably enough to have been prescribed for exactly that. The Deca-Durabolin brand left the US market years ago while generic nandrolone decanoate kept its approval. It is the compound most associated with joint comfort, and also with a specific sexual dysfunction well known enough to have a nickname.",
 how:"A 19-nortestosterone. Where testosterone gets amplified into DHT by 5-alpha-reductase in scalp and prostate tissue, nandrolone is reduced into a weaker metabolite instead, which is why it is comparatively gentle on hair and prostate. It aromatizes only weakly. What it does do is act on the progesterone receptor, and that progestogenic activity sits behind both the prolactin effects and much of the sexual dysfunction people report even with estradiol sitting in range.",
 legal:"Schedule III. A prescription product on paper, rarely prescribed in practice. Banned in sport, and worth knowing that its metabolites carry the longest detection window of anything here, up to a year and beyond, which has ended careers on tests taken long after the fact.",
 expect:[["Week 1 to 3","Slow. The long ester builds over weeks and nothing much happens quickly."],["Week 3 to 6","Joint comfort is the report this compound is known for. Water retention arrives alongside it."],["Week 6 onward","Mass accumulates gradually. Sexual dysfunction, when it shows up, tends to arrive here and does not always track estradiol, which is what makes it confusing to chase."],["After stopping","Recovery of natural production runs slower than with testosterone. Suppression can outlast the last injection by months."]],
 effects:["Raised prolactin","Sexual dysfunction","Water retention","Raised hematocrit","Mood changes","HDL suppression","Suppressed natural testosterone","Long detection window"],
 watch:[{t:"Prolactin is the marker that separates a nandrolone problem from an estradiol problem. The two get confused constantly because the symptoms read the same from the inside."},{t:"It raises red cell production reliably. That was the approved use.",flags:["hctHigh","trt"]},{t:"Nandrolone metabolites cross react with some testosterone immunoassays, so a total testosterone result can read higher than the testosterone actually present."},{t:"Suppression of the axis is deeper and longer lasting than testosterone alone, and running it without testosterone alongside is where the sexual side effects concentrate."}],
 labs:[{m:"prolactin",d:"up",t:"The distinguishing marker for this compound. If libido or erectile function drops while estradiol looks fine, this is the number that has not been checked."},{m:"hct",d:"up",t:"Rises reliably. This was an approved treatment for anemia, which is the same effect viewed from the other side."},{m:"hgb",d:"up",t:"Moves with hematocrit and comes on the same panel. If one is up and the other is not, the draw is more likely the explanation than the compound."},{m:"e2",d:"mixed",t:"Aromatizes only weakly, so estradiol can read low while the effects look estrogenic. The progesterone receptor activity is doing that, and no estradiol number will show it."},{m:"testT",d:"mixed",t:"Assay interference cuts both ways here. Nandrolone suppresses your own testosterone hard while its metabolites can inflate the reading on some immunoassays."},{m:"lh",d:"down",t:"Suppressed, and slower to come back than with testosterone."},{m:"fsh",d:"down",t:"Same, and the one that matters for sperm production."},{m:"hdl",d:"down",t:"Falls, in line with other injectable androgens."}],
 store:"Oil, room temperature, out of light. Enter the vial as total mg in total mL on the Stock page."},

"Trenbolone acetate":{t:"drug",aka:"tren, Finaplix, Revalor implants; enanthate is the long ester version",cls:"19-nortestosterone, veterinary androgen",status:"vet",ctrl:"Schedule III",half:"Roughly a day for the acetate ester, which is why injection frequency is high",route:"Intramuscular",
 what:"A cattle growth implant. Trenbolone has never been approved for human use in any country, and there are no human pharmacokinetic or safety studies to consult, so every statement about what it does in people traces back to user reports and cattle data. What sustains it is potency: per unit it is among the strongest androgen receptor agonists available, and the visual effect it produces is the reason people accept the rest of it.",
 how:"A 19-nortestosterone with two extra double bonds that make it impossible to aromatize and give it very high affinity at the androgen receptor. No estradiol is produced from it at all. It carries progestogenic activity like nandrolone, and it binds the glucocorticoid receptor, which is part of the argument for its effect on fat.",
 legal:"Schedule III in the US and approved for humans nowhere. The veterinary implant is legal for cattle. Converting it or holding it for human use is not, and unlike testosterone there is no prescription route that makes it legal, because there is no human product to prescribe. Banned in sport.",
 expect:[["First days","Night sweats and broken sleep are the reports that come up first and most consistently. Some report a short violent cough immediately after injecting."],["Week 1 to 3","Anxiety, irritability and reduced cardiovascular tolerance are common. Conditioning drops noticeably for many people, and it is not subtle."],["Week 3 onward","The visible effects that keep it in circulation. The lipid picture by this point is usually the worst of anything on this page."]],
 effects:["Night sweats","Insomnia","Anxiety and irritability","Shortness of breath","Cough after injection","Severe HDL suppression","Raised blood pressure","Prolactin effects","Aggression"],
 watch:[{t:"There is no human safety data. Not thin data, none. Anything presented as a safe way to use it is extrapolation from cattle studies and forum consensus."},{t:"The HDL suppression reported with this compound is the most severe of any commonly used androgen, and it happens fast.",flags:["statin"]},{t:"Reduced cardiovascular capacity is a near universal report and nothing benign explains it.",flags:["bp"]},{t:"Kidney markers frequently read abnormal on trenbolone. Creatinine, BUN and dark urine come up repeatedly, and with no human data there is nothing to interpret those numbers against.",flags:["kidney"]}],
 labs:[{m:"hdl",d:"down",t:"Falls further and faster than with any other androgen in common use. Single digit results appear in user-posted panels."},{m:"apob",d:"up",t:"The number that carries the risk. If only one lipid marker gets ordered, this is the one worth arguing for."},{m:"ldl",d:"up",t:"Rises alongside ApoB, though on this compound the collapse in HDL is the more dramatic half of the picture and the one that shows up first."},{m:"prolactin",d:"up",t:"Progestogenic activity raises it, same as nandrolone, and the sexual side effects follow the same pattern."},{m:"hct",d:"up",t:"Rises like the rest of the class, and with blood pressure and shortness of breath already common here, viscosity is not a side issue."},{m:"creat",d:"up",t:"Frequently elevated. Some of that is muscle and training, some of it may not be, and there is no human study that separates the two."},{m:"bun",d:"up",t:"Often up alongside creatinine, which is the pattern that sends people to a nephrologist."},{m:"e2",d:"down",t:"It cannot aromatize, so estradiol falls if nothing else is supplying it. A low reading here is the expected consequence, not a target that was hit."}],
 store:"Oil, room temperature, out of light."},

"Drostanolone propionate":{t:"drug",aka:"Masteron, Masteril, Drolban, drost",cls:"injectable DHT derivative",status:"withdrawn",ctrl:"Schedule III",half:"About 2 days for the propionate ester",route:"Intramuscular",
 what:"Marketed in the 1960s and 1970s as a breast cancer treatment, working on the same anti-estrogenic logic that later produced the aromatase inhibitors. Long discontinued as a medicine. It survives in the gray market as a cosmetic compound run near a show or a shoot, which describes what it is understood to do: change how tissue looks rather than how much of it there is.",
 how:"A DHT derivative. It cannot be aromatized, and it competes at the aromatase enzyme itself, so it lowers the estradiol produced from anything running alongside it. High androgenic activity relative to anabolic, which is why the skin, scalp and prostate effects sit at the front of the list.",
 legal:"Schedule III with no human product on the market anywhere. Everything in circulation is made for the gray market. Banned in sport.",
 expect:[["Week 1 to 2","Little to report. The propionate ester is short, so levels rise and fall quickly and the injection schedule is frequent."],["Week 2 to 4","The dry, hard appearance it is used for, which is largely a change in water distribution rather than tissue."],["Ongoing","Hair loss and acne are the reports that accumulate, and estradiol keeps drifting down as long as it runs."]],
 effects:["Scalp hair loss","Acne","Low estradiol symptoms","Joint dryness","Raised hematocrit","HDL suppression","Aggression","Prostate effects"],
 watch:[{t:"Its anti-estrogenic action stacks with an aromatase inhibitor, and estradiol driven to the floor produces aching joints, flat mood and absent libido that then get blamed on the androgen instead."},{t:"A DHT derivative that is not converted further, so scalp and prostate get the undiluted version of the androgenic effect. Predisposition to male pattern loss is the deciding factor."},{t:"The dry look people are after is partly a diuretic-like shift in water. Blood pressure and hydration are worth watching alongside it.",flags:["bp"]}],
 labs:[{m:"e2",d:"down",t:"Falls, by design and by mechanism. In men the sensitive assay matters more than usual here, because immunoassays get least reliable exactly at the low end this pushes into."},{m:"hct",d:"up",t:"Rises with the rest of the class. Nothing about this one is gentler on red cell mass than testosterone is."},{m:"hdl",d:"down",t:"Falls, less severely than the orals and more than testosterone alone. Non-aromatizing androgens tend to be harder on HDL than aromatizing ones."},{m:"psa",d:"up",t:"Worth having, since a strongly androgenic non-aromatizing compound is the profile most likely to move it."},{m:"lh",d:"down",t:"Suppressed, and this is rarely run alone, so the panel reads as the sum of whatever else is going in."},{m:"fsh",d:"down",t:"Suppressed alongside LH, which is what the fertility side tracks."},{m:"shbg",d:"down",t:"Falls, which lifts the free fraction of everything else present."}],
 store:"Oil, room temperature, out of light."},

"Oxandrolone":{t:"drug",aka:"Anavar, Oxandrin, var",cls:"oral 17-alpha-alkylated DHT derivative",status:"approved",ctrl:"Schedule III",half:"About 9 hours",route:"Oral",
 what:"An oral steroid approved in 1964 and still an approved product for regaining weight after surgery, trauma, chronic infection or long term corticosteroid use. The strongest evidence sits in severe burn patients, where it reliably improves lean mass recovery. The Oxandrin brand left the US market and generic oxandrolone stayed. Its reputation as the mild one is about androgenic side effects only. The lipid and liver picture is not mild at all, and that is the part a panel can see.",
 how:"A DHT derivative with a 17-alpha-alkyl group added so it survives the first pass through the liver. That single modification is what makes an oral steroid possible and what makes it hepatic. It does not aromatize, so it produces no estradiol of its own, and it drops SHBG hard, which changes how every other hormone result on the panel reads.",
 legal:"Schedule III, prescription only, and legitimately prescribed in burn and trauma medicine. Banned in sport. It is also among the most counterfeited compounds in this category, commonly substituted with something cheaper and more androgenic, which is a particular problem for the women who choose it specifically to avoid that.",
 expect:[["First 2 weeks","Strength and pumps are the usual early reports. Nothing visible yet."],["Week 2 to 6","Lipid changes are well established by here even though nothing feels different. Muscle fullness and vascularity are the common reports."],["Beyond","Appetite suppression and joint dryness get reported. Whatever the timeline, the liver and lipid numbers are the part with actual data behind them."]],
 effects:["Suppressed HDL","Raised liver enzymes","Appetite suppression","Joint dryness","Acne","Suppressed natural testosterone","Raised blood pressure","Headache"],
 watch:[{t:"HDL suppression on oral steroids is not subtle. Halving is typical and it happens within weeks, long before anything is felt.",flags:["statin"]},{t:"The 17-alpha-alkyl group is a liver stressor. Enzymes rising while nothing feels wrong is the normal presentation, which is the argument for measuring rather than waiting for a symptom.",flags:["liver"]},{t:"17-alpha-alkylated steroids potentiate warfarin and similar anticoagulants substantially.",flags:["anticoag"]},{t:"Creatine kinase runs high in anyone lifting, and training alone raises ALT and AST. GGT and ALP come from the liver and not from muscle, so ordering them alongside is what separates the two explanations."}],
 labs:[{m:"hdl",d:"down",t:"The headline effect. Reductions of half or more are routine on oral steroids and this one is no exception despite its reputation."},{m:"apob",d:"up",t:"Rises. Ask for it, since a standard lipid panel will not include it."},{m:"ldl",d:"up",t:"Rises alongside ApoB. The HDL collapse gets the attention, but both ends of the panel move on an oral."},{m:"alt",d:"up",t:"Expected rather than exceptional. Interpret it next to GGT and creatine kinase, not on its own."},{m:"ast",d:"up",t:"Rises with ALT, and shares the same ambiguity with muscle."},{m:"ggt",d:"mixed",t:"Often stays in range, which is the point of ordering it. Liver produces GGT and muscle does not, so a normal GGT with high ALT and AST points somewhere other than the liver."},{m:"shbg",d:"down",t:"Drops steeply. That inflates free testosterone and makes total testosterone look worse than the free number suggests, so both are needed to read the panel correctly."},{m:"testT",d:"down",t:"Falls, since the axis shuts down as it does with any androgen, and the low SHBG makes the total look worse than the free number does."},{m:"lh",d:"down",t:"Suppressed, which is the confirmation that shutdown has happened rather than an assumption that it has."}],
 store:"Tablets at room temperature and dry. Track a bottle as a container with a serving count on the Stock page."},

"Methandienone":{t:"drug",aka:"Dianabol, dbol, methandrostenolone, anabol",cls:"oral 17-alpha-alkylated testosterone derivative",status:"withdrawn",ctrl:"Schedule III",half:"About 3 to 6 hours",route:"Oral",
 what:"The first anabolic steroid designed for performance rather than for medicine, synthesized by Ciba in the late 1950s and sold as Dianabol for osteoporosis and burn recovery. The FDA withdrew approval in the 1980s and there has been no legal human product in the US since. Everything in circulation now is made for the gray market.",
 how:"17-alpha-alkylated so it survives oral dosing, with the liver consequences that implies. It does aromatize, but into methylestradiol rather than estradiol, and that distinction matters in practice: aromatase inhibitors control it poorly and standard estradiol assays may not read it at all. So the estrogenic effects can be obvious while the number on the panel looks unremarkable.",
 legal:"Schedule III with no approved human product in the US. Approval was withdrawn on grounds that included a lack of demonstrated benefit for the indications it was sold under. Banned in sport.",
 expect:[["First week","Weight moves fast, and most of it is water and intracellular glycogen. Strength climbs quickly. Blood pressure usually climbs with it."],["Week 2 to 4","Where liver enzymes are typically already up on a panel and the lipid picture has deteriorated, generally with nothing felt at all."],["After stopping","Much of the weight leaves as fast as it arrived, which is where the rebound reports come from."]],
 effects:["Rapid water retention","Raised blood pressure","Raised liver enzymes","Gynecomastia","HDL suppression","Headache","Acne","Increased appetite","Mood changes"],
 watch:[{t:"Liver enzyme elevation is expected on this compound rather than exceptional, and it is silent until it is not.",flags:["liver"]},{t:"Methylestradiol is not the estradiol your lab measures. A normal estradiol result alongside obvious estrogenic effects is the known pattern here, and treating the number instead of the effect goes wrong in both directions."},{t:"Blood pressure moves early, mostly through fluid. It is one of the few effects here you can actually track at home daily, and this app takes the readings.",flags:["bp"]},{t:"17-alpha-alkylated steroids potentiate warfarin and similar anticoagulants.",flags:["anticoag"]}],
 labs:[{m:"alt",d:"up",t:"Rises, often substantially and often within the first weeks."},{m:"ast",d:"up",t:"Rises with ALT, and training raises both on its own, which is why neither settles the question alone."},{m:"ggt",d:"mixed",t:"Frequently stays in range even when ALT and AST are well up. That combination is what makes the muscle-versus-liver question worth asking rather than assuming."},{m:"bili",d:"up",t:"Total bilirubin rising is the finding that shifts this from routine to urgent, since it points at cholestasis rather than enzyme leakage."},{m:"hdl",d:"down",t:"Falls sharply, as with any oral in this class."},{m:"apob",d:"up",t:"Rises, and it is the marker worth asking for by name, since a standard lipid panel leaves it off."},{m:"hct",d:"up",t:"Rises, and the fluid retention this compound is known for stacks with it on blood pressure."},{m:"e2",d:"mixed",t:"An unreliable reading on this compound specifically. Methylestradiol drives the effects while sitting outside what the assay is built to detect."}],
 store:"Tablets at room temperature and dry. Track a bottle as a container with a serving count on the Stock page."},

"Stanozolol":{t:"drug",aka:"Winstrol, winny, stanabol",cls:"17-alpha-alkylated DHT derivative, oral or injectable",status:"withdrawn",ctrl:"Schedule III",half:"About 9 hours oral, roughly a day for the injectable suspension",route:"Oral or intramuscular",
 what:"Approved as Winstrol for hereditary angioedema and, earlier, for anemia. Withdrawn from the US human market in the early 2000s, with the veterinary product persisting in some countries. Its lasting fame comes from the 1988 Olympics. The unusual thing about it is structural: the injectable form is 17-alpha-alkylated too, so unlike every other injectable here, putting it in a syringe does nothing to spare the liver.",
 how:"A DHT derivative rebuilt with a pyrazole ring and 17-alpha-alkylated. It does not aromatize. It lowers SHBG more sharply than almost anything else in circulation, which raises the free fraction of everything else present. The joint discomfort people report is usually put down to that combination plus the absence of estrogen.",
 legal:"Schedule III with no approved human product in the US. Banned in sport, where it remains one of the most frequently detected substances.",
 expect:[["First week","Strength reports come early. So does the dry appearance it is used for."],["Week 2 to 4","Joint and tendon discomfort is the complaint that defines this compound. Lipids by now have moved considerably."],["Ongoing","Tendon complaints accumulate, and the combination of rapid strength gain with less pliable connective tissue is the mechanism people describe behind tendon injuries."]],
 effects:["Joint pain and dryness","Tendon complaints","Raised liver enzymes","Severe HDL suppression","Acne","Scalp hair loss","Raised blood pressure"],
 watch:[{t:"The injectable version is 17-alpha-alkylated as well. Anyone assuming the injection protects the liver is working from a rule that holds for every compound here except this one.",flags:["liver"]},{t:"Lipid changes on stanozolol are the most severe of the common orals, and they arrive quickly.",flags:["statin"]},{t:"17-alpha-alkylated steroids potentiate warfarin and similar anticoagulants.",flags:["anticoag"]},{t:"Tendon and joint complaints are the signature here, and they arrive alongside strength gains that make the tissue more likely to be tested."}],

/* Peptide and hormone entries answer to their name and to the aka list.
   Supplements answer to a nutrient key. Orals like oxandrolone are stored
   as supplements but named, so they match on name before nutrient. */
function refFor(it){
  if(!it) return null;
  const n=String(it.name||"").trim().toLowerCase();
  if(n){
    for(const k of Object.keys(REF)){ if(REF[k].t!=="supp"&&k.toLowerCase()===n) return k; }
    for(const k of Object.keys(REF)){
      const e=REF[k]; if(e.t==="supp") continue;
      const aka=String(e.aka||"").toLowerCase();
      if(aka.split(",").some(a=>a.trim()&&a.trim()===n)) return k;
    }
  }
  if(isPep(it)) return null;
  return it.nutrient&&REF[it.nutrient]?it.nutrient:null;
}
const refTitle = k => REF[k].t==="supp"?REF[k].name:k;
const refKind = k => REF[k].t==="pep"?"peptide":REF[k].t==="drug"?"hormone":"supplement";
/* the library row a reference page can prefill from, when there is exactly one */
function libForRef(k){
  const e=REF[k]; if(!e) return null;
  if(e.t==="supp"){ const hits=LIB.filter(x=>x.nut===k); return hits.length===1?hits[0]:null; }
  const t=String(k).toLowerCase();
  const aka=String(e.aka||"").toLowerCase().split(",").map(x=>x.trim()).filter(Boolean);
  return LIB.find(x=>x.n.toLowerCase()===t)||LIB.find(x=>aka.includes(x.n.toLowerCase()))||null;
}

const nowTime = () => { const d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); };

function parsePlan(str){
  const steps=[];
  for(const tok of String(str||"").split(",")){
    const t=tok.trim(); if(!t) continue;
    const m=t.match(/^(\d*\.?\d+)\s*(?:[x\u00d7]\s*(\d+))?$/i);
    if(!m) return null;
    steps.push({dose:parseFloat(m[1]),weeks:m[2]?parseInt(m[2]):null});
  }
  return steps.length?steps:null;
}
function planDose(it,date){
  if(!it||!it.plan||!it.plan.length) return null;
  let wk=Math.floor(Math.max(0,between(it.startDate,date))/7);
  for(const s of it.plan){
    if(s.weeks==null||wk<s.weeks) return s.dose;
    wk-=s.weeks;
  }
  return it.plan[it.plan.length-1].dose;
}
function planStep(it,date){
  if(!it||!it.plan||!it.plan.length) return null;
  let wk=Math.floor(Math.max(0,between(it.startDate,date))/7);
  for(let i=0;i<it.plan.length;i++){
    const s=it.plan[i];
    if(s.weeks==null||wk<s.weeks) return i+1;
    wk-=s.weeks;
  }
  return it.plan.length;
}
const effDose = (it,date) => { const p=planDose(it,date); return p!=null?p:num(it.dose); };

/* which supplemented nutrients plausibly move which lab markers */
const MARKER_NUT = {
  ferritin:["iron"], serumIron:["iron"], tsat:["iron"], hct:["iron"], hgb:["iron"],
  vitD:["vitaminD"], b12:["b12"], folateS:["folate"], magS:["magnesium"],
  zincS:["zinc"], copperS:["copper","zinc"], calciumS:["calcium","vitaminD"],
  potassium:["potassium"], trig:["omega3"], homocys:["b12","folate","b6"],
  crp:["omega3","curcumin"]
};

function bestSlotFor(item,avoid){
  const slots=["morning","midday","evening","bedtime"].filter(s=>s!==(item.timing||"any"));
  let best=slots[0], bestScore=Infinity;
  for(const s of slots){
    const inSlot=S.items.filter(x=>x.active&&!isPep(x)&&(x.timing||"any")===s);
    const bad=inSlot.filter(x=>avoid.includes(x.nutrient)).length;
    const score=bad*100+inSlot.length;
    if(score<bestScore){ bestScore=score; best=s; }
  }
  return best;
}

function labSpark(k){
  const ps=(S.labs||[]).filter(p=>p.m&&p.m[k]!=null).sort((a,b)=>a.date<b.date?-1:1);
  if(ps.length<2) return "";
  const vals=ps.map(p=>Number(p.m[k]));
  const lo=Math.min(...vals), hi=Math.max(...vals), span=(hi-lo)||1;
  const W=110,H=24;
  const X=i=>(i/(ps.length-1))*W;
  const Y=v=>H-3-((v-lo)/span)*(H-6);
  const t0=ps[0].date, tspan=Math.max(1,between(t0,ps[ps.length-1].date));
  const nuts=MARKER_NUT[k]||[];
  let hasTick=false;
  const ticks=S.items.filter(x=>nuts.includes(x.nutrient)).map(x=>{
    const off=between(t0,x.startDate);
    if(off<0||off>tspan) return "";
    hasTick=true;
    const tx=off/tspan*W;
    return `<line x1="${fx(tx,1)}" y1="0" x2="${fx(tx,1)}" y2="${H}" stroke="#D9A94A" stroke-width="1" stroke-dasharray="2 2"/>`;
  }).join("");
  const pts=vals.map((v,i)=>`${fx(X(i),1)},${fx(Y(v),1)}`).join(" ");
  const dots=vals.map((v,i)=>`<circle cx="${fx(X(i),1)}" cy="${fx(Y(v),1)}" r="1.8" fill="#FF5A3C"/>`).join("");
  return `<div class="row center gap2" style="margin-top:5px">
    <svg width="110" height="24" viewBox="0 0 ${W} ${H}" aria-hidden="true">${ticks}<polyline points="${pts}" fill="none" stroke="rgba(255,90,60,.8)" stroke-width="1.4"/>${dots}</svg>
    <span class="eyebrow plain">${ps.length} panels${hasTick?" &middot; gold = supplement start":""}</span></div>`;
}

function siteMap(){
  const cut=shift(today(),-30);
  const pins=S.logs.filter(l=>l.site&&l.date>=cut);
  if(pins.length<2) return "";
  const counts={}; for(const s of SITES) counts[s]=0;
  for(const l of pins) if(counts[l.site]!=null) counts[l.site]++;
  const max=Math.max(...Object.values(counts),1);
  let grid="";
  for(const region of ["Abdomen","Delt","Thigh","Glute"]){
    grid+=`<div class="row gap2 mb2">${[region+" L",region+" R"].map(s=>{
      const c=counts[s], op=c?0.12+0.55*(c/max):0.03;
      return `<div class="f1" style="border:1px solid var(--line);border-radius:2px;padding:8px 10px;background:rgba(255,90,60,${fx(op,2)})">
        <div class="eyebrow plain">${s}</div><div class="mono" style="font-size:15px;font-weight:600">${c||"&mdash;"}</div></div>`;
    }).join("")}</div>`;
  }
  const total=pins.length;
  const heavy=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
  const warn=total>=6&&heavy[1]/total>0.35
    ?`<div class="eyebrow plain" style="color:var(--kin);margin-top:2px">${heavy[0]} is carrying ${Math.round(heavy[1]/total*100)}% of the last 30 days &mdash; rotation exists to spare the tissue.</div>`:"";
  return `<div class="card pad mb3"><div class="eyebrow mb3">部位 &middot; injection sites &middot; 30d</div>${grid}${warn}</div>`;
}

function downloadFile(name,mime,content){
  const url=URL.createObjectURL(new Blob([content],{type:mime}));
  const a=document.createElement("a"); a.href=url; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function buildICS(){
  const icsEsc=s=>String(s).replace(/\\/g,"\\\\").replace(/([,;])/g,"\\$1");
  const DOWI=["SU","MO","TU","WE","TH","FR","SA"];
  const start=shift(today(),1).replace(/-/g,"");
  const stamp=start+"T000000Z";
  const times={morning:"080000",midday:"123000",evening:"180000",bedtime:"213000",any:"090000"};
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Stack Log//"+REV+"//EN","CALSCALE:GREGORIAN"];
  const active=S.items.filter(i=>i.active);
  for(const [tk,,label] of TIMINGS){
    const grp=active.filter(i=>!isPep(i)&&(i.timing||"any")===tk&&i.freq==="daily");
    if(!grp.length) continue;
    L.push("BEGIN:VEVENT","UID:slot-"+tk+"-"+uid()+"@stacklog","DTSTAMP:"+stamp,
      "DTSTART:"+start+"T"+times[tk],"RRULE:FREQ=DAILY",
      "SUMMARY:"+icsEsc("\u6731 "+label+" stack ("+grp.length+")"),
      "DESCRIPTION:"+icsEsc(grp.map(i=>`${i.name} ${i.dose}${i.unit}`).join(", ")),
      "BEGIN:VALARM","TRIGGER:PT0S","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(label+" stack"),"END:VALARM","END:VEVENT");
  }
  const rest=active.filter(i=>isPep(i)||i.freq!=="daily");
  for(const p of rest){
    let rrule="FREQ=DAILY";
    if(p.freq==="weekdays"){
      const bd=[...(p.days||[])].sort((a,b)=>a-b).map(d=>DOWI[d]).join(",");
      if(!bd) continue;
      rrule="FREQ=WEEKLY;BYDAY="+bd;
    }else if(p.freq==="interval"){
      rrule="FREQ=DAILY;INTERVAL="+Math.max(1,p.interval||2);
    }
    let d0=shift(today(),1);
    for(let i=1;i<=60;i++){ const dd=shift(today(),i); if(isDue(p,dd)){ d0=dd; break; } }
    const tt=isPep(p)?"073000":times[p.timing||"any"];
    L.push("BEGIN:VEVENT","UID:item-"+p.id+"@stacklog","DTSTAMP:"+stamp,
      "DTSTART:"+d0.replace(/-/g,"")+"T"+tt,"RRULE:"+rrule,
      "SUMMARY:"+icsEsc("\u6731 "+p.name+" \u2014 "+effDose(p,today())+p.unit),
      "DESCRIPTION:"+icsEsc((p.cycleOn?"Cycled item - skip during off weeks. ":"")+(p.plan?"Titrated - check the app for today's step. ":"")+"Logged in Stack Log."),
      "BEGIN:VALARM","TRIGGER:PT0S","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(p.name),"END:VALARM","END:VEVENT");
  }
  L.push("END:VCALENDAR");
  return L.join("\r\n");
}

const BODY_METRICS=[["weight","Weight"],["waist","Waist"],["bp","Blood pressure"],["rhr","Resting HR"]];
function viewBody(){
  let h=`<button class="primary wide mb3" data-act="addBody">＋ Log body metrics</button>`;
  const entries=(S.body||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  if(!entries.length)
    return h+`<div class="card flat pad sm muted">Weight, waist, blood pressure, resting heart rate &mdash; log whichever you track. Charts land here next to your doses, which is the point: what you take on one line, what it did on the other.</div>`;
  const availK=BODY_METRICS.filter(([k])=>k==="bp"?entries.some(e=>e.sys!=null||e.dia!=null):entries.some(e=>e[k]!=null));
  let mk=UI.bodyFocus;
  if(!availK.some(([k])=>k===mk)) mk=availK[0]?availK[0][0]:null;
  h+=`<div class="chips mb3">${availK.map(([k,l])=>`<button class="${k===mk?"shu":""}" data-act="bfocus:${k}">${l}</button>`).join("")}</div>`;
  if(!mk) return h;
  const pts=entries.filter(e=>mk==="bp"?(e.sys!=null||e.dia!=null):e[mk]!=null);
  const t0=pts[0].date, t1=pts[pts.length-1].date;
  const tspan=Math.max(1,between(t0,t1));
  const W=320,H=112;
  const X=d=>between(t0,d)/tspan*W;
  const series=(key,color)=>{
    const s=pts.filter(e=>e[key]!=null);
    if(!s.length) return "";
    const vs=s.map(e=>Number(e[key]));
    const lo=Math.min(...vs), hi=Math.max(...vs), span=(hi-lo)||1;
    const Y=v=>H-6-((v-lo)/span)*(H-16);
    const line=s.length>1?`<polyline points="${s.map(e=>`${fx(X(e.date),1)},${fx(Y(Number(e[key])),1)}`).join(" ")}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>`:"";
    const dots=s.map(e=>`<circle cx="${fx(X(e.date),1)}" cy="${fx(Y(Number(e[key])),1)}" r="2.6" fill="${color}"/>`).join("");
    return line+dots;
  };
  let chart="", legend="";
  if(mk==="bp"){ chart=series("sys","#FF5A3C")+series("dia","#D9A94A"); legend=`<span style="color:var(--shu)">sys</span> / <span style="color:var(--kin)">dia</span>`; }
  else { chart=series(mk,"#FF5A3C"); }
  const fit=S.items.find(x=>x.id===UI.focus)||S.items[0];
  let ticks="";
  if(fit){
    const dl=S.logs.filter(l=>l.itemId===fit.id&&l.date>=t0&&l.date<=t1);
    ticks=dl.map(l=>`<rect x="${fx(X(l.date)-1,1)}" y="${H-8}" width="2" height="8" fill="rgba(255,90,60,.35)"/>`).join("");
  }
  const latest=pts[pts.length-1], prevE=pts[pts.length-2];
  const val=e=>mk==="bp"?`${e.sys??"\u2014"}/${e.dia??"\u2014"}`:trim(Number(e[mk]));
  const delta=prevE&&mk!=="bp"&&latest[mk]!=null&&prevE[mk]!=null?Number(latest[mk])-Number(prevE[mk]):null;
  h+=`<div class="card pad mb3">
    <div class="row between center mb2">
      <span class="eyebrow">${BODY_METRICS.find(([k])=>k===mk)[1]}${legend?` &middot; ${legend}`:""}</span>
      <span class="data">${val(latest)}${delta!=null&&Math.abs(delta)>0.001?` <span class="dlt">${delta>0?"\u25b2":"\u25bc"} ${trim(Math.abs(delta))}</span>`:""}</span>
    </div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="128" preserveAspectRatio="none" aria-label="Body metric over time">
      <line x1="0" y1="${H-.5}" x2="${W}" y2="${H-.5}" stroke="rgba(242,237,230,.14)"/>
      ${ticks}${chart}
    </svg>
    <div class="row between eyebrow" style="margin-top:2px"><span>${t0.slice(5)}</span>${fit?`<span>ticks = ${esc(fit.name)} doses</span>`:""}<span>${t1.slice(5)}</span></div>
  </div>`;
  h+=`<div class="card pad"><div class="eyebrow mb3">履歴 &middot; entries</div><div class="col gap2">`+
    entries.slice().reverse().slice(0,20).map(e=>`<div class="row between center gap2">
      <span class="data none">${e.date}</span>
      <span class="eyebrow plain f1">${[e.weight!=null?`wt ${trim(e.weight)}`:"",e.waist!=null?`waist ${trim(e.waist)}`:"",(e.sys!=null||e.dia!=null)?`bp ${e.sys??"\u2014"}/${e.dia??"\u2014"}`:"",e.rhr!=null?`rhr ${trim(e.rhr)}`:""].filter(Boolean).join(" &middot; ")}</span>
      <button class="icon danger none" data-act="delBody:${e.id}" aria-label="Delete entry">&#10005;</button>
    </div>`).join("")+`</div></div>`;

function barrel(p,endDate,days=14){
  const need = p.perDay||1;
  let ticks="",hit=0,due=0;
  for(let i=days-1;i>=0;i--){
    const d = shift(endDate,-i);
    const cnt = logsFor(p.id,d).length;
    const isD = isDue(p,d), full = cnt>=need;
    if(isD) due++; if(full) hit++;
    ticks += `<i class="tick ${cnt>0?"hit":isD?"due":"off"}" style="height:${full?100:cnt>0?64:isD?52:20}%"></i>`;
  }
  return `<div class="barrel" aria-hidden="true">${ticks}</div>
    <div class="row between eyebrow" style="margin-top:5px"><span>${days}日前</span><span>${hit}/${due} taken</span></div>`;
}
const stat = (l,v,s,tone) =>
  `<div class="stat"><div class="eyebrow">${l}</div><b${tone?` style="color:${tone}"`:""}>${v}</b>${s?`<div class="eyebrow plain">${s}</div>`:""}</div>`;

    ${f.tags.length?`<div class="eyebrow plain" style="margin-top:9px">${f.tags.map(esc).join(" &middot; ")}</div>`:""}
  </div>`;
}
