    const gDone = group.filter(i=>logsFor(i.id,UI.date).length>=(i.perDay||1)).length;
    h += `<div class="slot"><span class="k">${kanji}</span><span class="l">${label}</span>
      <span class="r"></span>${gDone<group.length?`<button class="tiny" data-act="stampSlot:${tKey}">stamp all</button>`:""}<span class="eyebrow">${gDone}/${group.length}</span></div>
      <div class="col gap2 stagger">`;
    for(const it of group){
      const dl = logsFor(it.id,UI.date);
      const need = it.perDay||1, l = dl[dl.length-1]||null, full = dl.length>=need;
      h += `<div class="card pad2 row between center" style="gap:11px">
        <div class="f1" style="min-width:0">
          <div style="font-size:15px;font-weight:500;line-height:1.3">${esc(it.name)}</div>
          <div class="data">${l?l.dose:it.dose} ${esc(it.unit)}${it.perDay>1?` &times;${it.perDay}`:""}${it.withFood?" &middot; with food":""}${it.freq!=="daily"?` &middot; ${schedText(it)}`:""}</div>
        </div>
        <button class="seal mini ${full?"done":""}" data-act="${full?"log":"stamp"}:${it.id}" aria-label="${full?"Edit dose":"Log dose"}">${full?"済":need>1&&dl.length?`<span class="mono" style="font-size:11px">${dl.length}/${need}</span>`:"押"}${!full&&!S.logs.length?`<i class="hint">log</i>`:""}</button>
      </div>`;
    }
    h += `</div>`;
  }
  return h;
}

/* ============================================================
   VIEW — STACK

function viewStack(){
  if(!S.items.length) return `<div class="card flat pad sm muted">Nothing added yet. Use the Add buttons up top.</div>`;
  const f = UI.filter;
  const shown = S.items.filter(i=>f==="all"?true:f==="pep"?isPep(i):!isPep(i));
  let h = `<div class="chips mb4">
    ${[["all","Everything",S.items.length],["pep","Peptides",S.items.filter(isPep).length],
       ["supp","Supplements",S.items.filter(i=>!isPep(i)).length]].map(([v,l,n])=>
      `<button class="${f===v?"shu":""}" data-act="filter:${v}">${l} ${n}</button>`).join("")}
    <button class="primary" data-act="add:supplement">＋ Supplement</button>
    <button class="primary" data-act="add:peptide">＋ Peptide</button></div>`;
  h += `<div class="row gap2 mb4">
    <button class="f1" data-act="tplExport">Share template</button>
    <button class="f1" data-act="tplImport">Import</button></div>`;
  if(!shown.length) return h+`<div class="card flat pad sm muted">Nothing in this category yet.</div>`;

  h += `<div class="col gap3 stagger">`;
  for(const it of shown){
    const mine = S.logs.filter(l=>l.itemId===it.id);
    const ph = cyclePhase(it,today());
    const el = Math.max(0,between(it.startDate,today()));
    const nut = it.nutrient?NUTRIENTS[it.nutrient]:null;
    const ov = isPep(it)?S.vials.find(x=>x.itemId===it.id&&!x.finished&&x.kind!=="container"):null;

    h += `<div class="card pad">
      <div class="row between mb3" style="gap:12px">
        <div style="min-width:0">
          <div class="row center gap2 wrapf">
            <span class="eyebrow" style="color:${isPep(it)?"var(--shu)":"var(--hai)"}">${isPep(it)?"注射 INJECT":"経口 ORAL"}</span>
            ${it.research?`<span class="eyebrow" style="color:var(--kin)">研究 RESEARCH</span>`:""}
            ${!it.active?`<span class="eyebrow">paused</span>`:""}

          ${refFor(it)?`<button class="name-btn display" style="font-size:19px;line-height:1.25" data-act="ref:${esc(refFor(it))}">${esc(it.name)}</button>`:`<div class="display" style="font-size:19px;line-height:1.25">${esc(it.name)}</div>`}
          <div class="data">${it.dose} ${esc(it.unit)}${um&&um.units>0?` &middot; ${fx(um.units)}u this vial`:""} &middot; ${schedText(it)}${it.perDay>1?` &middot; ${it.perDay}&times;/day`:""}${!isPep(it)?` &middot; ${timingLabel(it.timing)}`:""}</div>
        </div>
        <div class="row gap2 none">
          <button class="icon" data-act="edit:${it.id}" aria-label="Edit">&#9998;</button>
          <button class="icon danger" data-act="del:${it.id}" aria-label="Delete">&#10005;</button>
        </div>
      </div>
      <div class="row gap3 mb3">
        ${stat("Day",el+1,`since ${it.startDate}`)}
        ${stat("Doses",mine.length,"logged")}
        ${stat("Phase",ph?(ph.on?`On ${ph.week}/${ph.total}`:"Off"):(it.active?"Open":"Paused"),ph?`${ph.daysLeft}d left`:"",ph&&!ph.on?"var(--kin)":null)}
      </div>
      ${barrel(it,today())}
      ${nut?`<div class="eyebrow plain" style="margin-top:9px">Checked as ${esc(nut.label)}${nut.ul?` &middot; limit ${nut.ul} ${nut.unit}/day`:""}</div>`
        :isPep(it)||refFor(it)?(it.pclass&&PCLASS[it.pclass]?`<div class="eyebrow plain" style="margin-top:9px">${esc(PCLASS[it.pclass].label)}</div>`:"")
        :`<div class="eyebrow plain" style="margin-top:9px;color:var(--kin)">Not linked to a tracked nutrient, so the nutrient checker can't see this one</div>`}
      ${it.notes?`<p class="sm muted" style="margin:11px 0 0">${esc(it.notes)}</p>`:""}
      <button class="wide" style="margin-top:13px" data-act="toggle:${it.id}">${it.active?"Pause":"Resume"}</button>
    </div>`;
  }
  return h+`</div>`;
}

/* ============================================================
   VIEW — STOCK
   ============================================================ */
function viewStock(){
  if(!S.items.length) return `<div class="card flat pad sm muted">Add something to your stack first.</div>`;
  let h = `<button class="primary wide mb4" data-act="addBatch">＋ Add stock</button>`;
  const costed = S.items.filter(i=>i.active).map(i=>({it:i,s:supply(i)})).filter(x=>x.s.costPerDose>0&&x.s.dpw>0);
  if(costed.length){
    const rows=costed.map(x=>({n:x.it.name,m:x.s.costPerDose*x.s.dpw*(30/7)})).sort((a,b)=>b.m-a.m);
    const tot=rows.reduce((a2,r)=>a2+r.m,0);
    h += `<div class="card pad mb4">
      <div class="eyebrow mb1">月額 &middot; monthly run rate</div>
      <div class="mono" style="font-size:24px;font-weight:600">$${fx(tot,0)}<span class="eyebrow plain" style="font-size:11px"> /mo at current schedules</span></div>
      <div class="eyebrow plain" style="margin-top:7px">${rows.slice(0,5).map(r=>`${esc(r.n)} $${fx(r.m,0)}`).join(" &middot; ")}${rows.length>5?` &middot; +${rows.length-5} more`:""}</div>
    </div>`;
  }
  let any = false;
  for(const it of S.items){
    const mine = S.batches.filter(b=>b.itemId===it.id);
    const open = S.vials.filter(v=>v.itemId===it.id&&!v.finished);
    if(!mine.length&&!open.length) continue;
    any = true;
    const s = supply(it);
    h += `<div class="mb4">
      <div class="row between end mb2">
        <h2 class="display" style="font-size:20px">${esc(it.name)}</h2>
        <span class="mono eyebrow plain">${s.sealed} sealed &middot; ${open.length} open</span>
      </div><div class="rule mb3"></div>`;
    if(!s.unmeasured&&s.daysLeft!=null){
      h += `<div class="${s.low?"bad":"card flat pad"} mb2" ${s.low?'style="padding:14px 16px"':""}>
        <div class="row gap3">
          ${stat("Doses left",s.dosesLeft,`${fx(s.dpw)}/wk`)}
          ${stat("Runs out",s.daysLeft+"d",shift(today(),s.daysLeft))}
          ${stat("Order by",s.low?"Now":s.orderBy.slice(5),`${s.lead}d lead`,s.low?"var(--alert)":"var(--shu)")}
        </div>
        ${s.costPerDose>0?`<div class="eyebrow plain" style="margin-top:9px">About $${fx(s.costPerDose,2)} per dose &middot; $${fx(s.value,0)} in stock</div>`:""}
      </div>`;
    }
    for(const v of open){
      if(v.kind==="container"){
        const m = contMath(v);
        h += `<div class="card pad row gap3 mb2">
          <div class="vial jar"><i style="height:${m.pct*100}%"></i></div>
          <div class="f1">
            <div class="data">Open &middot; ${m.dosesLeft} of ${m.dosesTotal} servings</div>
            <div class="eyebrow plain">Opened ${v.reconDate}${v.lot?` &middot; lot ${esc(v.lot)}`:""}</div>
            <button class="tiny" style="margin-top:9px" data-act="finishVial:${v.id}">Mark finished</button>
          </div></div>`;
      }else{
        const m = vialMath(v,it);
        h += `<div class="card pad row gap3 mb2 ${m.expired?"spine red":""}">
          <div class="vial"><i style="height:${Math.max(0,Math.min(1,m.pct))*100}%"></i></div>
          <div class="f1">
            <div class="mono" style="font-size:14px;font-weight:600">${v.mg}mg in ${v.water}mL &middot; ${fx(m.conc/1000,2)} mg/mL${m.premix?` <span class="eyebrow none">premixed</span>`:""}</div>
            <div class="data">${m.dosesLeft!=null?`${m.dosesLeft} of ${m.dosesTotal} doses left &middot; ${fx(m.remainMl,2)}mL &middot; ${fx(m.units)}u per dose`:`dose is set in iu &mdash; draws and remaining can't be computed from mg`}</div>
            <div class="eyebrow plain" style="margin-top:3px;color:${m.expired?"var(--alert)":"var(--hai)"}">
              Opened ${v.reconDate} &middot; ${m.expired?`${m.age-m.bud}d past your ${m.bud}d window`
                :m.budLeft!=null?`${m.budLeft}d left in window`
                :`${m.age}d ago &middot; no use-by set`}</div>
            <button class="tiny" style="margin-top:9px" data-act="finishVial:${v.id}">Mark finished</button>
          </div></div>`;
      }
    }
    for(const b of mine){
      h += `<div class="card pad mb2">
        <div class="row between center">
          <div style="min-width:0">
            <div class="mono" style="font-size:14px;font-weight:600">${isPep(it)?(b.form==="premix"?`${b.mg}mg in ${trim(num(b.ml))}mL &middot; ${trim(num(b.mg)/(num(b.ml)||1))} mg/mL`:`${b.mg}mg sealed`):`${b.servings} servings per container`}</div>
            <div class="eyebrow plain">Added ${b.addedDate}${b.location?` &middot; ${esc(b.location)}`:""}${b.lot?` &middot; lot ${esc(b.lot)}`:""}</div>
            ${b.source?`<div class="eyebrow plain">${esc(b.source)}</div>`:""}
          </div>
          <div class="row gap2 center none">
            <button class="icon" data-act="adj:${b.id}:-1" ${!b.sealed?"disabled":""} aria-label="One fewer">&minus;</button>
            <span class="mono" style="font-size:21px;font-weight:600;min-width:24px;text-align:center">${b.sealed||0}</span>
            <button class="icon" data-act="adj:${b.id}:1" aria-label="One more">＋</button>
          </div>
        </div>
        <div class="row gap2" style="margin-top:11px">
          <button class="shu f1" data-act="${isPep(it)?"recon":"openCont"}:${b.id}" ${!b.sealed?"disabled":""}>${isPep(it)&&b.form!=="premix"?"Reconstitute one":"Open one"}</button>
          <button class="icon" data-act="editBatch:${b.id}" aria-label="Edit">&#9998;</button>
          <button class="icon danger" data-act="delBatch:${b.id}" aria-label="Delete">&#10005;</button>
        </div></div>`;
    }
    h += `</div>`;
  }
  if(!any) h += `<div class="card flat pad sm muted">No stock tracked yet. Add a batch to start counting what you have on hand.</div>`;
  return h;
}

/* ============================================================
   VIEW — LABS
   ============================================================ */
function viewLabs(){
  const panels = (S.labs||[]).slice().sort((a,b)=>a.date<b.date?1:-1);
  let h = `<div class="row gap2 mb4">
    <button class="shu f1" data-act="addPanel">＋ Add bloodwork</button>
    ${panels.length?`<button class="none" data-act="labExport">Export</button>`:""}</div>`;

  if(!panels.length){
    return h+`<div class="card pad">
      <div class="display" style="font-size:19px;margin-bottom:9px">No panels yet</div>
      <p class="sm muted" style="margin:0 0 12px;line-height:1.6">Two ways in. Paste the text straight from your lab portal or PDF and it'll pull out what it recognizes — or type the values in by hand. Either way you review every number before it saves.</p>
      <p class="sm muted" style="margin:0 0 14px;line-height:1.6">Once a panel is in, the Check tab starts reasoning about your stack against your actual bloodwork instead of just against published limits. That's where it gets useful: ferritin at 350 while you're taking iron, vitamin D at 70 while you're taking 5,000 IU a day.</p>
      <button class="shu wide" data-act="addPanel">Add your first panel</button></div>`;
  }

  const P = panels[0], prev = panels[1];
  const keys = Object.keys(P.m||{}).filter(k=>MARKERS[k]);
  const outCount = keys.filter(k=>mStatus(k,P.m[k])!=="in").length;

  h += `<div class="card pad mb3">
    <div class="row between end mb3">
      <div><div class="eyebrow">最新 &middot; latest panel</div>
        <div class="display" style="font-size:20px">${P.date}</div></div>
      <div class="row gap2 none">
        <button class="tiny" data-act="editPanel:${P.id}">Edit</button>
        <button class="tiny danger" data-act="delPanel:${P.id}">&#10005;</button></div>
    </div>
    <div class="row gap3">
      ${stat("Markers",keys.length,"recorded")}
      ${stat("Out of range",outCount,outCount?"see below":"all clear",outCount?"var(--kin)":"var(--shu)")}
      ${stat("Age",between(P.date,today())+"d",between(P.date,today())>365?"stale":"current",between(P.date,today())>365?"var(--kin)":null)}
    </div>
    <div class="row gap2 center" style="margin-top:13px">
      <span class="eyebrow none">Ranges for</span>
      <button class="tiny ${(S.profile.sex||"m")==="m"?"shu":""}" data-act="sex:m">Male</button>
      <button class="tiny ${S.profile.sex==="f"?"shu":""}" data-act="sex:f">Female</button>
    </div>
  </div>`;

  for(const [g,kanji,label] of MGROUPS){
    const ks = keys.filter(k=>MARKERS[k].g===g);
    if(!ks.length) continue;
    h += `<div class="slot"><span class="k">${kanji}</span><span class="l">${label}</span><span class="r"></span></div>
      <div class="card pad mb2">`;
    for(const k of ks){
      const mk = MARKERS[k], v = Number(P.m[k]);
      const [lo,hi] = mRange(mk);
      const st = mStatus(k,v);
      const span = hi-lo || 1;
      let posPct = 18 + ((v-lo)/span)*64;
      posPct = Math.max(2,Math.min(98,posPct));
      const pv = prev&&prev.m&&prev.m[k]!=null?Number(prev.m[k]):null;
      const d = pv!=null?v-pv:null;
      h += `<div class="lab">
        <div class="row between center gap2">
          <span class="sm f1" style="min-width:0">${esc(mk.label)}</span>
          ${d!=null&&Math.abs(d)>0.001?`<span class="dlt none">${d>0?"▲":"▼"} ${trim(Math.abs(d))}</span>`:""}
          <span class="mono none" style="font-size:14px;font-weight:600;color:${st==="in"?"var(--washi)":"var(--alert)"}">${trim(v)}</span>
          <span class="eyebrow none">${esc(mk.unit)}</span>
        </div>
        <div class="rng"><u class="${st!=="in"?"out":""}" style="left:${posPct}%"></u></div>
        <div class="row between eyebrow plain" style="margin-top:3px">
          <span>${trim(lo)}</span>
          <span>${st==="in"?"in range":st==="low"?"below range":"above range"}</span>
          <span>${trim(hi)}</span>
        </div>
        ${labSpark(k)}
      </div>`;
    }
    h += `</div>`;
  }

  if(panels.length>1){
    h += `<div class="slot"><span class="k">履歴</span><span class="l">Earlier panels</span><span class="r"></span></div>
      <div class="col gap2">`;
    for(const p of panels.slice(1)){
      const n = Object.keys(p.m||{}).filter(k=>MARKERS[k]).length;
      const o = Object.keys(p.m||{}).filter(k=>MARKERS[k]&&mStatus(k,p.m[k])!=="in").length;
      h += `<div class="card pad2 row between center">
        <div><div class="mono" style="font-size:14px;font-weight:600">${p.date}</div>
          <div class="eyebrow plain">${n} markers &middot; ${o} out of range</div></div>
        <div class="row gap2 none">
          <button class="tiny" data-act="editPanel:${p.id}">Edit</button>
          <button class="tiny danger" data-act="delPanel:${p.id}">&#10005;</button></div>
      </div>`;
    }
    h += `</div>`;
  }

  h += `<div class="card flat pad" style="margin-top:18px">
    <div class="eyebrow mb2">範囲 &middot; about these ranges</div>
    <p class="sm muted" style="margin:0;line-height:1.65">The bands shown are typical adult clinical laboratory ranges, adjusted for the sex you selected. Your own lab's stated range governs — assays differ, and some markers (vitamin D especially) have genuinely contested thresholds. Reference ranges also describe the middle 95% of a general population, not what's optimal for someone training hard.</p>
  </div>`;
  return h;
}

/* ============================================================
   VIEW — CHECK
   ============================================================ */
function viewCheck(){
  const seg = `<div class="row gap2 mb4">
    <button class="f1 ${UI.checkView!=="labs"?"shu":""}" data-act="cview:find">照合 Findings</button>
    <button class="f1 ${UI.checkView==="labs"?"shu":""}" data-act="cview:labs">血液 Bloodwork</button></div>`;
  if(UI.checkView==="labs") return seg+viewLabs();
  const findings = analyze();
  const totals = nutrientTotals();
  const flags = S.profile?.flags||[];
  const c = findings.filter(f=>f.sev==="concern").length;
  const n = findings.filter(f=>f.sev==="note").length;
  const g = findings.filter(f=>f.sev==="good").length;
  const labN = findings.filter(f=>f.lab).length;
  const P = latestPanel();
  let h = seg;

  h += `<div class="card pad mb3">
    <div class="row gap3">
      ${stat("Concerns",c,c?"look at these":"none found",c?"var(--alert)":"var(--hai)")}
      ${stat("Notes",n,"worth knowing",n?"var(--kin)":"var(--hai)")}
      ${stat("Working well",g,"good pairings","var(--shu)")}
    </div>
    <div class="eyebrow plain" style="margin-top:11px">Checked ${S.items.filter(i=>i.active).length} active items against ${Object.keys(NUTRIENTS).length} nutrients${flags.length?`, ${flags.length} flag${flags.length>1?"s":""}`:""}${P?`, and your ${P.date} bloodwork — ${labN} finding${labN===1?"":"s"} came from the labs`:""}.</div>
  </div>`;

  if(!P){
    h += `<button class="attn wide mb3" data-act="tab:labs" style="text-align:left;justify-content:flex-start">
      <span class="sm"><strong>Add bloodwork to sharpen this.</strong> Without labs the checker can only compare you to published limits. With them it can tell you what you're taking more of than you need. &rsaquo;</span></button>`;
  }

  const g1 = FLAGS.filter(f=>f.g===1), g2 = FLAGS.filter(f=>f.g===2);
  h += `<div class="card gold pad mb4">
    <div class="eyebrow mb2" style="color:var(--kin)">前提 &middot; tell the checker about you</div>
    <p class="sm muted" style="margin:0 0 11px">Supplement-to-supplement conflicts are mostly absorption inefficiency. Supplement-to-prescription is where things actually go wrong. Switch on anything that applies — it stays on your device.</p>
    <div class="chips mb2">${g1.map(f=>
      `<button class="${flags.includes(f.id)?"shu":""}" data-act="flag:${f.id}" title="${esc(f.sub)}">${f.label}</button>`).join("")}</div>
    ${UI.moreFlags
      ? `<div class="chips">${g2.map(f=>`<button class="${flags.includes(f.id)?"shu":""}" data-act="flag:${f.id}">${f.label}</button>`).join("")}
         <button class="tiny" data-act="moreFlags">− less</button></div>`
      : `<button class="tiny" data-act="moreFlags">＋ ${g2.length} more</button>`}
  </div>`;

  if(!S.items.filter(i=>i.active).length){
    h += `<div class="card flat pad sm muted mb4">Nothing active to check yet.</div>`;
  }else if(!findings.length){
    h += `<div class="good mb4"><strong>Nothing flagged.</strong> No upper limits exceeded, no documented interactions between what you're taking, and no timing conflicts in the rules this app knows. That isn't the same as a clean bill of health — these rules are a well-documented subset, not everything.</div>`;
  }else{
    h += `<div class="col gap3 mb4 stagger">${findings.map(findingCard).join("")}</div>`;
  }

  if(totals.length){
    h += `<div class="card pad mb3">
      <div class="eyebrow mb3">合計 &middot; daily totals against upper limits</div>
      <div class="col gap3">`;
    for(const t of totals){
      const pct = t.nut.ul?t.total/t.nut.ul:0;
      const cls = !t.nut.ul?"":t.total>t.nut.ul?"over":pct>=0.8?"near":"";
      h += `<div>
        <div class="row between center">
          <span class="sm">${esc(t.nut.label)}${t.items.length>1?` <span class="eyebrow">${t.items.length} sources</span>`:""}</span>
          <span class="mono xs" style="color:${cls==="over"?"var(--alert)":cls==="near"?"var(--kin)":"var(--hai)"}">
            ${trim(t.total)} / ${t.nut.ul?`${t.nut.ul} ${t.nut.unit}`:"no limit"}</span>
        </div>
        ${t.nut.ul?`<div class="meter"><i class="${cls}" style="width:${Math.min(100,pct*100)}%"></i></div>`:""}
      </div>`;
    }
    h += `</div>
      <div class="eyebrow plain" style="margin-top:13px;line-height:1.6">Upper limits are the adult Tolerable Upper Intake Levels from the Food and Nutrition Board, published by the NIH Office of Dietary Supplements. They cover intake from all sources, so food and fortified products count toward these totals and this app can't see them.</div>
    </div>`;
  }

  h += `<div class="card flat pad">
    <div class="eyebrow mb2">限界 &middot; what this can't do</div>
    <p class="sm muted" style="margin:0;line-height:1.65">This checker knows a specific set of well-documented rules. It doesn't know your history, your full prescription list, or the many interactions outside its list, and it reads your bloodwork as isolated numbers rather than as a clinical picture. A clean result is not clearance and a flag is not a diagnosis. Two people can read your whole stack properly: a pharmacist, who will do it for free and is very good at it, and the clinician who holds your chart.</p>
  </div>`;
  return h;
}

   VIEW — TRENDS

/* The markers worth charting against a dose. Everything else on a panel is
   still on the Bloodwork page; this is the short list that androgens and
   growth hormone actually move. */
const HORM_MARKERS = ["hct","hgb","ferritin","testT","testF","e2","shbg","lh","fsh",
  "prolactin","igf1","psa","hdl","apob","ldl","trig","alt","ast","ggt","glucose","a1c"];

function viewHormones(){
  const panels=(S.labs||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  if(!panels.length)
    return `<div class="card flat pad sm muted">No bloodwork saved yet. Paste a panel into Bloodwork and this fills in: a marker on one line, your doses on the other.
      <button class="wide" style="margin-top:12px" data-act="tab:labs">Go to Bloodwork</button></div>`;
  const avail=HORM_MARKERS.filter(k=>panels.some(p=>p.m&&p.m[k]!=null));
  if(!avail.length)
    return `<div class="card flat pad sm muted">Your ${panels.length>1?"panels don't":"panel doesn't"} include any of the markers this view charts. Hematocrit, estradiol, total testosterone, LH, IGF-1 and the lipid panel are the ones it looks for.</div>`;
  let mk=UI.hmk;
  if(!avail.includes(mk)) mk=avail[0];
  let h=`<div class="chips mb3">${avail.map(k=>
    `<button class="${k===mk?"shu":""}" data-act="hmk:${k}">${MARKERS[k].label}</button>`).join("")}</div>`;

  const M=MARKERS[mk], [lo,hi]=mRange(M);
  const pts=panels.filter(p=>p.m&&p.m[mk]!=null).map(p=>({date:p.date,v:Number(p.m[mk])}));
  const overlay=S.items.filter(i=>["aas","aasOral","gh","gonadotropin","ai","serm"].includes(i.pclass));
  const fit=S.items.find(x=>x.id===UI.focus&&overlay.some(o=>o.id===x.id))||overlay[0]||S.items.find(x=>x.id===UI.focus)||S.items[0];

  const t0=pts[0].date, t1=pts[pts.length-1].date;
  const logDates=fit?S.logs.filter(l=>l.itemId===fit.id).map(l=>l.date):[];
  const first=[t0,...logDates].sort()[0];
  const last=[t1,...logDates].sort().slice(-1)[0];
  const span=Math.max(1,between(first,last));
  const W=320,H=124;
  const X=d=>between(first,d)/span*W;
  const vs=pts.map(p=>p.v);
  const yLo=Math.min(lo,...vs), yHi=Math.max(hi,...vs);
  const pad=(yHi-yLo)*0.12||1;
  const bLo=yLo-pad, bHi=yHi+pad, bSpan=(bHi-bLo)||1;
  const Y=v=>H-8-((v-bLo)/bSpan)*(H-20);

  const band=`<rect x="0" y="${fx(Y(hi),1)}" width="${W}" height="${fx(Math.max(1,Y(lo)-Y(hi)),1)}"
    fill="rgba(242,237,230,.055)"/>
    <line x1="0" y1="${fx(Y(hi),1)}" x2="${W}" y2="${fx(Y(hi),1)}" stroke="rgba(242,237,230,.18)" stroke-dasharray="3 3"/>
    <line x1="0" y1="${fx(Y(lo),1)}" x2="${W}" y2="${fx(Y(lo),1)}" stroke="rgba(242,237,230,.18)" stroke-dasharray="3 3"/>`;
  const line=pts.length>1?`<polyline points="${pts.map(p=>`${fx(X(p.date),1)},${fx(Y(p.v),1)}`).join(" ")}"
    fill="none" stroke="var(--shu)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`:"";
  const dots=pts.map(p=>`<circle cx="${fx(X(p.date),1)}" cy="${fx(Y(p.v),1)}" r="3"
    fill="${mStatus(mk,p.v)==="in"?"#FF5A3C":"#F27D93"}"/>`).join("");
  const ticks=logDates.map(d=>`<rect x="${fx(X(d)-1,1)}" y="${H-6}" width="2" height="6" fill="rgba(255,90,60,.4)"/>`).join("");

  const latest=pts[pts.length-1], before=pts[pts.length-2];
  const delta=before?latest.v-before.v:null;
  const st=mStatus(mk,latest.v);
  h+=`<div class="card pad mb3">
    <div class="row between center mb2">
      <span class="eyebrow">${esc(M.label)} &middot; ${esc(M.unit)}</span>
      <span class="data" style="color:${st==="in"?"var(--washi)":"var(--alert)"}">${trim(latest.v)}${delta!=null&&Math.abs(delta)>0.001?` <span class="dlt">${delta>0?"▲":"▼"} ${trim(Math.abs(delta))}</span>`:""}</span>
    </div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="140" preserveAspectRatio="none" aria-label="${esc(M.label)} over time with doses beneath">
      ${band}${ticks}${line}${dots}
      <line x1="0" y1="${H-.5}" x2="${W}" y2="${H-.5}" stroke="rgba(242,237,230,.14)"/>
    </svg>
    <div class="row between eyebrow" style="margin-top:2px">
      <span>${first.slice(5)}</span>
      <span>band ${trim(lo)}–${trim(hi)}${fit&&logDates.length?` &middot; ticks = ${esc(fit.name)}`:""}</span>
      <span>${last.slice(5)}</span>
    </div>
    ${pts.length===1?`<div class="eyebrow plain" style="margin-top:8px">One panel so far. A second one is what turns this into a direction.</div>`:""}
  </div>`;

  if(overlay.length>1)
    h+=`<div class="chips mb3">${overlay.map(x=>
      `<button class="${fit&&x.id===fit.id?"shu":""}" data-act="focus:${x.id}">${esc(x.name)}</button>`).join("")}</div>`;

  h+=`<div class="card pad mb3"><div class="eyebrow mb3">推移 &middot; every panel</div><div class="col gap2">`+
    pts.slice().reverse().map((p,i,arr)=>{
      const nxt=arr[i+1];
      const d=nxt?p.v-nxt.v:null;
      const s2=mStatus(mk,p.v);
      return `<div class="row between center gap2">
        <span class="data none">${p.date}</span>
        <span class="data f1" style="text-align:right;color:${s2==="in"?"var(--washi)":"var(--alert)"}">${trim(p.v)} ${esc(M.unit)}
          ${d!=null?`<span class="dlt">${d>0?"▲":d<0?"▼":"="} ${trim(Math.abs(d))}</span>`:""}
          <span class="eyebrow plain">${s2==="in"?"in range":s2}</span></span>
      </div>`;
    }).join("")+`</div></div>`;

  const rk=fit?refFor(fit):null;
  if(rk&&(REF[rk].labs||[]).some(x=>x.m===mk)){
    const line2=REF[rk].labs.find(x=>x.m===mk);
    h+=`<div class="card gold pad mb3">
      <div class="eyebrow mb2" style="color:var(--kin)">参照 &middot; ${esc(refTitle(rk))} and ${esc(M.label)}</div>
      <p class="sm" style="margin:0;line-height:1.6">${esc(line2.t)}</p>
      <button class="tiny" style="margin-top:10px" data-act="ref:${esc(rk)}">Open the reference entry</button>
    </div>`;
  }
  return h;
}

function viewTrends(){
  const seg = `<div class="row gap2 mb4">
    <button class="f1 ${UI.trView==="dose"?"shu":""}" data-act="trview:dose">投与 Doses</button>
    <button class="f1 ${UI.trView==="body"?"shu":""}" data-act="trview:body">身体 Body</button>
    <button class="f1 ${UI.trView==="horm"?"shu":""}" data-act="trview:horm">内分 Hormones</button></div>`;
  if(UI.trView==="body") return seg+viewBody();
  if(UI.trView==="horm") return seg+viewHormones();
  if(!S.items.length) return seg+`<div class="card flat pad sm muted">Trends appear once you've logged a few doses.</div>`;
  const fid = UI.focus||S.items[0].id;
  const it = S.items.find(x=>x.id===fid);
  let h = seg+`<div class="chips mb3">`+S.items.map(x=>
    `<button class="${x.id===fid?"shu":""}" data-act="focus:${x.id}">${esc(x.name)}</button>`).join("")+`</div>`;
  if(!it) return h;

  const mine = S.logs.filter(l=>l.itemId===it.id);
  if(!mine.length){
    return h+`<div class="card pad" style="text-align:center;padding:26px 18px">
      <div class="display" style="font-size:18px;margin-bottom:7px">No doses logged yet</div>
      <p class="sm muted" style="margin:0;line-height:1.6">Stamp a dose of ${esc(it.name)} on the Today tab and this fills in &mdash; dose over time, adherence, and your notes.</p>
    </div>`;
  }

  const days = [];
  for(let i=UI.range-1;i>=0;i--){
    const d = shift(today(),-i);
    const dl = logsFor(it.id,d);
    days.push({d,dose:dl.reduce((a,b)=>a+num(b.dose),0),cnt:dl.length,due:isDue(it,d)});
  }
  const max = Math.max(...days.map(x=>x.dose),num(it.dose))||1;
  const W=320,H=112,colW=W/days.length;
  const discrete = it.freq!=="daily";
  if(UI.csel!=null&&!days[UI.csel]) UI.csel=null;
  const sel = UI.csel!=null?days[UI.csel]:null;
  let marks="";
  if(discrete){
    /* interval and set-day items are events, not a continuous quantity —
       a polyline through the zero days would draw a sawtooth that isn't there */
    marks = days.map((x,i)=>{
      const cx=i*colW+colW/2;
      if(x.dose){
        const bh=Math.max(3,(x.dose/max)*H), bw=Math.min(9,Math.max(2.4,colW*.55));
        return `<rect x="${fx(cx-bw/2,1)}" y="${fx(H-bh,1)}" width="${fx(bw,1)}" height="${fx(bh,1)}" rx="1" fill="#FF5A3C"/>`;
      }
      if(x.due) return `<rect x="${fx(cx-1.4,1)}" y="${H-6}" width="2.8" height="6" rx="1" fill="rgba(255,90,60,.3)"/>`;
      return "";
    }).join("");
  }else{
    const px = i => (i/(days.length-1||1))*W;
    const pts = days.map((x,i)=>`${fx(px(i),1)},${fx(H-(x.dose/max)*H,1)}`).join(" ");
    const dots = days.map((x,i)=>x.dose?`<circle cx="${fx(px(i),1)}" cy="${fx(H-(x.dose/max)*H,1)}" r="2.4" fill="#FF5A3C"/>`:"").join("");
    marks = `<polygon points="0,${H} ${pts} ${W},${H}" fill="url(#g)"/>
      <polyline points="${pts}" fill="none" stroke="#FF5A3C" stroke-width="2"
        stroke-linejoin="round" vector-effect="non-scaling-stroke"/>${dots}`;
  }
  const selX = sel?fx(UI.csel*colW+colW/2,1):null;
  const taps = days.map((x,i)=>`<rect x="${fx(i*colW,2)}" y="0" width="${fx(colW,2)}" height="${H}" fill="transparent" data-act="csel:${i}"/>`).join("");
  const dueN = days.filter(x=>x.due).length, hitN = days.filter(x=>x.due&&x.cnt>=(it.perDay||1)).length;
  const total = mine.reduce((a,b)=>a+num(b.dose),0);

  h += `<div class="card pad mb3">
    <div class="row between center mb3">
      <span class="eyebrow">投与量 &middot; per day &middot; ${esc(it.unit)}</span>
      <div class="row gap2">${[14,30,90].map(r=>
        `<button class="${UI.range===r?"shu":""}" style="font-size:11px;padding:4px 8px" data-act="range:${r}">${r}d</button>`).join("")}</div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="132" preserveAspectRatio="none" aria-label="Dose over time — tap a day to inspect">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FF5A3C" stop-opacity=".55"/>
        <stop offset="100%" stop-color="#8C1B2A" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" y1="${H-.5}" x2="${W}" y2="${H-.5}" stroke="rgba(242,237,230,.14)"/>
      <line x1="0" y1="${H/2}" x2="${W}" y2="${H/2}" stroke="rgba(242,237,230,.07)" stroke-dasharray="2 4"/>
      ${marks}
      ${sel?`<line x1="${selX}" y1="0" x2="${selX}" y2="${H}" stroke="rgba(242,237,230,.4)" stroke-width="1" stroke-dasharray="3 3"/>`:""}
      ${taps}
    </svg>
    <div class="row between eyebrow" style="margin-top:2px">
      <span>${days[0].d.slice(5)}</span><span style="color:var(--shu)">peak ${trim(max)}${esc(it.unit)}</span><span>${days[days.length-1].d.slice(5)}</span>
    </div>
    ${sel?`<div class="data" style="margin-top:8px">${shortDate(sel.d)} &middot; ${sel.dose?`${trim(sel.dose)} ${esc(it.unit)}${sel.cnt>1?` across ${sel.cnt} doses`:""}`:sel.due?"scheduled, not logged":"not scheduled"}</div>`:`<div class="eyebrow plain" style="margin-top:8px">Tap a day for details</div>`}
  </div>`;

  h += `<div class="card pad row gap3 mb3">
    ${stat("Adherence",dueN?Math.round(hitN/dueN*100)+"%":"—",`${hitN} of ${dueN} in ${UI.range}d`,"var(--shu)")}
    ${stat("Avg dose",mine.length?trim(total/mine.length):0,esc(it.unit))}
    ${stat("Total",trim(total),esc(it.unit)+" all time")}
  </div>`;

  h += siteMap();

  const notes = mine.filter(l=>l.note).sort((a,b)=>a.date<b.date?1:-1).slice(0,25);
  h += `<div class="card pad mb3"><div class="eyebrow mb3">記録 &middot; note history</div>
    ${notes.length?`<div class="col gap3">`+notes.map(l=>
      `<div class="note"><div class="mono eyebrow plain">${l.date}${l.time?` ${l.time}`:""} &middot; ${l.dose}${esc(l.unit)}${l.site?` &middot; ${esc(l.site)}`:""}</div>
       <div class="sm">${esc(l.note)}</div></div>`).join("")+`</div>`
    :`<div class="sm muted">No notes yet. Add one when you log a dose.</div>`}</div>`;

  h += `<button class="wide mb2" data-act="ics">Calendar reminders (.ics)</button>
  <div class="row gap2">
    <button class="f1" data-act="export">Download backup</button>
    <button class="f1" data-act="import">Restore backup</button></div>`;
  return h;
}

function sugHTML(){
  const d = UI.draft; if(!d) return "";
  const sug = searchLib(d.name,d.kind);
  const exact = LIB.some(x=>x.n.toLowerCase()===String(d.name).trim().toLowerCase());

  const link = rk?`<button class="tiny mb3" data-act="ref:${esc(rk)}">参照 Read the reference entry for ${esc(refTitle(rk))}</button>`:"";
  if(!sug.length||exact) return link;
  return link+`<div class="sug mb3">${sug.map(x=>
    `<button data-act="pick:${LIB.indexOf(x)}">
      <span class="n">${esc(x.n)}</span>
      <span class="d">${x.noDose?"dose is yours to set":`${trim(x.dose)} ${x.u}`}${x.freq?` &middot; ${x.freq==="daily"?"daily":x.freq==="interval"?`every ${x.interval}d`:"2&times;/wk"}`:""}${x.t?` &middot; ${timingLabel(x.t)}`:""}${x.research?" &middot; research":""}</span>
    </button>`).join("")}</div>`;
}
function nutHTML(){
  const d = UI.draft; if(!d) return "";
  const q = String(d.nutSearch||"").trim().toLowerCase();
  if(!q) return "";
  const hits = Object.entries(NUTRIENTS).filter(([k,v])=>v.label.toLowerCase().includes(q)).slice(0,8);
  if(!hits.length) return `<div class="eyebrow plain mb2">No match &mdash; leave it unchecked or try another word.</div>`;
  return `<div class="sug mb2">${hits.map(([k,v])=>

     <span class="d">${v.ul?`limit ${v.ul} ${v.unit}/day`:"no established limit"}</span></button>`).join("")}</div>`;
}
const scrollTop = () => { try{ window.scrollTo(0,0); }catch(_){} };
/* one place that decides what a blank item looks like, and one place that
   fills it in from the library, so the add buttons and the reference pages
   can't drift apart */
function newDraft(kind){
  return {id:uid(),kind,name:"",dose:"",unit:kind==="peptide"?"mcg":"mg",
    doseMode:"amount",cvMg:10,cvWater:1,cvUnits:10,
    freq:"daily",days:[1,2,3,4,5],interval:kind==="peptide"?7:2,perDay:1,
    startDate:today(),cycleOn:"",cycleOff:"",leadDays:DEFAULT_LEAD,notes:"",
    timing:kind==="peptide"?null:"morning",withFood:false,nutrient:"",pclass:"",form:"",active:true};
}
function applyLib(D,x){
  Object.assign(D,{name:x.n,dose:x.noDose?"":x.dose,unit:x.u,nutrient:x.nut||"",form:x.form||"",
    pclass:x.pclass||"",research:x.research?1:0,noDose:x.noDose?1:0,
    titrate:x.titrate||"",planStr:x.planStr||"",plan:x.planStr?parsePlan(x.planStr):null});
  if(x.t){ D.timing=x.t; D.withFood=!!x.food; }
  if(x.freq){ D.freq=x.freq; if(x.days) D.days=x.days; if(x.interval) D.interval=x.interval; }
  return D;
}
function searchLib(q,kind){
  const s = String(q).trim().toLowerCase();
  if(s.length<1) return [];
  const want = kind==="peptide"?"pep":"supp";
  return LIB.filter(x=>x.k===want).map(x=>{
      const n=x.n.toLowerCase(), a=(x.alt||"").toLowerCase();
      let score=-1;
      if(n.startsWith(s)) score=0; else if(n.includes(s)) score=1; else if(a.includes(s)) score=2;
      return {x,score};
    }).filter(r=>r.score>=0)
    .sort((a,b)=>a.score-b.score||a.x.n.length-b.x.n.length)
    .slice(0,6).map(r=>r.x);
}

function cvReadout(){
  const d = UI.draft;
  const mg = num(d.cvMg??10), w = num(d.cvWater??1), u = num(d.cvUnits??10);
  if(!mg||!w||!u) return `<div class="eyebrow plain">Fill in all three to see the conversion.</div>`;
  const mcgPerMl = mg*1000/w;
  const perUnit = mcgPerMl/100;
  const ml = u/100;
  const mcg = mcgPerMl*ml;
  const doses = Math.floor(w*100/u);
  return `<div class="readout">
    <b>${mcg>=1000?trim(mcg/1000)+" mg":trim(mcg)+" mcg"}</b>
    <div class="eyebrow plain">per dose &middot; ${trim(u)} units = ${trim(ml)} mL${mcg>=1000?` = ${trim(mcg)} mcg`:""}</div>
    <div class="eyebrow plain" style="margin-top:7px">${trim(mg/w)} mg/mL &middot; 1 unit = ${trim(perUnit)} mcg &middot; vial holds ${doses} dose${doses===1?"":"s"}</div>
  </div>`;
}

    ${!pep?`<label class="eyebrow">When</label>

function batchReadout(){
  const d = UI.draft, it = S.items.find(x=>x.id===d.itemId);
  if(!it) return "";
  if(!isPep(it)){
    const serv = num(d.servings), cnt = num(d.sealed);
    if(!serv) return "";
    const dpw = dosesPerWeek(it);
    return `${trim(serv*cnt)} servings across this batch, about ${dpw>0?Math.floor(serv*cnt/dpw*7):0} days at ${fx(dpw)} per week.`;
  }
  const dm = toMcg(num(it.dose),it.unit);
  if(d.form==="premix"){
    const mg=num(d.mg), ml=num(d.ml);
    if(!mg||!ml) return "";
    const conc=mg/ml;
    const per=dm?Math.floor(mg*1000/dm):null;
    return `${trim(conc)} mg/mL. ${per!=null?`At ${it.dose}${it.unit} per dose that's about ${per} doses per vial, ${per*num(d.sealed||0)} across this batch, `:""}`+
      `${dm?`a ${fx(dm/(conc*1000)*100)} unit draw on a U-100 syringe.`:"set the dose in mg or mcg to see the draw."} Nothing to reconstitute.`;
  }
  if(!dm||!num(d.mg)) return "";
  const per = Math.floor(num(d.mg)*1000/dm);
  const w = stdWater(d.mg);
  return `At ${it.dose}${it.unit} per dose that's about ${per} doses per vial, ${per*num(d.sealed||0)} across this batch. `+
    `Each ${trim(num(d.mg))} mg vial takes ${trim(w)} mL of water at the 1 mL per 10 mg standard.`;
}

function waterOptions(mg){
  const std = stdWater(mg)||1;
  const set = [std/2, std, std*1.5, std*2].map(x=>Math.round(x*100)/100).filter(x=>x>0);
  return [...new Set(set)].sort((a,b)=>a-b);
}

function reconReadout(){
  const d = UI.draft, it = S.items.find(x=>x.id===d.itemId);
  const totalMcg = num(d.mg)*1000, water = num(d.water);
  const conc = water>0?totalMcg/water:0;
  const dm = toMcg(num(it.dose),it.unit);
  const ml = dm&&conc?dm/conc:0, units = ml*100;
  const doses = dm?Math.floor(totalMcg/dm):null;
  const prev = S.vials.filter(x=>x.itemId===it.id&&x.kind!=="container"&&x.id!==d.id&&num(x.water)>0)
    .sort((a,b)=>a.reconDate<b.reconDate?1:-1)[0];
  let cmp = "";
  if(prev&&dm&&conc){
    const pConc = num(prev.mg)*1000/num(prev.water);
    if(pConc>0&&Math.abs(pConc-conc)/pConc>0.01){
      const pu = dm/pConc*100;
      cmp = `<div class="eyebrow plain" style="color:var(--kin);margin-top:7px">Different mix than your last vial (${fx(pConc/1000,2)} mg/mL). Same ${it.dose}${esc(it.unit)} dose, new mark: draw ${fx(units)} units now instead of ${fx(pu)}.</div>`;
    }
  }
  return `<div class="readout">
    <div class="eyebrow plain">Resulting draw</div>
    <b>${units?fx(units):"—"} units</b>
    <div class="eyebrow plain">per ${it.dose}${esc(it.unit)} dose on a U-100 syringe &middot; ${ml?fx(ml,3):"—"} mL</div>
    <div class="eyebrow plain" style="margin-top:7px">${conc?fx(conc/1000,2)+" mg/mL":"—"} &middot; ${trim(num(d.water))} mL total in the vial &middot; about ${doses??"—"} doses</div>
    <div class="eyebrow plain" style="margin-top:5px">${d.premix
      ?`Concentration is whatever the label says &mdash; nothing here dilutes it. ${trim(num(d.mg))} mg at ${it.dose}${esc(it.unit)} is ${doses??"—"} doses.`
      :`Doses per vial come from the powder, not the water &mdash; ${trim(num(d.mg))} mg at ${it.dose}${esc(it.unit)} is ${doses??"—"} doses however you dilute it. Water only changes the size of the draw.`}</div>
    ${units>0&&units<5?`<div class="eyebrow plain" style="color:var(--kin);margin-top:7px">That's a small mark to hit on the barrel. If you'd rather have a bigger draw, doubling the water doubles the units without changing the dose.</div>`:""}
    ${cmp}
    ${!dm?`<div class="eyebrow plain" style="color:var(--kin);margin-top:7px">This item's dose is set in iu, which has no fixed conversion to mg &mdash; switch the dose to mcg or mg to get draw math and dose counts.</div>`:""}
  </div>`;
}

        :UI.tab==="ref"?viewRef():viewTrends()}
    </div>
    <div class="wrap eyebrow plain" style="padding-bottom:28px;line-height:1.6;opacity:.8">
      A record of what you did and a check against published limits — not guidance on what to take.
      Doses, schedules, and storage windows are yours to set with your clinician.
      <div style="margin-top:9px;opacity:.8">改訂 ${REV} &middot; stack-log-${REV}.html</div>
    </div>`;
  renderModal();
}

/* ============================================================
   LOGGING — one tap stamps, long press opens the sheet
   ============================================================ */
function quickLog(it){
  const open = S.vials.filter(v=>v.itemId===it.id&&!v.finished);
  let site = null;
  if(isPep(it)){
    const used = S.logs.filter(l=>l.itemId===it.id&&l.site).sort((x,y)=>x.date<y.date?1:-1);
    site = used.length?SITES[(SITES.indexOf(used[0].site)+1)%SITES.length]:SITES[0];
  }
  S.logs = [...S.logs,{id:uid(),itemId:it.id,date:UI.date,dose:effDose(it,UI.date),
    unit:it.unit,time:nowTime(),site,note:"",vialId:open[0]?.id||null}];
  LOGIX = null;
}
function openLogSheet(a){
  const it = S.items.find(x=>x.id===a); if(!it) return;
  const dl = logsFor(a,UI.date);
  const ex = dl.length>=(it.perDay||1) ? dl[dl.length-1] : null;
  const open = S.vials.filter(v=>v.itemId===a&&!v.finished);
  let nextSite = null;
  if(isPep(it)){
    const used = S.logs.filter(l=>l.itemId===a&&l.site).sort((x,y)=>x.date<y.date?1:-1);
    nextSite = used.length?SITES[(SITES.indexOf(used[0].site)+1)%SITES.length]:SITES[0];
  }
  UI.modal = "log";
  UI.draft = ex?{...ex,itemId:a,existing:true}
    :{id:uid(),itemId:a,dose:effDose(it,UI.date),time:nowTime(),site:nextSite,note:"",vialId:open[0]?.id||""};
  renderModal();
}
let lpTimer = null, lpFired = false;
document.addEventListener("pointerdown", e => {
  const t = e.target.closest('[data-act^="stamp:"]');
  if(!t) return;
  lpFired = false;
  clearTimeout(lpTimer);
  lpTimer = setTimeout(()=>{ lpFired = true; openLogSheet(t.dataset.act.split(":")[1]); },450);
});
document.addEventListener("pointerup", ()=>clearTimeout(lpTimer));
document.addEventListener("pointercancel", ()=>clearTimeout(lpTimer));

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act]");
  if(!t) return;
  const raw = t.dataset.act;
  const [act,a,b] = raw.split(":");
  const D = UI.draft;

  if(act==="close-bg" && e.target!==t) return;
  if(act!=="undo") UI.formErr=null;
  if(act==="close"||act==="close-bg"){
    if((UI.modal==="ref"||UI.modal==="reflist")&&UI.prevModal){ const p=UI.prevModal; UI.prevModal=null; UI.modal=p.m; UI.draft=p.d; return renderModal(); }
    UI.prevModal=null; UI.modal=null; UI.draft=null; UI.scanMsg=""; return renderModal(); }
  if(act==="tab"){
    if(a==="labs"){ UI.tab="check"; UI.checkView="labs"; }
    else UI.tab=a;
    return render();
  }
  if(act==="cview"){ UI.checkView=a; return render(); }
  if(act==="csel"){ UI.csel=Number(a); return render(); }
  if(act==="trview"){ UI.trView=a; return render(); }
  if(act==="refList"){
    if(!UI.modal){ UI.tab="ref"; UI.refKey=null; UI.refFrom=null; return render(); }
    if(UI.modal!=="ref"&&UI.modal!=="reflist") UI.prevModal={m:UI.modal,d:UI.draft};
    UI.modal="reflist"; return renderModal(); }
  if(act==="refFilter"){ UI.refFilter=a; return UI.modal?renderModal():render(); }
  if(act==="refBack"){ UI.refKey=null; UI.refFrom=null; scrollTop(); return render(); }
  if(act==="ref"){
    const key=raw.slice(4);
    if(!REF[key]) return;
    if(!UI.modal&&UI.tab==="ref"){ UI.refKey=key; UI.refFrom="tab"; scrollTop(); return render(); }
    if(UI.modal&&UI.modal!=="ref"&&UI.modal!=="reflist") UI.prevModal={m:UI.modal,d:UI.draft};
    UI.refFrom=UI.modal==="reflist"?"list":null;
    UI.refKey=key; UI.modal="ref"; return renderModal();
  }
  /* the two things a reference page can do for you */
  if(act==="refAdd"){
    const key=raw.slice(7), e=REF[key];
    if(!e) return;
    const lib=libForRef(key);
    const kind=lib?(lib.k==="pep"?"peptide":"supplement"):(e.t==="supp"?"supplement":"peptide");
    const d=newDraft(kind);
    if(lib) applyLib(d,lib);
    else if(e.t==="supp"){ d.nutrient=key; d.name=NUTRIENTS[key]?NUTRIENTS[key].label:refTitle(key); }
    else d.name=refTitle(key);
    UI.prevModal=null; UI.draft=d; UI.modal="item";
    return renderModal();
  }
  if(act==="refStock"){
    const it=S.items.find(x=>x.id===a); if(!it) return;
    UI.prevModal=null; UI.modal="batch";
    UI.draft={id:uid(),itemId:it.id,mg:"",servings:"",sealed:1,
      addedDate:today(),lot:"",source:"",location:"",cost:""};
    return renderModal();
  }
  if(act==="bfocus"){ UI.bodyFocus=a; return render(); }
  if(act==="hmk"){ UI.hmk=a; return render(); }
  if(act==="addBody"){
    UI.modal="body";
    UI.draft={id:uid(),date:today(),weight:"",waist:"",sys:"",dia:"",rhr:""};
    return renderModal();
  }
  if(act==="saveBody"){
    const e={id:D.id,date:D.date||today()};
    let anyv=false;
    for(const k of ["weight","waist","sys","dia","rhr"]){
      const n=parseFloat(D[k]);
      if(!isNaN(n)){ e[k]=n; anyv=true; }
    }
    if(!anyv){ UI.formErr={field:"weight",msg:"Fill in at least one number."}; return renderModal(); }
    S.body=[...(S.body||[]).filter(x=>x.id!==e.id),e];
    UI.modal=null; UI.draft=null; UI.trView="body"; return commit();
  }
  if(act==="delBody"){
    UNDO=snap();
    S.body=(S.body||[]).filter(x=>x.id!==a);
    showToast("Entry removed",true);
    return commit();
  }
  if(act==="ics"){
    downloadFile(`stack-reminders-${REV}.ics`,"text/calendar",buildICS());
    showToast("Open the file — your calendar takes it from there",false,5000);
    return;
  }
  if(act==="tplExport"){
    if(!S.items.length){ showToast("Nothing in the stack to share yet",false,3500); return; }
    downloadFile(`stack-template-${today()}.json`,"application/json",tplJSON());
    showToast("Template saved — items and schedules only, no logs or labs",false,5000);
    return;
  }
  if(act==="tplImport"){
    const inp=document.createElement("input"); inp.type="file"; inp.accept=".json";
    inp.onchange=()=>{
      const fl=inp.files[0]; if(!fl) return;
      const r=new FileReader();
      r.onload=()=>{ try{
        const d=JSON.parse(r.result);
        if(d.type!=="stack-template"||!Array.isArray(d.items)){
          showToast(d.logs||d.vials?"That looks like a full backup — use Restore instead":"That file isn't a stack template",false,6000);
          return;
        }
        UNDO=snap();
        const have=new Set(S.items.map(x=>x.name.toLowerCase()));
        let added=0,skipped=0;
        for(const t of d.items){
          if(!t.name||have.has(String(t.name).toLowerCase())){ skipped++; continue; }
          S.items=[...S.items,{...t,id:uid(),startDate:today(),active:true,notes:"",
            doseMode:"amount",leadDays:t.leadDays||DEFAULT_LEAD}];
          added++;
        }
        showToast(`Added ${added} from template${skipped?`, skipped ${skipped} you already have`:""}`,true,8000);
        commit();
      }catch(err){ showToast("That file couldn't be read",false); } };
      r.readAsText(fl);
    };
    inp.click(); return;
  }
  if(act==="fixfood"){
    const ids=a.split(",");
    S.items=S.items.map(x=>ids.includes(x.id)?{...x,withFood:true}:x);
    showToast("Marked with food",false,3000);
    return commit();
  }
  if(act==="fixmove"){
    const fit=S.items.find(x=>x.id===a); if(!fit) return;
    S.items=S.items.map(x=>x.id===a?{...x,timing:b}:x);
    showToast(`Moved ${esc(fit.name)} to ${timingLabel(b).toLowerCase()}`,false,3500);
    return commit();
  }
  if(act==="undo"){
    if(!UNDO) return;
    S = migrate(JSON.parse(UNDO)); UNDO=null;
    clearTimeout(toastTimer);
    const tEl=document.getElementById("toast"); if(tEl) tEl.innerHTML="";
    return commit();
  }
  if(act==="filter"){ UI.filter=a; return render(); }
  if(act==="day"){ const n=shift(UI.date,Number(a)); if(n<=today()||Number(a)<0) UI.date=n; return render(); }
  if(act==="focus"){ UI.focus=a; UI.csel=null; return render(); }
  if(act==="range"){ UI.range=Number(a); UI.csel=null; return render(); }
  if(act==="moreFlags"){ UI.moreFlags=!UI.moreFlags; return render(); }
  if(act==="sex"){ S.profile.sex=a; return commit(); }
  if(act==="flag"){
    const f = S.profile.flags||[];
    S.profile.flags = f.includes(a)?f.filter(x=>x!==a):[...f,a];
    return commit();
  }

  if(act==="add"){
    UI.modal="item"; UI.draft=newDraft(a);
    return renderModal();
  }
  if(act==="edit"){ UI.modal="item"; UI.draft={...S.items.find(x=>x.id===a),existing:true}; return renderModal(); }
  if(act==="pick"){
    const x = LIB[Number(a)]; if(!x) return;
    applyLib(D,x);
    return renderModal();
  }
  if(act==="dmode"){ D.doseMode=a; return renderModal(); }
  if(act==="nutpick"){ D.nutrient=a||""; D.nutSearch=""; return renderModal(); }
  if(act==="freq"){ D.freq=a; return renderModal(); }
  if(act==="timing"){ D.timing=a; return renderModal(); }
  if(act==="food"){ D.withFood=!D.withFood; return renderModal(); }
  if(act==="dow"){
    const i=Number(a);
    D.days=(D.days||[]).includes(i)?D.days.filter(x=>x!==i):[...(D.days||[]),i];
    return renderModal();
  }
  if(act==="saveItem"){
    if(!String(D.name).trim()){ UI.formErr={field:"name",msg:"Give it a name first."}; return renderModal(); }
    if(D.kind==="peptide"&&D.doseMode==="units"){
      if(!(num(D.cvMg)>0)){ UI.formErr={field:"cvMg",msg:"How many mg is the vial?"}; return renderModal(); }
      if(!(num(D.cvWater)>0)){ UI.formErr={field:"cvWater",msg:"How much water goes in?"}; return renderModal(); }
      if(!(num(D.cvUnits)>0)){ UI.formErr={field:"cvUnits",msg:"How many units do you draw?"}; return renderModal(); }
      const conv = unitsToMass(num(D.cvMg),num(D.cvWater),num(D.cvUnits));
      D.dose = conv.dose; D.unit = conv.unit;
    }
    if(!(num(D.dose)>0)){ UI.formErr={field:"dose",msg:"Dose needs to be a number above zero."}; return renderModal(); }
    if(D.kind==="peptide"&&String(D.planStr||"").trim()){
      const pl=parsePlan(D.planStr);
      if(!pl){ UI.formErr={field:"planStr",msg:"Couldn't read that — use dose x weeks, like 0.25x4, 0.5x4, 1"}; return renderModal(); }
      D.plan=pl;
    } else if(D.kind==="peptide") D.plan=null;
    const it={...D,name:String(D.name).trim(),dose:num(D.dose),
      interval:parseInt(D.interval)||2,perDay:parseInt(D.perDay)||1,
      cycleOn:D.cycleOn===""?"":parseInt(D.cycleOn)||"",
      cycleOff:D.cycleOff===""?"":parseInt(D.cycleOff)||"",
      leadDays:parseInt(D.leadDays)||DEFAULT_LEAD};
    if(it.kind==="peptide"){ it.nutrient=""; it.timing=null; it.withFood=false; }
    else if(!PCLASS[it.pclass]) it.pclass="";
    delete it.existing; delete it.noDose;
    S.items = S.items.some(x=>x.id===it.id)?S.items.map(x=>x.id===it.id?it:x):[...S.items,it];
    UI.modal=null; UI.draft=null; return commit();
  }
  if(act==="toggle"){ S.items=S.items.map(x=>x.id===a?{...x,active:!x.active}:x); return commit(); }
  if(act==="del"){
    const it=S.items.find(x=>x.id===a); if(!it) return;
    UNDO = snap();
    S.items=S.items.filter(x=>x.id!==a); S.logs=S.logs.filter(l=>l.itemId!==a);
    S.batches=S.batches.filter(x=>x.itemId!==a); S.vials=S.vials.filter(x=>x.itemId!==a);
    showToast(`Deleted ${esc(it.name)} and its history`,true,7000);
    return commit();
  }

  if(act==="log"){ openLogSheet(a); return; }
  if(act==="stamp"){
    if(lpFired){ lpFired=false; return; }
    const it=S.items.find(x=>x.id===a);
    if(!it) return;
    if(!(num(it.dose)>0)){ openLogSheet(a); return; }
    quickLog(it); buzz(); return commit();
  }
  if(act==="stampSlot"){
    const due = S.items.filter(i=>isDue(i,UI.date));
    const group = a==="pep" ? due.filter(isPep)
      : due.filter(i=>!isPep(i)&&(i.timing||"any")===a);
    let n=0;
    for(const it of group){
      if(logsFor(it.id,UI.date).length>=(it.perDay||1)) continue;
      if(!(num(it.dose)>0)) continue;
      quickLog(it); n++;
    }
    if(n){ buzz(); showToast(`${n} dose${n>1?"s":""} stamped`,false,3500); return commit(); }
    return;
  }
  if(act==="site"){ D.site=raw.slice(5); return renderModal(); }
  if(act==="saveLog"){
    if(!(num(D.dose)>0)){ UI.formErr={field:"dose",msg:"Dose needs to be a number above zero."}; return renderModal(); }
    const it=S.items.find(x=>x.id===D.itemId);
    S.logs=[...S.logs.filter(l=>l.id!==D.id),{id:D.id,itemId:D.itemId,date:UI.date,
      dose:num(D.dose),unit:it.unit,time:D.time||null,site:D.site||null,
      note:String(D.note||"").trim(),vialId:D.vialId||null}];
    UI.modal=null; UI.draft=null; buzz(); return commit();
  }
  if(act==="delLog"){
    UNDO = snap();
    S.logs=S.logs.filter(l=>l.id!==a); UI.modal=null; UI.draft=null;
    showToast("Dose removed",true);
    return commit();
  }

  if(act==="addBatch"){
    const first=S.items[0];
    UI.modal="batch";
    UI.draft={id:uid(),itemId:first?.id||"",mg:"",ml:"",servings:"",sealed:1,
      form:first&&first.form==="premix"?"premix":"",
      addedDate:today(),lot:"",source:"",location:"",cost:""};
    return renderModal();
  }
  if(act==="bform"){ D.form=a==="premix"?"premix":""; return renderModal(); }
  if(act==="editBatch"){ UI.modal="batch"; UI.draft={...S.batches.find(x=>x.id===a),existing:true}; return renderModal(); }
  if(act==="saveBatch"){
    const it=S.items.find(x=>x.id===D.itemId);
    if(!it) return;
    if(isPep(it)&&!(num(D.mg)>0)){ UI.formErr={field:"mg",msg:"How many mg in the vial?"}; return renderModal(); }
    if(isPep(it)&&D.form==="premix"&&!(num(D.ml)>0)){ UI.formErr={field:"ml",msg:"How many mL in the vial?"}; return renderModal(); }
    if(!isPep(it)&&!(num(D.servings)>0)){ UI.formErr={field:"servings",msg:"How many servings per container?"}; return renderModal(); }
    const bt={...D,mg:num(D.mg),ml:num(D.ml),servings:num(D.servings),sealed:parseInt(D.sealed)||0,cost:num(D.cost)};
    delete bt.existing;
    S.batches = S.batches.some(x=>x.id===bt.id)?S.batches.map(x=>x.id===bt.id?bt:x):[...S.batches,bt];
    UI.modal=null; UI.draft=null; return commit();
  }
  if(act==="adj"){ S.batches=S.batches.map(x=>x.id===a?{...x,sealed:Math.max(0,(x.sealed||0)+Number(b))}:x); return commit(); }
  if(act==="delBatch"){
    UNDO = snap();
    S.batches=S.batches.filter(x=>x.id!==a);
    showToast("Batch removed",true);
    return commit();
  }

  if(act==="recon"){
    const bt=S.batches.find(x=>x.id===a);
    const premix=bt.form==="premix";
    UI.modal="recon";
    UI.draft={id:uid(),batchId:bt.id,itemId:bt.itemId,mg:bt.mg,premix:premix?1:0,
      water:premix?num(bt.ml):(stdWater(bt.mg)||1),
      reconDate:today(),budDays:premix?"":DEFAULT_BUD,lot:bt.lot};
    return renderModal();
  }
  if(act==="water"){ D.water=Number(a); return renderModal(); }
  if(act==="saveRecon"){
    if(!(num(D.water)>0)){ UI.formErr={field:"water",msg:"How much water went in?"}; return renderModal(); }
    S.vials=[...S.vials,{id:D.id,kind:"vial",itemId:D.itemId,batchId:D.batchId,mg:num(D.mg),
      water:num(D.water),reconDate:D.reconDate,premix:D.premix?1:0,
      budDays:D.premix?(parseInt(D.budDays)||0):(parseInt(D.budDays)||DEFAULT_BUD),
      lot:D.lot,finished:false}];
    S.batches=S.batches.map(x=>x.id===D.batchId?{...x,sealed:Math.max(0,(x.sealed||0)-1)}:x);
    UI.modal=null; UI.draft=null; return commit();
  }
  if(act==="openCont"){
    const bt=S.batches.find(x=>x.id===a);
    UI.modal="openCont";
    UI.draft={id:uid(),batchId:bt.id,itemId:bt.itemId,servings:bt.servings,reconDate:today(),lot:bt.lot};
    return renderModal();
  }
  if(act==="saveOpenCont"){
    if(!(num(D.servings)>0)){ UI.formErr={field:"servings",msg:"How many servings are in it?"}; return renderModal(); }
    S.vials=[...S.vials,{id:D.id,kind:"container",itemId:D.itemId,batchId:D.batchId,
      servings:num(D.servings),reconDate:D.reconDate,lot:D.lot,finished:false}];
    S.batches=S.batches.map(x=>x.id===D.batchId?{...x,sealed:Math.max(0,(x.sealed||0)-1)}:x);
    UI.modal=null; UI.draft=null; return commit();
  }
  if(act==="finishVial"){
    UNDO = snap();
    S.vials=S.vials.map(x=>x.id===a?{...x,finished:true,finishedDate:today()}:x);
    showToast("Marked finished — logged doses stay in your history",true);
    return commit();
  }

  /* labs */
  if(act==="addPanel"){
    UI.modal="panel"; UI.scanMsg="";
    UI.draft={id:uid(),date:today(),m:{},paste:""};
    return renderModal();
  }
  if(act==="editPanel"){
    UI.modal="panel"; UI.scanMsg="";
    const p = S.labs.find(x=>x.id===a);
    UI.draft={...p,m:{...(p.m||{})},paste:"",existing:true};
    return renderModal();
  }
  if(act==="scan"){
    const found = scanPanel(D.paste||"");
    const n = Object.keys(found).length;
    D.m = {...(D.m||{}),...found};
    const outN = Object.keys(found).filter(k=>mStatus(k,found[k])!=="in").length;
    UI.scanMsg = n
      ? `Found ${n} marker${n===1?"":"s"}${outN?`, ${outN} outside the reference range`:""}. Check each one against your report before saving.`
      : `Nothing recognized. Lab layouts vary a lot — you can type the values in directly below.`;
    return renderModal();
  }
  if(act==="savePanel"){
    const m = {};
    for(const [k,v] of Object.entries(D.m||{})){
      if(v===""||v==null) continue;
      const n = parseFloat(v);
      if(!isNaN(n)) m[k]=n;
    }
    if(!Object.keys(m).length){ UI.scanMsg="Add at least one value before saving."; return renderModal(); }
    const p = {id:D.id,date:D.date||today(),m};
    S.labs = (S.labs||[]).some(x=>x.id===p.id)
      ? S.labs.map(x=>x.id===p.id?p:x) : [...(S.labs||[]),p];
    UI.modal=null; UI.draft=null; UI.scanMsg=""; UI.tab="check"; UI.checkView="find";
    return commit();
  }
  if(act==="delPanel"){
    UNDO = snap();
    S.labs = (S.labs||[]).filter(x=>x.id!==a);
    showToast("Panel deleted",true);
    return commit();
  }
  if(act==="labExport"){
    const rows = [["date",...Object.keys(MARKERS)]];
    for(const p of (S.labs||[]).slice().sort((a,b)=>a.date<b.date?-1:1))
      rows.push([p.date,...Object.keys(MARKERS).map(k=>p.m?.[k]??"")]);
    const csv = rows.map(r=>r.join(",")).join("\n");
    const url = URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    const link = document.createElement("a");
    link.href=url; link.download=`bloodwork-${today()}.csv`; link.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000); return;
  }

  if(act==="export"){
    S.meta = S.meta||{};
    S.meta.lastExport = today();
    const url=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));
    const link=document.createElement("a");
    link.href=url; link.download=`stack-log-${REV}-${today()}.json`; link.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000); return commit();
  }
  if(act==="import"){
    const inp=document.createElement("input"); inp.type="file"; inp.accept=".json";
    inp.onchange=()=>{
      const f=inp.files[0]; if(!f) return;
      const r=new FileReader();
      r.onload=()=>{ try{
        const d=JSON.parse(r.result);
        UNDO = snap();
        S = migrate(d);
        showToast("Backup restored",true,15000);
        commit();
      }catch(err){ showToast("That file couldn't be read as a backup.",false); } };
      r.readAsText(f);
    };
    inp.click(); return;
  }
});

document.addEventListener("input", e => {
  if(e.target.dataset.field==="refQ"){
    UI.refQ=e.target.value;
    const pos=e.target.selectionStart;
    if(UI.modal) renderModal(); else render();
    const again=document.querySelector('[data-field="refQ"]');
    if(again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(_){} }
    return;
  }
  /* lab marker fields */
  const mf = e.target.dataset.mfield;
  if(mf && UI.draft){
    UI.draft.m = UI.draft.m||{};
    UI.draft.m[mf] = e.target.value;
    return;
  }
  const f = e.target.dataset.field;
  if(!f||!UI.draft) return;
  UI.draft[f]=e.target.value;
  if(UI.formErr && UI.formErr.field===f){
    UI.formErr = null;
    e.target.classList.remove("err");
    const fe = e.target.parentElement.querySelector(".ferr")||document.querySelector("#modal .ferr");
    if(fe) fe.remove();
  }
  if(UI.modal==="item"&&f.startsWith("cv")){
    const o=document.getElementById("cvout");
    if(o) o.innerHTML=cvReadout();
    return;
  }
  if(UI.modal==="item"&&f==="name"){
    if(composing) return;
    const box=document.getElementById("sugbox");
    if(box) box.innerHTML=sugHTML();
    return;
  }
  if(UI.modal==="item"&&f==="nutSearch"){
    if(composing) return;
    const box=document.getElementById("nutbox");
    if(box) box.innerHTML=nutHTML();
    return;
  }
  const out=document.getElementById("readout");
  if(out) out.innerHTML = UI.modal==="recon"?reconReadout()
    : UI.modal==="batch"?batchReadout()
    : UI.modal==="log"?logReadout() : out.innerHTML;
  if(UI.modal==="openCont"&&f==="servings") renderModal();
});
document.addEventListener("keydown", e => {
  if(!UI.modal) return;
  if(e.key==="Escape"){
    UI.modal=null; UI.draft=null; UI.scanMsg=""; UI.formErr=null;
    renderModal(); return;
  }
  if(e.key==="Tab"){
    const f = [...document.querySelectorAll('#modal [role="dialog"] input, #modal [role="dialog"] select, #modal [role="dialog"] textarea, #modal [role="dialog"] button')].filter(x=>!x.disabled);
    if(!f.length) return;
    const first=f[0], last=f[f.length-1];
    if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  }
});

let swX=null, swY=null;
document.addEventListener("touchstart", e => {
  if(UI.modal||UI.tab!=="today"){ swX=null; return; }
  swX=e.touches[0].clientX; swY=e.touches[0].clientY;
},{passive:true});
document.addEventListener("touchend", e => {
  if(swX==null||UI.modal||UI.tab!=="today") { swX=null; return; }
  const dx=e.changedTouches[0].clientX-swX, dy=e.changedTouches[0].clientY-swY;
  swX=null;
  if(Math.abs(dx)<70||Math.abs(dy)>40) return;
  if(dx<0 && UI.date<today()){ UI.date=shift(UI.date,1); render(); }
  else if(dx>0){ UI.date=shift(UI.date,-1); render(); }
},{passive:true});

document.addEventListener("change", e => {
  const f=e.target.dataset.field;
  if(f&&UI.draft&&e.target.tagName==="SELECT"){
    UI.draft[f]=e.target.value;
    if(f==="sex"){ S.profile.sex=e.target.value; store.save(S); }
    /* switching to a different item on the stock sheet should bring that
       item's form with it, or the toggle describes the previous one */
    if(UI.modal==="batch"&&f==="itemId"&&!UI.draft.existing){
      const pick=S.items.find(x=>x.id===e.target.value);
      UI.draft.form=pick&&pick.form==="premix"?"premix":"";
    }
    if(UI.modal==="batch"||UI.modal==="log"||UI.modal==="item"||UI.modal==="panel") renderModal();
  }
});

/* ============================================================
   MIGRATION + INIT
   ============================================================ */
function migrate(d){
  const out = {items:[],logs:[],batches:[],vials:[],labs:[],profile:{flags:[],sex:"m"},...d};
  if(Array.isArray(d.peptides)&&d.peptides.length&&!(out.items||[]).length){
    out.items = d.peptides.map(p=>({...p,kind:"peptide",timing:null,withFood:false,
      nutrient:p.nutrient||"",pclass:p.pclass||""}));
  }
  out.items = (out.items||[]).map(i=>({...i,kind:i.kind||"peptide"}));
  out.logs = (out.logs||[]).map(l=>({...l,itemId:l.itemId||l.peptideId}));
  out.batches = (out.batches||[]).map(b=>({...b,itemId:b.itemId||b.peptideId}));
  out.vials = (out.vials||[]).map(v=>({...v,itemId:v.itemId||v.peptideId,kind:v.kind||"vial"}));
  out.labs = out.labs||[];
  out.profile = out.profile||{};
  out.profile.flags = out.profile.flags||[];
  out.profile.sex = out.profile.sex||"m";
  out.meta = out.meta||{lastExport:null};
  out.body = out.body||[];
  delete out.peptides;
  return out;
}

/* ============================================================
   OFFLINE — service worker registration and update prompt
   ============================================================ */
(function(){
  if(!("serviceWorker" in navigator)) return;
  if(location.protocol!=="https:"&&location.hostname!=="localhost") return;
  let reloading=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(reloading) return; reloading=true; location.reload(); });
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").then(reg=>{
      const offer=w=>{
        UNDO=null;
        const t=document.getElementById("toast");
        if(!t) return;
        clearTimeout(toastTimer);
        t.innerHTML=`<div class="toast" role="status"><span class="sm">A new version of the app is ready.</span><button class="tiny shu" id="swReload">Reload</button></div>`;
        const b=document.getElementById("swReload");
        if(b) b.onclick=()=>{ w.postMessage("skipWaiting"); };
      };
      if(reg.waiting&&navigator.serviceWorker.controller) offer(reg.waiting);
      reg.addEventListener("updatefound",()=>{
        const w=reg.installing; if(!w) return;
        w.addEventListener("statechange",()=>{ if(w.state==="installed"&&navigator.serviceWorker.controller) offer(w); });
      });
      /* check for a new build each time the app comes back to the foreground */
      document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") reg.update().catch(()=>{}); });
    }).catch(()=>{});
  });
})();

(async function init(){
  const saved = await store.load();
  if(saved) S = migrate(saved);
  render();
})();
</script>
