<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>朱 — Stack Log</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --sumi:#0B0A0C; --sumi-2:#151016;
  --line:rgba(242,237,230,.11); --line-2:rgba(242,237,230,.055);
  --washi:#F2EDE6; --hai:#968D95;
  --shu:#FF5A3C; --shu-2:#C1272D; --shu-dim:rgba(255,90,60,.22);
  --beni:#8C1B2A; --kin:#D9A94A; --alert:#F27D93;
  --lacquer:linear-gradient(158deg,#1C161E 0%,#120E14 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{background:var(--sumi);color-scheme:dark;}
body{
  margin:0;color:var(--washi);
  font-family:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:15px;line-height:1.5;
  background:
    radial-gradient(900px 480px at 88% -6%, rgba(255,90,60,.16), transparent 62%),
    radial-gradient(700px 420px at 4% 102%, rgba(140,27,42,.20), transparent 66%),
    linear-gradient(178deg,#0B0A0C 0%,#141017 52%,#0B0A0C 100%);
  background-attachment:fixed;min-height:100vh;
  padding-bottom:env(safe-area-inset-bottom);
}
.display{font-family:"Shippori Mincho",Georgia,serif;font-weight:800;letter-spacing:.01em;}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--hai);}
.plain{letter-spacing:.02em;text-transform:none;}
.kanji{font-family:"Shippori Mincho",serif;font-weight:600;}
.data{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;
  font-size:12.5px;color:rgba(242,237,230,.9);}
input.err,textarea.err{border-color:var(--alert) !important;animation:shake .3s;}
.ferr{font-size:12px;color:var(--alert);margin:-8px 0 10px;}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:80;}
.toast{background:linear-gradient(178deg,#241B26,#141016);border:1px solid rgba(255,90,60,.4);border-radius:3px;
  padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  box-shadow:0 14px 34px -14px rgba(0,0,0,.9);animation:rise .3s cubic-bezier(.22,1,.36,1);}
.toast button{flex:none;}

.card{background:var(--lacquer);border:1px solid var(--line);border-radius:3px;position:relative;
  box-shadow:0 1px 0 rgba(242,237,230,.045) inset,0 12px 30px -18px rgba(0,0,0,.9);}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;display:none;
  background:linear-gradient(180deg,var(--shu),rgba(140,27,42,0));opacity:.6;border-radius:3px 0 0 3px;}
.card.flat::before{display:none;}
.card.spine::before{display:block;}
.card.spine.red::before{background:linear-gradient(180deg,var(--alert),rgba(140,27,42,0));}
.card.gold::before{display:block;background:linear-gradient(180deg,var(--kin),rgba(217,169,74,0));}
.pad{padding:15px 16px;} .pad2{padding:12px 14px;} .wrap{padding:0 16px;}
.row{display:flex;} .col{display:flex;flex-direction:column;}
.gap1{gap:5px;} .gap2{gap:8px;} .gap3{gap:12px;} .gap4{gap:16px;}
.between{justify-content:space-between;} .center{align-items:center;} .end{align-items:flex-end;}
.f1{flex:1;min-width:0;} .none{flex:none;} .wrapf{flex-wrap:wrap;}
.mb1{margin-bottom:4px;} .mb2{margin-bottom:8px;} .mb3{margin-bottom:12px;} .mb4{margin-bottom:18px;}
.sm{font-size:13px;} .xs{font-size:12px;} .muted{color:var(--hai);}

button{font:inherit;cursor:pointer;border-radius:3px;border:1px solid var(--line);
  background:rgba(242,237,230,.04);color:var(--washi);padding:10px 12px;
  transition:border-color .18s,background .18s,transform .1s;}
button:hover{border-color:rgba(255,90,60,.4);}
button:active{transform:translateY(1px);}
button:disabled{opacity:.32;cursor:default;}
.primary{background:linear-gradient(140deg,#2A2130,#161119);border-color:rgba(242,237,230,.2);}
.shu{background:linear-gradient(138deg,var(--shu) 0%,var(--shu-2) 78%,#93202A 100%);
  border-color:rgba(255,120,90,.5);color:#fff;font-weight:700;
  box-shadow:0 6px 20px -8px rgba(255,90,60,.6);}
.danger{color:var(--alert);} .icon{padding:9px 11px;line-height:1;}
.wide{width:100%;justify-content:center;}
.tiny{font-size:11px;padding:5px 8px;}

input,select,textarea{background:rgba(11,10,12,.72);border:1px solid var(--line);border-radius:3px;
  color:var(--washi);padding:11px;width:100%;font-size:16px;
  font-family:"IBM Plex Mono",monospace;transition:border-color .18s;}
input:focus,select:focus,textarea:focus{border-color:rgba(255,90,60,.55);}
textarea{font-family:inherit;resize:vertical;} select{appearance:none;}
input.slim{padding:7px 9px;font-size:16px;}
*:focus-visible{outline:1px solid var(--shu);outline-offset:2px;}

.crest{position:relative;overflow:hidden;padding-top:env(safe-area-inset-top);
  background-image:repeating-radial-gradient(circle at 50% 118%,
    transparent 0 15px,rgba(255,90,60,.075) 15px 16px,transparent 16px 30px);
  background-size:34px 17px;border-bottom:1px solid var(--line-2);}
.rule{height:1px;background:linear-gradient(90deg,var(--shu),rgba(255,90,60,0) 72%);opacity:.7;}

.tabs{display:flex;gap:14px;padding:0 16px;overflow-x:auto;scrollbar-width:none;
  border-bottom:1px solid var(--line-2);}
.tabs::-webkit-scrollbar{display:none;}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--hai);
  padding:9px 0 8px;border-radius:0;white-space:nowrap;text-align:center;}
.tab .k{display:block;font-size:10px;line-height:1.3;opacity:.7;}
.tab .e{display:block;font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;}
.tab.on{color:var(--washi);border-bottom-color:var(--shu);}
.tab.on .k{color:var(--shu);}
.tabwrap{position:relative;}
.tabwrap::after{content:"";position:absolute;top:0;right:0;bottom:1px;width:36px;pointer-events:none;
  background:linear-gradient(90deg,rgba(11,10,12,0),rgba(11,10,12,.92));}
.badge{display:inline-block;background:var(--kin);color:#1A1206;border-radius:2px;
  font-family:"IBM Plex Mono",monospace;font-size:9px;padding:1px 4px;margin-left:4px;vertical-align:2px;}
.badge.red{background:var(--beni);color:#FFE9EC;}

.hinomaru{width:86px;height:86px;border-radius:50%;position:relative;overflow:hidden;flex:none;
  border:1px solid rgba(255,90,60,.3);background:rgba(11,10,12,.6);}
.hinomaru i{position:absolute;left:0;right:0;bottom:0;display:block;
  background:linear-gradient(180deg,var(--shu),var(--shu-2) 72%,#8C1B2A);
  transition:height .55s cubic-bezier(.22,1,.36,1);}
.hinomaru u{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  font-size:19px;font-weight:600;text-decoration:none;text-shadow:0 1px 6px rgba(0,0,0,.75);}
.hinomaru.full{box-shadow:0 0 34px -4px rgba(255,90,60,.6);border-color:rgba(255,90,60,.75);}

.seal{width:52px;height:52px;flex:none;border-radius:3px;padding:0;position:relative;
  -webkit-touch-callout:none;user-select:none;touch-action:manipulation;
  display:flex;align-items:center;justify-content:center;
  font-family:"Shippori Mincho",serif;font-size:21px;font-weight:800;
  border:1px solid rgba(255,90,60,.35);background:rgba(255,90,60,.05);color:rgba(255,90,60,.5);}
.seal.mini{width:38px;height:38px;font-size:15px;}
.seal.done{background:linear-gradient(140deg,var(--shu),var(--shu-2) 80%);
  border-color:transparent;color:#fff;transform:rotate(-5deg);
  box-shadow:0 6px 22px -8px rgba(255,90,60,.75);animation:stamp .42s cubic-bezier(.2,1.5,.4,1);}
@keyframes stamp{0%{transform:rotate(-16deg) scale(1.5);opacity:0;}
  55%{transform:rotate(-3deg) scale(.94);opacity:1;}100%{transform:rotate(-5deg) scale(1);}}
.seal .hint{position:absolute;left:0;right:0;bottom:3px;font-style:normal;
  font-family:"IBM Plex Mono",monospace;font-size:8px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--hai);}
.seal.mini .hint{bottom:1px;font-size:7px;letter-spacing:.1em;}

.barrel{display:flex;align-items:flex-end;gap:3px;height:28px;}
.tick{flex:1;border-radius:1px;}
.tick.hit{background:linear-gradient(180deg,var(--shu),var(--shu-2));box-shadow:0 0 9px -1px rgba(255,90,60,.65);}
.tick.due{background:var(--shu-dim);} .tick.off{background:rgba(242,237,230,.09);}

.vial{position:relative;width:28px;height:56px;flex:none;overflow:hidden;
  border:1px solid var(--line);border-radius:2px 2px 8px 8px;background:rgba(11,10,12,.7);}
.vial.jar{border-radius:3px 3px 4px 4px;}
.vial i{position:absolute;left:0;right:0;bottom:0;display:block;
  background:linear-gradient(180deg,var(--shu),var(--shu-2) 70%,#7C1824);
  transition:height .45s cubic-bezier(.22,1,.36,1);}
.vial::after{content:"";position:absolute;left:0;right:0;top:0;height:5px;
  background:rgba(242,237,230,.09);border-bottom:1px solid var(--line);}

.stat{flex:1;min-width:0;}
.stat b{display:block;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  font-size:20px;font-weight:600;line-height:1.25;}

.sheet{position:fixed;inset:0;background:rgba(6,5,7,.74);backdrop-filter:blur(7px);
  z-index:50;display:flex;align-items:flex-end;animation:fade .2s ease;}
.sheet>div{width:100%;border-radius:6px 6px 0 0;padding:18px 16px;max-height:92vh;overflow-y:auto;
  background:linear-gradient(178deg,#1D1720,#0E0B11);border-top:1px solid rgba(255,90,60,.32);
  padding-bottom:calc(18px + env(safe-area-inset-bottom));
  animation:rise .3s cubic-bezier(.22,1,.36,1);}
@keyframes fade{from{opacity:0}} @keyframes rise{from{transform:translateY(14px);opacity:.4}}

.readout{border:1px solid rgba(255,90,60,.42);border-radius:3px;padding:14px;
  background:radial-gradient(120% 160% at 12% 0%,rgba(255,90,60,.2),rgba(140,27,42,.07) 62%,transparent);}
.readout b{display:block;font-family:"IBM Plex Mono",monospace;font-size:27px;font-weight:600;line-height:1.2;}
.attn{border:1px solid rgba(217,169,74,.45);border-radius:3px;padding:13px;font-size:13px;
  background:linear-gradient(140deg,rgba(217,169,74,.14),rgba(217,169,74,.03));}
.bad{border:1px solid rgba(140,27,42,.6);border-radius:3px;padding:13px;font-size:13px;
  background:linear-gradient(140deg,rgba(140,27,42,.28),rgba(140,27,42,.06));}
.good{border:1px solid rgba(255,90,60,.32);border-radius:3px;padding:13px;font-size:13px;
  background:linear-gradient(140deg,rgba(255,90,60,.1),rgba(255,90,60,.02));}
.note{border-left:2px solid rgba(255,90,60,.45);padding-left:11px;}
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chips button{font-family:"IBM Plex Mono",monospace;font-size:12px;padding:7px 9px;}
h1,h2{margin:0;}

.sug{border:1px solid rgba(255,90,60,.28);border-radius:3px;overflow:hidden;
  background:rgba(11,10,12,.6);max-height:212px;overflow-y:auto;}
.sug button{display:block;width:100%;text-align:left;border:none;border-radius:0;
  border-bottom:1px solid var(--line-2);background:none;padding:10px 12px;}
.sug button:last-child{border-bottom:none;}
.sug .n{font-size:14px;} .sug .d{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--hai);}

.meter{height:5px;border-radius:3px;background:rgba(242,237,230,.09);overflow:hidden;margin-top:5px;}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--shu),var(--shu-2));}
.meter i.over{background:linear-gradient(90deg,#D9434F,var(--beni));}
.meter i.near{background:linear-gradient(90deg,var(--kin),#B8862F);}

/* lab range bar: low | in | high with a marker */
.rng{position:relative;height:6px;border-radius:3px;margin-top:6px;
  background:linear-gradient(90deg,rgba(140,27,42,.5) 0 18%,rgba(255,90,60,.28) 18% 82%,rgba(140,27,42,.5) 82% 100%);}
.rng u{position:absolute;top:-3px;width:2px;height:12px;background:var(--washi);
  border-radius:1px;box-shadow:0 0 6px rgba(0,0,0,.9);text-decoration:none;}
.rng u.out{background:var(--alert);}
.lab{border-bottom:1px solid var(--line-2);padding:11px 0;}
.lab:last-child{border-bottom:none;}
.dlt{font-family:"IBM Plex Mono",monospace;font-size:10px;padding:1px 5px;border-radius:2px;
  background:rgba(242,237,230,.07);color:var(--hai);}

.stchip{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  padding:3px 8px;border-radius:2px;border:1px solid currentColor;}
.tl{border-left:1px solid rgba(255,90,60,.35);margin-left:5px;padding-left:14px;}
.tl>div{position:relative;padding-bottom:12px;}
.tl>div::before{content:"";position:absolute;left:-18px;top:5px;width:7px;height:7px;border-radius:50%;
  background:var(--sumi);border:1px solid var(--shu);}
.tl>div:last-child{padding-bottom:0;}
.pill{display:inline-block;font-size:12px;padding:5px 9px;border:1px solid var(--line);border-radius:2px;background:rgba(242,237,230,.03);}
.watch{border-left:2px solid rgba(217,169,74,.45);padding-left:11px;font-size:13px;line-height:1.55;}
.watch.hot{border-left-color:var(--alert);}
.legend{display:flex;flex-wrap:wrap;gap:5px 14px;font-family:"IBM Plex Mono",monospace;
  font-size:10.5px;letter-spacing:.02em;color:var(--hai);padding:9px 12px;
  border:1px solid var(--line-2);border-radius:3px;background:rgba(242,237,230,.02);}
.legend b{font-family:"Shippori Mincho",serif;font-weight:600;font-size:12.5px;margin-right:3px;}
.lmove{border-left:2px solid var(--line);padding:9px 0 9px 12px;}
.lmove.up{border-left-color:rgba(255,90,60,.55);}
.lmove.down{border-left-color:rgba(217,169,74,.55);}
.lmove.mixed{border-left-color:rgba(150,141,149,.55);}
.lmove .hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.lmove .mk{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;letter-spacing:.04em;}
.lmove .ar{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;flex:none;}
.lmove p{margin:4px 0 0;font-size:12.5px;line-height:1.55;color:var(--hai);}
.lmove .yours{margin-top:6px;display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:11px;
  padding:2px 7px;border-radius:2px;background:rgba(242,237,230,.06);}
.legal{border-left:2px solid var(--beni);padding-left:11px;font-size:13px;line-height:1.6;}
.refact{display:flex;gap:8px;margin:2px 0 16px;}
.refact button{flex:1;}
.reflist button{display:block;width:100%;text-align:left;border:none;border-radius:0;border-bottom:1px solid var(--line-2);background:none;padding:11px 4px;}
.reflist button:last-child{border-bottom:none;}
.name-btn{background:none;border:none;padding:0;color:inherit;font:inherit;text-align:left;
  border-bottom:1px dashed rgba(255,90,60,.4);border-radius:0;}
.slot{display:flex;align-items:center;gap:9px;margin:16px 0 9px;}
.slot .k{font-family:"Shippori Mincho",serif;font-size:15px;color:var(--shu);}
.slot .l{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--hai);}
.slot .r{flex:1;height:1px;background:linear-gradient(90deg,rgba(255,90,60,.35),rgba(255,90,60,0));}

.stagger>*{animation:in .42s cubic-bezier(.22,1,.36,1) backwards;}
.stagger>*:nth-child(1){animation-delay:.02s} .stagger>*:nth-child(2){animation-delay:.06s}
.stagger>*:nth-child(3){animation-delay:.1s} .stagger>*:nth-child(4){animation-delay:.14s}
.stagger>*:nth-child(n+5){animation-delay:.18s}
@keyframes in{from{opacity:0;transform:translateY(9px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important;}}
</style>

<script>
/* ============================================================
   STORAGE
   ============================================================ */
const KEY = "peptide-log-v1";
const REV = "r9";
const store = {
  async load(){
    try{
      if(window.storage?.get){ const r = await window.storage.get(KEY,false); return r?.value?JSON.parse(r.value):null; }
      const raw = localStorage.getItem(KEY); return raw?JSON.parse(raw):null;
    }catch(e){ return null; }
  },
  async save(d){
    const j = JSON.stringify(d);
    try{
      if(window.storage?.set){ await window.storage.set(KEY,j,false); return true; }
      localStorage.setItem(KEY,j); return true;
    }catch(e){ return false; }
  }
};

let S = { items:[], logs:[], batches:[], vials:[], labs:[], profile:{flags:[],sex:"m"}, meta:{lastExport:null}, body:[] };

  boron:{label:"Boron",unit:"mg",ul:20},

const UNITS = ["mcg","mg","g","iu","ml","units","caps","drops"];
/* Peptides are dosed by amount. "units" is a mark on a syringe, not an amount. */
const PEP_UNITS = ["mcg","mg","iu"];
const unitsFor = (kind,cur) => {
  const base = kind==="peptide"?PEP_UNITS:UNITS;
  return base.includes(cur)||!cur ? base : [...base,cur];
};
const SITES = ["Abdomen L","Abdomen R","Delt L","Delt R","Thigh L","Thigh R","Glute L","Glute R"];
const DOW = ["Su","Mo","Tu","We","Th","Fr","Sa"];
const TIMINGS = [["morning","朝","Morning"],["midday","昼","Midday"],
                 ["evening","夕","Evening"],["bedtime","夜","Bedtime"],["any","時","Anytime"]];
const DEFAULT_BUD = 28, DEFAULT_LEAD = 21;
/* House standard: 1 mL of bacteriostatic water per 10 mg of powder. */
const ML_PER_10MG = 1;
const stdWater = mg => Math.round((num(mg)/10)*ML_PER_10MG*100)/100;
/* A U-100 syringe: 100 units per mL. Units are a mark, not an amount —
   this converts a draw on a specific mix into the mass it delivers. */
function unitsToMass(mg,w,u){
  const mcg = (mg*1000/w)*(u/100);
  return mcg>=1000 ? {dose:Math.round(mcg)/1000,unit:"mg"} : {dose:Math.round(mcg*100)/100,unit:"mcg"};
}

const pad = n => String(n).padStart(2,"0");
const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD = s => { const [y,m,d]=String(s).split("-").map(Number); return new Date(y,m-1,d); };
const today = () => key(new Date());
const shift = (s,n) => { const d=parseD(s); d.setDate(d.getDate()+n); return key(d); };
const between = (a,b) => Math.round((parseD(b)-parseD(a))/86400000);
const pretty = s => parseD(s).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
const uid = () => Math.random().toString(36).slice(2,10);
const num = v => { const n=parseFloat(v); return isNaN(n)?0:n; };
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fx = (n,d=1) => Number(n).toFixed(d);
const trim = n => String(Math.round(n*100)/100);

/* Per-render log index: one pass over S.logs instead of a scan per tick. */
let LOGIX = null;
function logsFor(itemId,date){
  if(!LOGIX){
    LOGIX = new Map();
    for(const l of S.logs){
      const k = l.itemId+"|"+l.date;
      const arr = LOGIX.get(k);
      if(arr) arr.push(l); else LOGIX.set(k,[l]);
    }
  }
  return LOGIX.get(itemId+"|"+date)||[];
}

function showToast(msg,undoable,ms=6000){

const isPep = it => it.kind==="peptide";
const timingLabel = t => (TIMINGS.find(x=>x[0]===t)||TIMINGS[4])[2];

function cyclePhase(p,date){
  if(!p.cycleOn) return null;
  const on=p.cycleOn*7, off=(p.cycleOff||0)*7, len=on+off;
  if(len<=0) return null;
  const el = between(p.startDate,date);
  if(el<0) return null;
  const pos = ((el%len)+len)%len;
  return pos<on?{on:true,week:Math.floor(pos/7)+1,total:p.cycleOn,daysLeft:on-pos}
               :{on:false,week:Math.floor((pos-on)/7)+1,total:p.cycleOff,daysLeft:len-pos};
}
function isDue(p,date){
  if(!p.active) return false;
  if(between(p.startDate,date)<0) return false;
  const ph = cyclePhase(p,date);
  if(ph && !ph.on) return false;
  if(p.freq==="daily") return true;
  if(p.freq==="weekdays") return (p.days||[]).includes(parseD(date).getDay());
  if(p.freq==="interval") return between(p.startDate,date)%Math.max(1,p.interval||2)===0;
  return true;
}
function dosesPerWeek(p){
  const base = p.freq==="daily"?7:p.freq==="weekdays"?(p.days||[]).length:7/Math.max(1,p.interval||2);
  const duty = p.cycleOn?p.cycleOn/(p.cycleOn+(p.cycleOff||0)):1;
  return base*duty*(p.perDay||1);
}
function schedText(p){
  return p.freq==="daily"?"daily":p.freq==="interval"?`every ${p.interval||2}d`
    :[...(p.days||[])].sort((a,b)=>a-b).map(d=>DOW[d]).join(" ")||"no days set";
}
const isMass = u => u==="mcg"||u==="mg"||u==="g";
function toMcg(v,u){ return u==="g"?v*1e6:u==="mg"?v*1000:u==="mcg"?v:null; }
function toCanon(dose,unit,nut){
  if(!nut) return null;
  if(unit==="iu") return nut.iu?dose*nut.iu:null;
  const mcg = toMcg(dose,unit);
  if(mcg==null) return unit===nut.unit?dose:null;
  if(nut.unit==="mcg") return mcg;
  if(nut.unit==="mg") return mcg/1000;
  if(nut.unit==="g") return mcg/1e6;
  return null;
}

function vialMath(v,it){
  const totalMcg = num(v.mg)*1000, water = num(v.water);
  const conc = water>0?totalMcg/water:0;
  const drawn = S.logs.filter(l=>l.vialId===v.id).reduce((a,l)=>a+(toMcg(num(l.dose),l.unit)||0),0);
  const remainMcg = Math.max(0,totalMcg-drawn);
  const doseMcg = it?toMcg(num(it.dose),it.unit):null;
  const perDoseMl = doseMcg&&conc?doseMcg/conc:0;
  /* Powder gets a use-by window from the day water went in. Oil arrives
     already in solution and keeps for years, so a window there is optional
     and blank means no clock at all. */
  const bud = v.premix ? (num(v.budDays)>0?num(v.budDays):null) : (v.budDays??DEFAULT_BUD);
  const age = between(v.reconDate,today());
  return {conc,remainMcg,remainMl:conc?remainMcg/conc:0,perDoseMl,units:perDoseMl*100,
    premix:!!v.premix,
    dosesLeft:doseMcg?Math.floor(remainMcg/doseMcg):null,
    dosesTotal:doseMcg?Math.floor(totalMcg/doseMcg):null,
    pct:totalMcg?remainMcg/totalMcg:0,age,bud,
    budLeft:bud!=null?bud-age:null,expired:bud!=null&&age>bud};
}
function contMath(v){
  const used = S.logs.filter(l=>l.vialId===v.id).length;
  const total = num(v.servings)||0;
  return {dosesLeft:Math.max(0,total-used),dosesTotal:total,pct:total?Math.max(0,total-used)/total:0,used};
}
function supply(it){
  const mine = S.batches.filter(b=>b.itemId===it.id);
  const sealed = mine.reduce((a,b)=>a+(b.sealed||0),0);
  const open = S.vials.filter(v=>v.itemId===it.id&&!v.finished);
  const dpw = dosesPerWeek(it), lead = it.leadDays??DEFAULT_LEAD;
  let dosesLeft = null;
  if(isPep(it)){
    const doseMcg = toMcg(num(it.dose),it.unit);
    if(!doseMcg||!isMass(it.unit)) return {sealed,open:open.length,unmeasured:true};
    const sealedMcg = mine.reduce((a,b)=>a+(b.sealed||0)*num(b.mg)*1000,0);
    const openMcg = open.reduce((a,v)=>a+vialMath(v,it).remainMcg,0);
    dosesLeft = Math.floor((sealedMcg+openMcg)/doseMcg);
  }else{
    if(!mine.length&&!open.length) return {sealed,open:open.length,unmeasured:true};
    const sealedServ = mine.reduce((a,b)=>a+(b.sealed||0)*(num(b.servings)||0),0);
    const openServ = open.reduce((a,v)=>a+contMath(v).dosesLeft,0);
    dosesLeft = Math.floor(sealedServ+openServ);
  }
  const daysLeft = dpw>0?Math.floor(dosesLeft/dpw*7):null;
  const costed = mine.filter(b=>num(b.cost)>0);
  const avgCost = costed.length?costed.reduce((a,b)=>a+num(b.cost),0)/costed.length:0;
  const perUnit = isPep(it)
    ?(mine[0]?Math.floor(num(mine[0].mg)*1000/(toMcg(num(it.dose),it.unit)||1)):0)
    :(mine[0]?num(mine[0].servings):0);
  return {sealed,open:open.length,dosesLeft,daysLeft,dpw,lead,
    orderBy:daysLeft!=null?shift(today(),Math.max(0,daysLeft-lead)):null,
    low:daysLeft!=null&&daysLeft<=lead,
    costPerDose:avgCost&&perUnit?avgCost/perUnit:0,
    value:mine.reduce((a,b)=>a+(b.sealed||0)*num(b.cost),0)};
}
const lowAlerts = () => S.items.filter(i=>i.active).map(i=>({it:i,s:supply(i)})).filter(x=>x.s.low);

/* ============================================================
   LAB PANEL PARSER
   ============================================================ */
function scanPanel(text){
  const found = {};
  const lines = String(text).split(/\r?\n/);
  const rxEsc = s => s.replace(/[.*+?^${}()[\]\\]/g,"\\$&");
  /* First plausible number after the marker name, skipping reference-range
     endpoints ("24-336") and date fragments ("01/15/2026"). */
  const pickNum = seg => {
    seg = seg.slice(0,64);
    const rx = /\d+\.?\d*/g; let m;
    while((m = rx.exec(seg))){
      const pre = seg.slice(0,m.index), post = seg.slice(m.index+m[0].length);
      if(/\d\s*[-–]\s*$/.test(pre)) continue;      /* high end of a range */
      if(/^\s*[-–]\s*\d/.test(post)) continue;     /* low end of a range */
      if(/\/\s*$/.test(pre) || /^\s*\//.test(post)) continue;  /* part of a date */
      return parseFloat(m[0]);
    }
    return null;
  };
  for(const [k,mk] of Object.entries(MARKERS)){
    const pats = (mk.alias||mk.label).split("|");
    for(const p of pats){
      const body = /[\\^$]/.test(p) ? p : rxEsc(p);
      let re;
      try{ re = new RegExp(body,"i"); }catch(_){ continue; }
      let hit = null;
      for(const ln of lines){
        /* skip lines that name a different, easily-confused analyte */
        if(k==="serumIron" && /binding|tibc|uibc|saturation/i.test(ln)) continue;
        if(k==="calciumS" && /score|calcium channel/i.test(ln)) continue;
        if(k==="insulin" && /growth factor|igf/i.test(ln)) continue;
        if(k==="testT" && /free|bioavailable|% ?free/i.test(ln)) continue;
        const m = ln.match(re);
        if(!m) continue;
        const v = pickNum(ln.slice(m.index+m[0].length));
        if(v!=null){ hit = v; break; }
      }
      if(hit!=null && !isNaN(hit)){ found[k]=hit; break; }
    }
  }
  return found;
}

/* ============================================================
   THE CHECKER
   ============================================================ */
function nutrientTotals(){
  const map = {};
  for(const it of S.items){
    if(!it.active||!it.nutrient) continue;
    const nut = NUTRIENTS[it.nutrient]; if(!nut) continue;
    const amt = toCanon(num(it.dose),it.unit,nut);
    if(amt==null) continue;
    if(!map[it.nutrient]) map[it.nutrient]={key:it.nutrient,nut,total:0,items:[]};
    map[it.nutrient].total += amt*(it.perDay||1);
    map[it.nutrient].items.push({name:it.name,amt:amt*(it.perDay||1)});
  }
  return Object.values(map).sort((a,b)=>a.nut.label.localeCompare(b.nut.label));
}

function analyze(){
  const out = [];
  const active = S.items.filter(i=>i.active);
  const totals = nutrientTotals();
  const present = new Set(totals.map(t=>t.key));
  const flags = S.profile?.flags||[];
  const has = n => active.filter(i=>i.nutrient===n);
  const add = (sev,title,body,tags,lab,fixes) => out.push({sev,title,body,tags:tags||[],lab:!!lab,fixes:fixes||[]});

  /* 1 — upper limits */
  for(const t of totals){
    if(!t.nut.ul) continue;
    const pct = t.total/t.nut.ul, u = t.nut.unit;
    if(pct>1){
      add("concern",`${t.nut.label} is over the upper limit`,
        `Your stack totals about ${trim(t.total)} ${u} a day against an established upper limit of ${t.nut.ul} ${u}${t.nut.note?` (${t.nut.note})`:""}. `+
        `Sustained excess is associated with ${t.nut.risk||"adverse effects"}. `+
        (t.items.length>1?`That's the combined total across ${t.items.map(i=>i.name).join(", ")} — no single item is the whole story.`:`This comes from ${t.items[0].name} alone.`),
        t.items.map(i=>i.name));
    }else if(pct>=0.8){
      add("note",`${t.nut.label} is close to the ceiling`,
        `About ${trim(t.total)} ${u} a day, ${Math.round(pct*100)}% of the ${t.nut.ul} ${u} limit. Food and fortified products count toward the same total and aren't tracked here.`,
        t.items.map(i=>i.name));
    }
  }

  /* 2 — duplicate nutrients */
  for(const t of totals){
    if(t.items.length<2) continue;
    if(t.nut.ul && t.total/t.nut.ul>=0.8) continue;
    add("note",`${t.nut.label} appears in ${t.items.length} items`,
      `${t.items.map(i=>`${i.name} (${trim(i.amt)} ${t.nut.unit})`).join(" + ")} = ${trim(t.total)} ${t.nut.unit} a day. Stacking isn't automatically a problem, but people often don't realize a total has doubled${t.nut.ul?` — the limit here is ${t.nut.ul} ${t.nut.unit}`:""}.`,
      t.items.map(i=>i.name));
  }

  /* 3 — nutrient interactions */
  for(const r of INTERACTIONS){
    if(!present.has(r.a)||!present.has(r.b)) continue;
    const na = has(r.a), nb = has(r.b);
    /* the one pairing whose polarity depends on who you are: C + iron */
    if(r.a==="vitaminC"&&r.b==="iron"){
      const fer = LV("ferritin"), hct = LV("hct");
      const why = [];
      if(flags.includes("trt")) why.push("testosterone already driving iron uptake");
      if(flags.includes("hctHigh")) why.push("hematocrit flagged high");
      if(fer!=null&&fer>300) why.push(`ferritin at ${fer} ng/mL`);
      if(hct!=null&&hct>=52) why.push(`hematocrit at ${hct}%`);
      if(why.length){
        add("note","Vitamin C + Iron — absorption help you may not want",
          `Vitamin C substantially increases iron absorption, which is normally the point of pairing them. With ${why.join(", ")}, though, it's boosting uptake of something you already have plenty of — and there's no route to excrete an excess. Separating them, or dropping the iron question to your doctor, is the move here.`,
          [...na.map(x=>x.name),...nb.map(x=>x.name)],
          (fer!=null&&fer>300)||(hct!=null&&hct>=52));
        continue;
      }
    }
    const same = na.some(x=>nb.some(y=>(x.timing||"any")===(y.timing||"any")));
    add(r.sev,`${NUTRIENTS[r.a].label} + ${NUTRIENTS[r.b].label}`,
      r.t+(r.sev==="note"&&same?` You currently have both in the same ${timingLabel(na[0].timing).toLowerCase()} slot.`:""),
      [...na.map(x=>x.name),...nb.map(x=>x.name)]);
  }

  /* 4 — medication and condition rules */
  for(const r of MED_RULES){
    if(!flags.includes(r.flag)||!present.has(r.n)) continue;
    add(r.sev,`${NUTRIENTS[r.n].label} with ${flagLC(r.flag)}`,
      r.t,has(r.n).map(i=>i.name));
  }

  /* 5 — peptide class duplication */
  const byClass = {};
  for(const it of active){ if(it.pclass) (byClass[it.pclass] ||= []).push(it.name); }
  for(const [cls,names] of Object.entries(byClass)){
    if(cls==="glp1"&&names.length>1)
      add("concern","Two GLP-1 agonists at once",
        `${names.join(" and ")} act on the same receptor. Running them together multiplies side effects — nausea, vomiting, dehydration — without a corresponding benefit. Standard practice is one at a time.`,names);
    else if(cls==="ghs"&&names.length>2)
      add("note","Several growth hormone secretagogues",
        `${names.join(", ")} all push the same axis. Pairing a releasing hormone with a secretagogue is a common protocol, but three or more is redundant and raises the odds of water retention and blood sugar effects.`,names);
    else if(cls==="melanocortin"&&names.length>1)
      add("note","Two melanocortin agonists",
        `${names.join(" and ")} overlap heavily. Combined, nausea and flushing are more likely.`,names);
  }

  /* 5b — androgens and the GH axis */
  const androgens = [...(byClass.aas||[]),...(byClass.aasOral||[])];
  if(androgens.length>1)
    add("note",`${androgens.length} androgens running together`,
      `${androgens.join(", ")} all act on the androgen receptor. The effects that show up in bloodwork add together rather than sitting side by side: red cell mass, HDL suppression, and for anything oral, liver enzymes. One panel reads the combined result, so a single compound can't be credited or blamed for a number without changing one thing at a time.`,
      androgens);
  if((byClass.gh||[]).length&&(byClass.ghs||[]).length)
    add("note","Growth hormone alongside a secretagogue",
      `${(byClass.gh||[]).join(", ")} supplies growth hormone directly. ${(byClass.ghs||[]).join(", ")} ${(byClass.ghs||[]).length>1?"ask":"asks"} the pituitary to release its own. Exogenous GH suppresses that release through feedback, so the secretagogue has less to work with while it's running. IGF-1 is the marker that reflects the total.`,
      [...(byClass.gh||[]),...(byClass.ghs||[])]);

  /* 6 — peptide with medication */
  for(const r of PEP_MED_RULES){
    if(!flags.includes(r.flag)) continue;
    const hits = active.filter(i=>i.pclass===r.pclass);
    if(!hits.length) continue;
    add(r.sev,r.title||`${PCLASS[r.pclass].label} with ${flagLC(r.flag)}`,
      r.t,hits.map(i=>i.name));
  }

  /* 7 — GLP-1 and oral absorption */
  const glp = active.filter(i=>i.pclass==="glp1");
  const orals = active.filter(i=>!isPep(i));
  if(glp.length&&orals.length>=3)
    add("note","A GLP-1 changes how orals land",
      `${glp[0].name} slows stomach emptying considerably, which shifts the timing of everything you swallow. It's a common reason capsules feel like they're sitting there. Taking supplements with your largest meal usually helps.`,[glp[0].name]);

  /* 8 — fat-soluble without food */
  const needFood = ["vitaminA","vitaminD","vitaminE","vitaminK","omega3","coq10","curcumin"];
  const dry = active.filter(i=>i.nutrient&&needFood.includes(i.nutrient)&&!i.withFood);
  if(dry.length)
    add("note","Fat-soluble items without food",
      `${dry.map(i=>i.name).join(", ")} ${dry.length>1?"need":"needs"} dietary fat to absorb properly. On an empty stomach you may be getting a fraction of what's on the label. Marking them "with food" is the whole fix.`,
      dry.map(i=>i.name),false,[{label:"Mark all with food",act:"fixfood:"+dry.map(i=>i.id).join(",")}]);

  /* 9 — mineral pileup */
  const minerals = ["calcium","iron","zinc","magnesium","copper"];
  const slots = {};
  for(const it of active){ if(minerals.includes(it.nutrient)) (slots[it.timing||"any"] ||= []).push(it); }
  for(const [slot,grp] of Object.entries(slots)){
    if(grp.length<3) continue;
    const mover = grp.find(x=>x.nutrient==="iron")||grp[grp.length-1];
    const target = bestSlotFor(mover,minerals);
    add("note",`${grp.length} competing minerals in one slot`,
      `${grp.map(x=>x.name).join(", ")} are all set for ${timingLabel(slot).toLowerCase()}. These compete for the same transporters, so taking them together means absorbing less of each. Spreading them across the day costs nothing.`,
      grp.map(x=>x.name),false,
      [{label:`Move ${mover.name} to ${timingLabel(target).toLowerCase()}`,act:`fixmove:${mover.id}:${target}`}]);
  }

  /* 10 — titration windows */
  for(const it of active){
    if(!it.titrate) continue;
    const wks = Math.floor(Math.max(0,between(it.startDate,today()))/7);
    if(wks<4) add("note",`${it.name} is in its starting window`,
      `${it.titrate} You're ${wks===0?"in week one":`about ${wks} week${wks>1?"s":""} in`}. Dose increases belong to whoever prescribes it.`,[it.name]);
  }

  /* 10b — logged above the titration plan */
  for(const it of active){
    if(!it.plan) continue;
    const recent=S.logs.filter(l=>l.itemId===it.id&&between(l.date,today())>=0&&between(l.date,today())<=7);
    const over=recent.filter(l=>{const pd=planDose(it,l.date);return pd!=null&&num(l.dose)>pd*1.05;});
    if(over.length){
      const ex=over[over.length-1];
      add("concern",`${it.name} logged above its plan`,
        `${over.length} dose${over.length>1?"s":""} in the last week came in above the titration step for that day — the plan called for ${planDose(it,ex.date)} ${it.unit} and ${ex.dose} ${it.unit} was logged. Stepping up early is the most common way these protocols go sideways, and dose increases belong to whoever prescribes it.`,
        [it.name]);
    }
  }

  /* body metrics — the one reading that matters most for this crowd */
  const bLast=(S.body||[]).slice().sort((x,y)=>x.date<y.date?1:-1).find(e=>e.sys!=null||e.dia!=null);
  if(bLast&&((bLast.sys??0)>=140||(bLast.dia??0)>=90)){
    const stim=has("caffeine");
    add("note","Your logged blood pressure is elevated",
      `${bLast.sys??"—"}/${bLast.dia??"—"} on ${bLast.date} is above the 140/90 line. One reading isn't a diagnosis — recheck seated and rested${flags.includes("trt")?", and testosterone therapy belongs in that conversation":""}${stim.length?`. ${stim.map(i=>i.name).join(", ")} raises it acutely, so note when you measured relative to your last dose`:""}.`,
      stim.map(i=>i.name));
  }

  /* 11 — research compounds */
  const research = active.filter(i=>i.research);
  if(research.length)
    add("note",`${research.length} item${research.length>1?"s":""} without established human dosing`,
      `${research.map(i=>i.name).join(", ")} ${research.length>1?"are":"is"} sold for research use, with no approved human dose, no regulated purity standard, and thin safety data. The starting figures this app filled in are commonly circulated numbers, not clinical recommendations.`,
      research.map(i=>i.name));

  /* 11b — androgens and growth hormone without current bloodwork */
  const hormonal = active.filter(i=>["aas","aasOral","gh"].includes(i.pclass));
  if(hormonal.length){
    const Pn = latestPanel();
    const ageP = Pn?between(Pn.date,today()):null;
    if(!Pn||ageP>180)
      add("note","Nothing current to check the hormonal side against",
        `${hormonal.map(i=>i.name).join(", ")} ${hormonal.length>1?"move":"moves"} numbers this app can read once they exist. ${Pn?`Your most recent panel is from ${Pn.date}, about ${Math.floor(ageP/30)} months back.`:"There's no panel saved yet."} The markers that carry the most information here are hematocrit and hemoglobin, ferritin, HDL and ApoB, ALT and AST, estradiol, total and free testosterone, LH and FSH, and IGF-1 if growth hormone is in the picture. Paste a panel in and every reference page starts showing your own numbers next to what the compound does to them.`,
        hormonal.map(i=>i.name));
  }

  /* 12 — expired open vials */
  const stale = S.vials.filter(v=>!v.finished&&v.kind!=="container")
    .map(v=>({v,it:S.items.find(i=>i.id===v.itemId)}))
    .filter(x=>x.it&&vialMath(x.v,x.it).expired);
  if(stale.length)
    add("concern","Open vial past its window",
      stale.map(x=>{const m=vialMath(x.v,x.it);
        return `${x.it.name} was reconstituted ${m.age} days ago, ${m.age-m.bud} past the ${m.bud}-day window you set.`;}).join(" ")+
      ` Peptides in solution degrade, and a compromised vial is a sterility question as much as a potency one.`,
      stale.map(x=>x.it.name));

  /* ---------- LAB-AWARE RULES ---------- */
  const P = latestPanel();
  if(P){
    const age = between(P.date,today());
    const V = k => (P.m&&P.m[k]!=null)?Number(P.m[k]):null;
    const st = k => mStatus(k,V(k));
    const L = (sev,t,b,tags,fixes) => add(sev,t,b,tags,true,fixes);

    if(age>365) add("note","Your bloodwork is over a year old",
      `The panel from ${P.date} is ${Math.floor(age/30)} months old. Everything below is being checked against numbers that may no longer describe you.`,[],true);

    /* iron and red cells — the big one for this crowd */
    const hct = V("hct"), fer = V("ferritin"), ironSup = has("iron");
    if(hct!=null){
      if(hct>=54) L("concern","Hematocrit is at the intervention threshold",
        `${hct}% is at or above 54%, which every major guideline treats as the point requiring action — dose reduction, formulation change, or therapeutic phlebotomy. This is a conversation to have now, not at your next scheduled visit.`+
        (ironSup.length?` You're also taking ${ironSup.map(i=>i.name).join(", ")}, which works directly against this.`:""),
        ironSup.map(i=>i.name));
      else if(hct>=52) L("note","Hematocrit is in the watch zone",
        `${hct}% is below the 54% action threshold but above where most clinicians stop ignoring it. Common levers are dose and injection frequency, sleep apnea, hydration, and smoking.`+
        (ironSup.length?` Supplemental iron is worth reconsidering while it's here.`:""),
        ironSup.map(i=>i.name));
    }
    if(fer!=null&&ironSup.length){
      if(fer>300) L("concern","Ferritin is high and you're supplementing iron",
        `Ferritin at ${fer} ng/mL with ${ironSup.map(i=>i.name).join(", ")} in your stack is the clearest "more than you need" signal in this panel. Iron accumulates, and there's no route to excrete an excess.`,
        ironSup.map(i=>i.name));
      else if(fer>=100) L("note","Iron supplementation with adequate ferritin",
        `Ferritin at ${fer} ng/mL is comfortably sufficient. Continuing ${ironSup.map(i=>i.name).join(", ")} isn't buying much, and iron is one of the few supplements where more is actively unhelpful.`,
        ironSup.map(i=>i.name));
    }
    if(fer!=null&&fer<30&&!ironSup.length)
      L("note","Ferritin is low and nothing in your stack addresses it",
        `Ferritin at ${fer} ng/mL is low enough to affect training capacity and recovery. Worth investigating the cause rather than just supplementing — but this is a real finding.`,[]);
    if(fer!=null&&fer<30&&ironSup.length){
      const blockers = [...has("calcium"),...has("zinc"),...has("fiber")]
        .filter(x=>ironSup.some(y=>(y.timing||"any")===(x.timing||"any")));
      if(blockers.length){
        const tgt=bestSlotFor(ironSup[0],["calcium","zinc","fiber"]);
        L("note","Low ferritin, and your iron has company",
        `Ferritin is ${fer} ng/mL. ${blockers.map(b=>b.name).join(", ")} ${blockers.length>1?"are":"is"} scheduled in the same slot as your iron, which measurably reduces how much you absorb. Moving the iron to its own slot with vitamin C is free.`,
        [...ironSup.map(i=>i.name),...blockers.map(b=>b.name)],
        [{label:`Move ${ironSup[0].name} to ${timingLabel(tgt).toLowerCase()}`,act:`fixmove:${ironSup[0].id}:${tgt}`}]);
      }
    }

    /* vitamin D — the classic "more than you need" */
    const vd = V("vitD"), dSup = has("vitaminD");
    if(vd!=null&&dSup.length){
      const total = totals.find(t=>t.key==="vitaminD");
      const iuEq = total?Math.round(total.total/0.025):0;
      if(vd>100) L("concern","Vitamin D level is above the reference range",
        `${vd} ng/mL sits above the usual 30–80 reference band. Caution is generally advised above 100, with actual toxicity typically associated with sustained levels above 150. With ${iuEq.toLocaleString()} IU a day still going in, this needs a dose conversation and a recheck of your serum calcium.`,
        dSup.map(i=>i.name));
      else if(vd>=60) L("note","Vitamin D is well past sufficient",
        `${vd} ng/mL is above the 40–60 band most clinicians aim for, and you're taking ${iuEq.toLocaleString()} IU a day. This is a spot where the dose has likely done its job and could come down.`,
        dSup.map(i=>i.name));
      else if(vd<30) L("note","Vitamin D is still below sufficient",
        `${vd} ng/mL is under the 30 ng/mL threshold despite ${iuEq.toLocaleString()} IU a day. Absorption is the usual culprit — D3 needs dietary fat, and taking it with your largest meal often moves the number more than raising the dose.`,
        dSup.map(i=>i.name));
    }
    if(vd!=null&&vd<20&&!dSup.length)
      L("note","Vitamin D is deficient and unsupplemented",
        `${vd} ng/mL is in the deficient range and nothing in your stack addresses it. This one is cheap to fix and affects mood, immune function, and bone health.`,[]);

    /* creatinine and creatine — a genuine lifter trap */
    const cr = V("creat"), egfr = V("egfr"), creatineSup = has("creatine");
    if(cr!=null&&mStatus("creat",cr)==="high"&&creatineSup.length)
      L("note","High creatinine while supplementing creatine",
        `Creatinine at ${cr} mg/dL reads high, but creatine supplementation raises serum creatinine on its own without any kidney injury — it's a measurement artifact, not damage. Cystatin C is the test that sees past it. Worth mentioning before anyone concludes your kidneys are struggling. Heavy training also inflates it.`,
        creatineSup.map(i=>i.name));
    if(egfr!=null&&egfr<60){
      const risky = [...has("magnesium"),...has("potassium"),...has("creatine")];
      L("concern","eGFR is below 60",
        `An eGFR of ${egfr} indicates meaningfully reduced kidney function.`+
        (risky.length?` ${risky.map(i=>i.name).join(", ")} ${risky.length>1?"all clear":"clears"} through the kidneys or affect${risky.length>1?"":"s"} that clearance, and ${risky.length>1?"each needs":"it needs"} medical clearance at this level.`:` Anything that clears renally deserves review.`)+
        ` If you supplement creatine, note that it inflates creatinine and therefore deflates eGFR — ask about cystatin C before acting on this number.`,
        risky.map(i=>i.name));
    }

    /* liver */
    const alt = V("alt"), ast = V("ast");
    const hepatic = [...has("niacin"),...has("ashwagandha"),...has("curcumin"),...has("nac")];
    if((alt!=null&&mStatus("alt",alt)==="high")||(ast!=null&&mStatus("ast",ast)==="high")){
      L("note","Liver enzymes are elevated",
        `${alt!=null&&mStatus("alt",alt)==="high"?`ALT ${alt}`:""}${alt!=null&&ast!=null&&mStatus("alt",alt)==="high"&&mStatus("ast",ast)==="high"?", ":""}${ast!=null&&mStatus("ast",ast)==="high"?`AST ${ast}`:""} above range. Worth knowing: hard resistance training raises AST and ALT for days afterward, so a panel drawn after a heavy session can look worse than it is. `+
        (hepatic.length?`That said, ${hepatic.map(i=>i.name).join(", ")} ${hepatic.length>1?"have":"has"} documented associations with enzyme elevation and would be reasonable to pause before a retest.`:`If it persists on a rested retest, it needs a workup.`),
        hepatic.map(i=>i.name));
    }

    /* electrolytes */
    const k = V("potassium"), kSup = has("potassium");
    if(k!=null&&mStatus("potassium",k)==="high"&&kSup.length)
      L("concern","Potassium is high and you're supplementing it",
        `Serum potassium at ${k} mEq/L is above range with ${kSup.map(i=>i.name).join(", ")} in your stack. High potassium affects heart rhythm and is not something to manage on your own.`,
        kSup.map(i=>i.name));
    const ca = V("calciumS"), caSup = [...has("calcium"),...has("vitaminD")];
    if(ca!=null&&mStatus("calciumS",ca)==="high"&&caSup.length)
      L("concern","Blood calcium is high",
        `Calcium at ${ca} mg/dL is above range while you're taking ${caSup.map(i=>i.name).join(", ")}. High blood calcium is the main mechanism by which excess vitamin D and calcium cause harm, and it warrants prompt attention.`,
        caSup.map(i=>i.name));

    /* zinc and copper — gives the ratio rule real teeth */
    const cu = V("copperS"), zSup = has("zinc"), cuSup = has("copper");
    if(cu!=null&&mStatus("copperS",cu)==="low"&&zSup.length)
      L("concern","Copper is low and you're taking zinc",
        `Serum copper at ${cu} mcg/dL is below range with ${zSup.map(i=>i.name).join(", ")} in the stack. This is the documented consequence of sustained zinc supplementation${cuSup.length?", and your current copper dose isn't keeping up":" without matching copper"}. Zinc-induced copper deficiency causes anemia and neurological symptoms.`,
        [...zSup.map(i=>i.name),...cuSup.map(i=>i.name)]);
    const zn = V("zincS");
    if(zn!=null&&mStatus("zincS",zn)==="high"&&zSup.length)
      L("note","Serum zinc is above range",
        `${zn} mcg/dL with ${zSup.map(i=>i.name).join(", ")} on board. Worth reducing, and worth checking copper if it wasn't on this panel.`,
        zSup.map(i=>i.name));

    /* B12 and folate */
    const b12v = V("b12"), b12Sup = has("b12");
    if(b12v!=null&&b12v>900&&b12Sup.length)
      L("note","B12 is above range",
        `${b12v} pg/mL with ${b12Sup.map(i=>i.name).join(", ")} in your stack. There's no established upper limit for B12 and high levels from supplements are generally considered benign, but it does mean the dose is well past what you're using.`,
        b12Sup.map(i=>i.name));

    /* thyroid */
    const tsh = V("tsh"), iodSup = has("iodine"), ashSup = has("ashwagandha");
    if(tsh!=null&&mStatus("tsh",tsh)!=="in"&&(iodSup.length||ashSup.length))
      L("note",`TSH is ${mStatus("tsh",tsh)} and your stack touches thyroid function`,
        `TSH at ${tsh} mIU/L is outside the 0.4–4.0 range. ${[...iodSup,...ashSup].map(i=>i.name).join(", ")} can each move thyroid function — iodine in either direction, ashwagandha generally upward. Mention both when this gets worked up.`,
        [...iodSup.map(i=>i.name),...ashSup.map(i=>i.name)]);

    /* metabolic */
    const a1cv = V("a1c"), gluc = V("glucose");
    const glucLower = [...has("berberine"),...has("inositol")];
    if(a1cv!=null&&a1cv>=5.7&&!glucLower.length&&!glp.length)
      L("note","HbA1c is above the normal range",
        `${a1cv}% falls in the range usually described as prediabetic. Nothing in your stack targets glucose. This is more a training-and-diet lever than a supplement one, but it's the kind of number worth watching deliberately.`,[]);
    if(a1cv!=null&&a1cv<5.0&&glucLower.length)
      L("note","Low HbA1c while taking glucose-lowering supplements",
        `${a1cv}% is on the low side and ${glucLower.map(i=>i.name).join(", ")} push in the same direction. If you get shaky or lightheaded between meals, this combination is the first thing to look at.`,
        glucLower.map(i=>i.name));

    /* lipids */
    const tg = V("trig"), o3 = has("omega3");
    if(tg!=null&&tg>150){
      if(o3.length) L("good","Triglycerides high, omega-3 on board",
        `${tg} mg/dL is above the 150 threshold. ${o3.map(i=>i.name).join(", ")} is the one supplement with solid evidence for lowering triglycerides, and meaningful effects generally need 2–4 g of combined EPA and DHA — check whether your dose is actually in that range or well under it.`,
        o3.map(i=>i.name));
      else L("note","Triglycerides are elevated",
        `${tg} mg/dL is above the 150 threshold. Omega-3 at 2–4 g of combined EPA and DHA is the best-supported supplement lever here, alongside alcohol and refined carbohydrate intake.`,[]);
    }
    const hdlV = V("hdl");
    if(hdlV!=null&&mStatus("hdl",hdlV)==="low"&&flags.includes("trt"))
      L("note","HDL is low, and testosterone lowers it",
        `HDL at ${hdlV} mg/dL is below range. Suppressed HDL is a well-documented effect of testosterone therapy, more pronounced with oral and higher-dose protocols. Worth tracking alongside ApoB rather than in isolation.`,[]);

    /* inflammation */
    const crpV = V("crp");
    if(crpV!=null&&crpV>3){
      const anti = [...has("omega3"),...has("curcumin")];
      L("note","hs-CRP is elevated",
        `${crpV} mg/L is above the 3.0 threshold for higher cardiovascular risk. A hard training block or a recent illness both raise it transiently, so a rested retest is the first step. `+
        (anti.length?`${anti.map(i=>i.name).join(", ")} in your stack may help modestly.`:``),
        anti.map(i=>i.name));
    }
    const hcy = V("homocys"), bVits = [...has("b12"),...has("folate"),...has("b6")];
    if(hcy!=null&&hcy>10){
      if(bVits.length) L("good","Homocysteine elevated, B vitamins on board",
        `${hcy} umol/L is above the 10 optimal threshold. ${bVits.map(i=>i.name).join(", ")} are the right tools — homocysteine responds to B12, folate, and B6 specifically. Retest in three months to see whether it's moving.`,
        bVits.map(i=>i.name));
      else L("note","Homocysteine is elevated",
        `${hcy} umol/L is above the 10 optimal threshold and nothing in your stack addresses it. B12, folate, and B6 are the specific levers.`,[]);
    }
    const ckV = V("ck");
    if(ckV!=null&&mStatus("ck",ckV)==="high")
      L("note","Creatine kinase is high",
        `CK at ${ckV} U/L is above range. In people who lift, this is usually just muscle damage from recent training rather than anything pathological — CK routinely runs high for days after heavy eccentric work. It does mean any AST elevation on the same panel is likely muscular too.`,[]);

    /* ---------- the hormone panel ---------- */
    const hasC = c => active.filter(i=>i.pclass===c);
    const androgen = [...hasC("aas"),...hasC("aasOral")];
    const oral17 = hasC("aasOral"), ghItems = hasC("gh");
    const ai = hasC("ai"), serm = hasC("serm"), gonad = hasC("gonadotropin");
    const nm = a => a.map(i=>i.name).join(", ");

    /* gonadotropins: the pair that says whether your own axis is running */
    const lhV = V("lh"), fshV = V("fsh");
    if(lhV!=null&&fshV!=null&&lhV<1.0&&fshV<1.5){
      if(gonad.length)
        L("note","LH reads low, and hCG makes that reading unreliable",
          `LH ${lhV} IU/L and FSH ${fshV} IU/L. With ${nm(gonad)} running, the LH result can't be trusted either way, because the assay can't tell hCG from LH. FSH is the honest half of this pair, and at ${fshV} it says the pituitary signal is still switched off.`,
          nm(gonad).split(", "));
      else if(androgen.length)
        L("note","Your own axis is switched off",
          `LH ${lhV} IU/L and FSH ${fshV} IU/L are both at the floor, which is what ${nm(androgen)} does and is not a surprise. It is worth having on paper anyway: it confirms the shutdown rather than assuming it, and it's the number people want a baseline of before they ever try to come off.`,
          androgen.map(i=>i.name));
      else
        L("note","Both gonadotropins are low with nothing in your stack to explain it",
          `LH ${lhV} IU/L and FSH ${fshV} IU/L are both below range and nothing you're logging suppresses them. Low gonadotropins with low testosterone points at the pituitary rather than the testes, which is a different diagnosis and a different treatment. This one belongs with a doctor.`,[]);
    }

    /* estradiol against an aromatase inhibitor */
    const e2V = V("e2");
    if(e2V!=null&&ai.length){
      if(mStatus("e2",e2V)==="low")
        L("concern","Estradiol is under range with an aromatase inhibitor running",
          `Estradiol at ${e2V} pg/mL is below the reference band while ${nm(ai)} is in your stack. Aching joints, flat mood, poor sleep and absent libido are what this looks like from the inside, and they read as the same complaints people blame on high estrogen. Estrogen also maintains bone in men. This is a dose conversation with whoever prescribed it.`,
          ai.map(i=>i.name));
      else if(mStatus("e2",e2V)==="in")
        L("good","Estradiol is in range on an aromatase inhibitor",
          `${e2V} pg/mL with ${nm(ai)} running. Worth noting because the failure mode here is overshooting, and this is what not overshooting looks like.`,
          ai.map(i=>i.name));
    }
    if(e2V!=null&&!ai.length&&mStatus("e2",e2V)==="high"&&androgen.length)
      L("note","Estradiol is above range",
        `${e2V} pg/mL with ${nm(androgen)} on board. Aromatization tracks dose, so the dose is the first lever rather than the last. In men, confirm with a sensitive or LC-MS assay before acting: standard immunoassays are unreliable at male concentrations and a wrong number here gets treated in the wrong direction.`,
        androgen.map(i=>i.name));

    /* prolactin and the 19-nors */
    const prlV = V("prolactin");
    const nors = active.filter(i=>/nandrolone|trenbolone|deca|tren/i.test(i.name));
    if(prlV!=null&&mStatus("prolactin",prlV)==="high"){
      if(nors.length)
        L("note","Prolactin is high, and you're running a 19-nor",
          `Prolactin at ${prlV} ng/mL is above range with ${nm(nors)} in your stack. Progestogenic activity is the mechanism, and this is the marker that separates it from an estradiol problem, since the two produce the same complaints. Persistently high prolactin with no compound to explain it is worked up with an MRI, so the compound being on the chart matters.`,
          nors.map(i=>i.name));
      else
        L("note","Prolactin is above range",
          `${prlV} ng/mL is above the reference band. A stressful draw and recent nipple stimulation both raise it transiently, so a rested repeat comes first. If it holds, it gets worked up properly rather than guessed at.`,[]);
    }

    /* IGF-1 */
    const igfV = V("igf1");
    if(igfV!=null&&ghItems.length){
      if(mStatus("igf1",igfV)==="high")
        L("concern","IGF-1 is above the reference range",
          `IGF-1 at ${igfV} ng/mL is above range with ${nm(ghItems)} running. This is the marker growth hormone dosing is titrated against, and above range is where the growth effects stop being confined to the tissue you wanted. Note that reference ranges are age banded, so your lab's own band matters more here than the generic one.`,
          ghItems.map(i=>i.name));
      else
        L("good","IGF-1 is in range",
          `${igfV} ng/mL with ${nm(ghItems)} running. This is the number that reflects the dose, since growth hormone itself is pulsatile and a single draw of it says almost nothing.`,
          ghItems.map(i=>i.name));
    }
    if(igfV!=null&&!ghItems.length&&mStatus("igf1",igfV)==="high"&&hasC("ghs").length)
      L("note","IGF-1 is above range on secretagogues alone",
        `${igfV} ng/mL with ${nm(hasC("ghs"))} in the stack. Secretagogues work through your own pituitary, so the ceiling is meant to be your own feedback loop. Above range means that loop is being pushed past where it would sit on its own.`,
        hasC("ghs").map(i=>i.name));

    /* liver enzymes against orals specifically */
    const altV=V("alt"), astV=V("ast"), ggtV=V("ggt"), biliV=V("bili");
    if(oral17.length&&((altV!=null&&mStatus("alt",altV)==="high")||(astV!=null&&mStatus("ast",astV)==="high"))){
      const muscle = ggtV!=null&&mStatus("ggt",ggtV)==="in";
      L("concern","Liver enzymes are up on an oral steroid",
        `${altV!=null?`ALT ${altV}`:""}${altV!=null&&astV!=null?", ":""}${astV!=null?`AST ${astV}`:""} with ${nm(oral17)} running. `+
        (muscle?`Your GGT is in range, which points away from the liver and toward muscle, and heavy training raises ALT and AST on its own. That's the more reassuring reading, but it isn't proof.`
               :`GGT would help separate liver from muscle here, and it isn't on this panel.`)+
        (biliV!=null&&mStatus("bili",biliV)==="high"?` Bilirubin at ${biliV} is also up, and that combination points at the liver rather than at training.`:``),
        oral17.map(i=>i.name));
    }

    /* PSA drift across two panels */
    const psaV = V("psa"), prev = prevPanel();
    if(psaV!=null&&prev&&prev.m&&prev.m.psa!=null&&androgen.length){
      const d = psaV-Number(prev.m.psa);
      if(d>=0.75)
        L("note","PSA has moved between panels",
          `PSA went from ${trim(Number(prev.m.psa))} on ${prev.date} to ${psaV} now, a rise of ${trim(d)} ng/mL, with ${nm(androgen)} running. A small rise on androgens is expected as the prostate responds. A jump of this size in a year is the threshold most urologists want to look at rather than watch.`,
          androgen.map(i=>i.name));
    }

    /* the lipid picture that orals produce */
    const hdl2 = V("hdl");
    if(hdl2!=null&&mStatus("hdl",hdl2)==="low"&&androgen.length&&!flags.includes("trt"))
      L("note","HDL is low and there are androgens in the stack",
        `HDL at ${hdl2} mg/dL is below range with ${nm(androgen)} running${oral17.length?`, and orals suppress it far harder than injectables do`:``}. ApoB is the marker that carries the actual risk and it's the one to add if this panel didn't include it.`,
        androgen.map(i=>i.name));
  }

  const order = {concern:0,note:1,good:2};
  out.sort((a,b)=>order[a.sev]-order[b.sev]);
  return out;
}

async function commit(){
  const ok = await store.save(S);
  UI.err = ok?"":"Couldn't save. Your changes are on screen but may not survive a reload.";
  render();
}
